        'pioneer housing': { answer: "Most pioneers lived in wagons or tents during the journey, but temporary shelters were also built. At camps, pioneers might construct 'shielings' - simple lean-to structures using wagon covers and tree branches. Some used 'tarpaper shanties' - crude shelters with wooden frames covered in tar-soaked paper. At Winter Quarters and other stops, pioneers built log cabins. The most vulnerable were the handcarters who had only small tents, making the journey even more challenging, especially in bad weather.", sources: [{text:'ğŸ“œ National Park Service - Housing',url:'https://www.nps.gov/mopi/learn/history/pioneer-life.htm'},{text:'ğŸ“œ BYU - Pioneer Shelter',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture/pioneer-shelter-and-camping'}] },
        'pioneer camps': { answer: "Pioneer companies set up camp each evening following a disciplined routine. After a full day of walking or driving wagons, pioneers would: (1) Circle the wagons for safety; (2) Unload cooking supplies; (3) Gather wood and water; (4) Cook meals over campfires; (5) Conduct evening prayers and hymn singing; (6) Post night watches for protection; (7) Sleep in wagons or tents. Each company had a captain who organized the daily schedule and maintained order. The camping routine was essential for safety and morale during the months-long journey.", sources: [{text:'ğŸ“œ National Park Service - Camp Life',url:'https://www.nps.gov/mopi/learn/history/pioneer-camping.htm'},{text:'ğŸ“œ BYU - Daily Life',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture/daily-life-trail'}] },
        'pioneer diseases': { answer: "Disease was the leading cause of death on the Mormon Trail. Common ailments included: (1) Cholera - deadly waterborne disease that struck in epidemics; (2) Typhoid - from contaminated water; (3) Dysentery - severe diarrhea; (4) Mumps and measles - spread through the company; (5) Mountain fever - possibly Rocky Mountain spotted fever. Poor sanitation, contaminated water, and lack of medical knowledge made outbreaks devastating. The handcart companies suffered especially, with disease contributing to the tragedies of 1856.", sources: [{text:'ğŸ“œ Church History - Health',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-life'},{text:'ğŸ“œ National Park Service - Diseases',url:'https://www.nps.gov/mopi/learn/history/pioneer-health.htm'}] },
        'willie handcart company': { answer: "The Willie Handcart Company was one of the most tragic groups in Mormon pioneer history. In 1856, about 500 pioneers left Iowa City in late summer, planning to reach Utah before winter. However, they encountered early snowstorms in Wyoming. Near Pioneer women were the backbone of frontier life, combining practical skills with spiritual strength.", sources: [{text:'ğŸ“œ Church History - Pioneer Women',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-women'},{text:'ğŸ“œ Relief Society History',url:'https://www.churchofjesuschrist.org/study/history/topics/relief-society'}] },
        'pioneer forts': { answer: "Pioneer forts provided protection and community during the westward journey and early settlement. Forts like Fort Laramie, Fort Bridger, and Fort Hall served as rest stops along the Mormon Trail. Pioneers also built their own forts in Utah - Fort Utah, Fort Pierce, and Fort Douglas - for defense against potential threats. The most famous was Winter Quarters (modern-day Omaha, Nebraska), where pioneers spent the winter of 1846-47 before entering Utah. Settlers built log forts as community centers in early Utah towns. These forts often included meetinghouses, trading posts, and defensive walls. The forts represent both the practical need for protection and the pioneer spirit of community cooperation.", sources: [{text:'ğŸ“œ Church History - Winter Quarters',url:'https://www.churchofjesuschrist.org/study/history/topics/winter-quarters'},{text:'ğŸ“œ Pioneer Forts',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture/forts-and-fortifications'}] },
        'pioneer pets': { answer: "Many pioneer families brought pets along on the westward journey. Dogs were the most common companions - they helped guard the camp, hunted game, and provided companionship during the long journey. Some families brought cats to control rodents in wagons. Birds in cages were sometimes carried for food or company. Horses and mules were working animals, not pets. Pets provided emotional comfort, especially for children, during the difficult months on the trail. However, pets had to be cared for alongside the family's other needs.", sources: [{text:'ğŸ“œ National Park Service - Pioneer Life',url:'https://www.nps.gov/mopi/learn/history/pioneer-life.htm'},{text:'ğŸ“œ BYU - Pioneer Animals',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer fire': { answer: "Fire was essential for pioneer survival on the trail. Pioneers used fires for: (1) Cooking meals - bread, biscuits, stews, and coffee; (2) Warmth - especially cold mountain crossings and winter travel; (3) Water purification - boiling stream water to prevent disease; (4) Light - campfires provided illumination at night; (5) Signal fires - in emergencies. Firewood had to be gathered daily at campsites. Pioneers carried flint, steel, or matches to start fires. Women typically managed camp cooking while men gathered wood and water.", sources: [{text:'ğŸ“œ National Park Service - Camp Life',url:'https://www.nps.gov/mopi/learn/history/pioneer-camping.htm'},{text:'ğŸ“œ BYU - Pioneer Daily Life',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture/daily-life-trail'}] },
        'pioneer water': { answer: "Water was critical for pioneer survival on the Mormon Trail. Each person needed about 2 gallons daily for drinking and cooking. Key water sources along the trail included: (1) Rivers - Missouri, Platte, Sweetwater, and Green Rivers; (2) Springs and creeks in mountain passes; (3) Rainwater collected in barrels. Water was often muddy and scarce, especially in desert sections. Pioneers learned to conserve water carefully. Disease spread through contaminated water, making boiling essential. Some companies had difficulty finding water, leading to dehydration and illness.", sources: [{text:'ğŸ“œ National Park Service - Water and Trail',url:'https://www.nps.gov/mopi/learn/history/pioneer-life.htm'},{text:'ğŸ“œ Church History - Pioneer Provisions',url:'https://history.churchofjesuschrist.org/landing/fleeing-illinois/pioneer-provisions'}] },
        'pioneer grass': { answer: "Grass was vital for feeding draft animals on the Mormon Trail. Oxen, horses, and mules needed to graze daily while on the march. Pioneer companies stopped in areas with good grass, called 'grass parks' or 'rich bottoms.' The best grazing was typically near rivers and streams. In desert sections, pioneers carried grass seed to plant for future travelers. Poor grass meant weak animals that couldn't pull wagons, creating serious problems. The quality of grass often determined daily travel distance.", sources: [{text:'ğŸ“œ National Park Service - Animals on Trail',url:'https://www.nps.gov/mopi/learn/history/pioneer-life.htm'},{text:'ğŸ“œ BYU - Pioneer Oxen and Wagons',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture/pioneer-oxen-and-wagons'}] },
        'pioneer firewood': { answer: "Firewood was a daily necessity for pioneers. Each evening, men and boys went to gather wood while women prepared camp. Common fuel sources included: (1) Buffalo chips (dried dung) - used extensively on the plains where trees were scarce; (2) Driftwood - along riverbanks; (3) Tree branches and roots - in forested areas; (4) Sagebrush - in desert regions. Wood was often scarce, so pioneers burned efficiently and shared fuel. Women managed the fire and did most of the cooking. Adequate fuel meant warm meals and protection from cold.", sources: [{text:'ğŸ“œ National Park Service - Camp Life',url:'https://www.nps.gov/mopi/learn/history/pioneer-camping.htm'},{text:'ğŸ“œ BYU - Pioneer Cooking',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture/pioneer-food-and-cooking'}] },
        'pioneer rest days': { answer: "Pioneers observed Sunday as a day of rest whenever possible. On rest days, pioneers would: (1) Skip travel - no walking or wagon movement; (2) Hold church services - hymn singing, prayers, and preaching; (3) Do laundry - wash clothes in streams; (4) Repair equipment - fix wagons, shoes, and clothing; (5) Rest animals - let oxen and horses graze. Not all companies observed Sunday rest, especially in emergencies. The rhythm of rest days helped maintain physical and spiritual strength. Brigham Young encouraged pioneers to keep the Sabbath while on the trail.", sources: [{text:'ğŸ“œ Church History - Pioneer Life',url:'https://www.chum«ëŒ+Š×®º+º$zzb¥ç&6†öf¦W7W66‡&—7Bæ÷&r÷7GVG’ö†—7F÷'’÷F÷–72÷–öæVW"ÖÆ–fRwÒÇ·FW‡C¢	ù9ÂæF–öæÂ&²6W'f–6RÒF–Ç’66†VGVÆRrÇW&Ã¢v‡GG3¢ò÷wwræç2æv÷böÖ÷’öÆV&âö†—7F÷'’÷–öæVW"ÖÆ–fRæ‡FÒwÕÒÒÀ¢w–öæVW"vVF†W"s¢²ç7vW#¢%vVF†W"v2öæRöbF†R&–vvW7B6†ÆÆVævW2–öæVW'2f6VBöâF†RÖ÷&ÖöâG&–Ââ7VÖÖW"'&÷Vv‡C¢–çFVç6R†VB–âFW6W'G2ÂGW7B7F÷&×2ÂæBF‡VæFW'7F÷&×2âv–çFW"FævW'2–æ6ÇVFVC¢&Æ—§¦&G2Âg&VW¦–ærFV×W&GW&W2ÂæB6æ÷râÖ÷VçF–â7&÷76–æw2vW&RW7V6–ÆÇ’†¦&F÷W2v—F‚7VFFVâvVF†W"6†ævW2â–öæVW'2†BFò§VFvRF–Ö–ær6&VgVÆÇ’ÒÆVf–ærFöòÆFR&—6¶VBv–çFW"7F÷&×2†Æ–¶RF†RƒSbG&vVF–W2’Âv†–ÆRÆVf–ærFöòV&Ç’ÖVçB7&÷76–ær7vöÆÆVâ&—fW'2âvVF†W"FWFW&Ö–æVBF–Ç’G&fVÂÂ6×Æö6F–öâÂæB6öÖWF–ÖW27W'f—fÂâF†R–öæVW'2VæGW&VBW‡G&VÖW2Fò&V6‚¦–öââ"Â6÷W&6W3¢··FW‡C¢	ù9ÂæF–öæÂ&²6W'f–6RÒvVF†W"6†ÆÆVævW2rÇW&Ã¢v‡GG3¢ò÷wwræç2æv÷böÖ÷’öÆV&âö†—7F÷'’÷–öæVW"ÖÆ–fRæ‡FÒwÒÇ·FW‡C¢	ù9Â%•RÒ–öæVW"†&G6†—2rÇW&Ã¢v‡GG3¢ò÷'62æ'—RæVGRö&6†—fVB÷–öæVW"ÖÆ–fRÖæBÖ7VÇGW&RwÕÒÒÀ¢w–öæVW"v–ÆBæ–ÖÇ2s¢²ç7vW#¢%v–ÆBæ–ÖÇ2÷6VB&÷F‚÷÷'GVæ—F–W2æBFævW'2öâF†RÖ÷&ÖöâG&–Ââ‡VçF–ær&÷f–FVBg&W6‚ÖVC¢'VffÆòÂFVW"ÂçFVÆ÷RÂæBVÆ²vW&R6öÖÖöââ&V'2æBÖ÷VçF–âÆ–öç2vW&Rö666–öæÆÇ’Væ6÷VçFW&VB–âÖ÷VçF–ç2âvöÇfW2föÆÆ÷vVBvvöâG&– G&–Ã¢ƒ’–æFWVæFVæ6R&ö6²Âw–öÖ–ærÒÖ76—fRw&æ—FR&÷VÆFW"ÂÖ¦÷"v—ö–çC²ƒ"’FWf–Âw2vFRÂw–öÖ–ærÒG&ÖF–2v÷&vRÂ6—FRöbF†RƒSbG&vVG“²ƒ2’–æFWVæFVæ6R&ö6²Òu&Vv—7FW"öbF†RFW6W'Brv†W&R–öæVW'26'fVBæÖW3²ƒB’f÷'G2ÒÆ&Ö–RÂ'&–FvW"ÂæB†ÆÂ6W'fVB2&W7B7F÷3²ƒR’7vVWGvFW"&—fW"Ò7&—F–6ÂvFW"6÷W&6R–âw–öÖ–æs²ƒb’6†–ÖæW’&ö6²ÂæV'&6¶ÒF—7F–æ7F—fRvVöÆöv–6Âf÷&ÖF–öã²ƒr’6ç–öç2ÒV6†òÂvV&W"ÂæBVÖ–w&F–öâ6ç–öç2ÆVB–çFò6ÇBÆ¶RfÆÆW’âÆæFÖ&·2†VÇVB–öæVW'2G&6²&öw&W72æB¶æ÷rF†W’vW&Röâ6÷VÚ±î¸Â¸­yêë¢°k¢G§¦*^ly 200 people died from starvation, exposure, and exhaustion during the famous 'Martin's Cove' rescue. Those who survived were rescued by Mormon volunteers who traveled from Salt Lake City. The tragedy led to a change in Church policy, and later emigrants were advised to leave earlier in the season. The Willie Company included pioneers from England, Scotland, Wales, Denmark, and other European nations.", sources: [{text:'ğŸ“œ Church History - Willie Handcart Company',url:'https://www.churchofjesuschrist.org/study/history/topics/willie-handcart-company'},{text:'ğŸ“œ Pioneer History',url:'https://history.churchofjesuschrist.org/landing/fleeing-illinois/pioneer-provisions'}] },
        'martin handcart company': { answer: "The Martin Handcart Company was the last and most ill-fated of the Mormon handcart companies. In 1856, about 580 men, women, and children left Florence, Nebraska in August, led by Edward Martin. They were delayed by low water crossings and heavy cargo, falling behind schedule. Early snows caught them in Wyoming, and the company was stranded near the Sweetwater River for days. Over 200 died, with many more suffering severe frostbite and death. A rescue party from Salt Lake City eventually reached them. The survivors arrived in Salt Lake Valley in late November 1856. The tragedy remains one of the most poignant chapters in pioneer history, showing both the devotion of early Saints and the terrible cost of late-season travel.", sources: [{text:'ğŸ“œ Church History - Martin Handcart Company',url:'https://www.churchofjesuschrist.org/study/history/topics/martin-handcart-company'},{text:'ğŸ“œ Pioneer Rescue',url:'https://history.churchofjesuschrist.org/landing/fleeing-illinois/pioneer-rescue'}] },
        'handcart pull': { answer: "Pioneers pulled handcarts weighing 70-80 pounds while walking 15-20 miles daily. The carts had two wheels and a wooden frame, designed to carry about 500 pounds of supplies per family. Men, women, and children all took turns pulling. The ropes often cut into shoulders, and the constant pushing and pulling caused severe exhaustion. Handcart companies typically included elderly people, widows, and converts from Europe who couldn't afford wagon fare. The journey from Iowa City to Salt Lake took about 4-5 months. Many pioneers, especially children and the elderly, perished from the physical strain. The handcarts were a symbol of both the desperate poverty of early Mormon emigrants and their incredible faith and determination.", sources: [{text:'ğŸ“œ National Park Service - Handcart Companies',url:'https://www.nps.gov/mopi/learn/history/handcart-companies.htm'},{text:'ğŸ“œ BYU Studies - Handcart Pioneers',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture/pulling-handcart'}] },
        'british converts pioneer': { answer: "Many British converts made the journey to Utah as Mormon pioneers. Between 1840-1860, thousands of British Saints emigrated, forming significant pioneer companies. They came from England, Scotland, Wales, and included skilled craftsmen, farmers, and families. The British converts often brought valuable skills - weaving, mining, farming - that helped build Utah. Many walked alongside American pioneers, sharing the hardships of the trail. Notable British pioneers include John D. Lee, who organized the first company, and many Welsh converts who later founded settlements like LDS colonies in Arizona. The British converts represented one of the largest missionary success stories in early Church history.", sources: [{text:'ğŸ“œ Church History - British Converts',url:'https://www.churchofjesuschrist.org/study/history/topics/immigration'},{text:'ğŸ“œ Millennial Star',url:'https://history.churchofjesuschrist.org/landing/beginning-of-restoration/the-millennial-star'}] },
        'scandinavian pioneers': { answer: "Scandinavian converts - from Denmark, Sweden, and Norway - became an important part of the Mormon pioneer companies. Danes were among the first European converts, and many joined the Willie and Martin Handcart Companies. Danish pioneers brought agricultural knowledge and craftsmanship. Swedes formed the basis of many Utah settlements. Norwegian sailors sometimes converted at sea and joined the trek westward. The journey was particularly difficult for Scandinavians, who were often unused to the harsh American climate. Many Scandinavian names remain in Utah today - Jorgensen, Christensen, Nelson. The Scandinavian converts represent one of the largest successful missionary efforts in LDS history, with thousands making the journey from Northern Europe to Utah.", sources: [{text:'ğŸ“œ Church History - Scandinavian Conversion',url:'https://www.churchofjesuschrist.org/study/history/topics/scandinavian-immigration'},{text:'ğŸ“œ Danish Pioneers',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture/danish-pioneers'}] },
        'pioneer handcart companies': { answer: "Between 1856-1860, about 16 Mormon handcart companies made the journey from Iowa to Utah. The handcart companies were an attempt to reduce costs for poor converts who couldn't afford wagons. The companies typically left in spring and aimed to reach Utah before winter. However, several left too late and suffered tragedies - especially the Willie and Martin companies in 1856. Each company had a captain who maintained order. The handcart companies included converts from Britain, Scandinavia, and America. After 1860, the Church stopped using handcart companies due to the tragedies, returning to wagon companies. The handcart pioneers remain symbols of faith and sacrifice in LDS history.", sources: [{text:'ğŸ“œ National Park Service - Handcart Era',url:'https://www.nps.gov/mopi/learn/history/handcart-era.htm'},{text:'ğŸ“œ Church History Manual',url:'https://www.churchofjesuschrist.org/study/manual/church-history-in-the-fulness-of-times'}] },
        'pioneer wagons plains': { answer: "Pioneer wagons on the Mormon Trail were specifically designed 'chariots' - sturdy canvas-covered wagons about 12 feet long, 4 feet wide, and 3 feet deep. They were built to carry up to 2,000 pounds of supplies. A typical family loaded food, clothing, tools, and sometimes a small stove. The wagons were pulled by oxen, mules, or horses. The famous 'Mormon Trail' ran from Independence, Missouri to Salt Lake Valley - about 1,300 miles. The journey took 4-6 months, depending on weather and conditions. Wagons were arranged in a circle each night for protection. The Conestoga and Studebaker wagons were common brands used. These wagons were the lifeline that allowed thousands to make the journey westward.", sources: [{text:'ğŸ“œ National Park Service - Wagons',url:'https://www.nps.gov/mopi/learn/history/wagons.htm'},{text:'ğŸ“œ Pioneer Travel',url:'https://history.churchofjesuschrist.org/landing/fleeing-illinois/westward-migration'}] },
        'pioneer rescue 1856': { answer: "The 1856 rescue mission was one of the most heroic episodes in Mormon pioneer history. When the Willie and Martin Handcart Companies were trapped by early winter storms, Brigham Young organized a rescue. Volunteers left Salt Lake City with wagons loaded with food, clothing, and medicine. They traveled through deep snow to reach the stranded pioneers. The rescue party, led by George Grant and others, reached Martin's Cove and helped hundreds of freezing, starving pioneers. Many rescue volunteers suffered frostbite helping others. The rescue is remembered as a testament of love and sacrifice. Those rescued included children as young as 6 years old and elderly pioneers over 70. The event is commemorated annually in various Church commemorations.", sources: [{text:'ğŸ“œ Church History - The Rescue',url:'https://www.churchofjesuschrist.org/study/history/topics/martin-handcart-company'},{text:'ğŸ“œ Pioneer Rescue Accounts',url:'https://history.churchofjesuschrist.org/landing/fleeing-illinois/pioneer-rescue'}] },
        'pioneer women': { answer: "Pioneer women bore enormous burdens on the Mormon Trail. They cared for children, cooked meals, washed clothes, and often helped push wagons through mud and sand. Women typically walked 15-20 miles daily while pregnant or carrying infants. They also managed family supplies and cared for the sick. At camp, women prepared food over open fires and mended clothes. Many women kept journals documenting the journey. Notable pioneer women include: Eliza R. Snow (poet and wife of Joseph Smith), Emmeline B. Wells (later Relief Society General President), and Sarah B. Major (who helped organize women's relief efforts). Pioneer women were the backbone of frontier life, combining practical skills with spiritual strength.", sources: [{text:'ğŸ“œ Church History - Pioneer Women',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-women'},{text:'ğŸ“œ Relief Society History',url:'https://www.churchofjesuschrist.org/study/history/topics/relief-society'}] },

"g&öÒW'6V7WF–öââ'V–ÆF–ær¦–öâ&WV—&VC¢ƒ’FV×ÆRv÷&³²ƒ"’W7F&Æ—6†–ær6öÖ×Væ—F–W3²ƒ2’&7F–6–ær6VÆb×&VÆ–æ6S²ƒB’6†&–ærv—F‚V6‚÷F†W"â'&–v†Ò–÷VærFVv‡BF†B¦–öâv2v†W&WfW"f—F†gVÂ6–çG2Æ—fVB&–v‡FV÷W6Ç’âF†R–öæVW"–FVÂöb¦–öâ6öçF–çVW2–â6‡W&6‚7VÇGW&RFöF’â"Â6÷W&6W3¢··FW‡C¢	ù9Â6‡W&6‚†—7F÷'’Ò¦–öârÇW&Ã¢v‡GG3¢ò÷wwræ6‡W&6†öf¦W7W66‡&—7Bæ÷&r÷7GVG’ö†—7F÷'’÷F÷–72÷¦–öâwÒÇ·FW‡C¢	ù9Â%•RÒ–öæVW"¦–öârÇW&Ã¢v‡GG3¢ò÷'62æ'—RæVGRö&6†—fVB÷–öæVW"ÖÆ–fRÖæBÖ7VÇGW&RwÕÒÒÀ¢w–öæVW"6öÖ×Væ—G’s¢²ç7vW#¢%–öæVW"6öÖ×Væ—G’v2'V–ÇBöâ6ö÷W&F–öâæB6†&VBf—F‚âVÆVÖVçG3¢Ú±î¸Â¸­yêë¢°k¢G§¦*^dly serious. Hazards included: (1) Summer heat - 100+ degrees in deserts; (2) Winter blizzards - whiteouts on plains; (3) Mountain snow - even in summer; (4) Thunderstorms - lightning and flash floods; (5) Dust storms - blindness and suffocation risk. Weather determined daily travel. Pioneers watched the sky constantly. Early departure could mean death. Those who respected weather survived. Weather taught pioneers humility before nature.", sources: [{text:'ğŸ“œ National Park Service - Weather',url:'https://www.nps.gov/mopi/learn/history/pioneer-life.htm'},{text:'ğŸ“œ BYU - Pioneer Hardships',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer star navigation': { answer: "Pioneer star navigation guided travelers at night. Key stars: (1) North Star (Polaris) - always north; (2) Big Dipper - points to Polaris; (3) Southern Cross - used in southern hemisphere. Navigation: (1) Find north by Polaris; (2) Judge direction by other constellations; (3) Milky Way showed south at night. Star knowledge came from mountain men and books. Cloudy nights meant uncertainty. The stars were free and always available - an essential pioneer skill.", sources: [{text:'ğŸ“œ National Park Service - Navigation',url:'https://www.nps.gov/mopi/learn/history/pioneer-life.htm'},{text:'ğŸ“œ BYU - Trail Skills',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer prairie dogs': { answer: "Pioneer prairie dogs were common on the plains. Prairie dog facts: (1) Lived in massive colonies - towns miles wide; (2) Barks warned of predators; (3) Tunnels were tripping hazards for animals; (4) Some pioneers ate them when food ran out. Prairie dog towns could cover acres. Their barks were constant companions on the plains. Towns were ecologically important - aerating soil and providing food for predators. Today prairie dogs are protected species.", sources: [{text:'ğŸ“œ National Park Service - Wildlife',url:'https://www.nps.gov/mopi/learn/history/pioneer-life.htm'},{text:'ğŸ“œ Utah History - Prairie Dogs',url:'https://history.utah.gov/topics/pioneer-wildlife/'}] },
        'pioneer snakes': { answer: "Pioneer snakes were hazards on the trail. Snake facts: (1) Rattlesnakes most common danger; (2) Found in rocks, grasslands, and trails; (3) Struck when stepped on or startled; (4) Some pioneers died from venom. Precautions: (1) Watch where stepping; (2) Make noise while walking; (3) Stay on paths; (4)Carry makeshift splints. Pioneers feared snakes less than disease. Snakes were food too - some pioneers ate them. Rattlesnake skins were sometimes used for belts.", sources: [{text:'ğŸ“œ National Park Service - Snake Hazards',url:'https://www.nps.gov/mopi/learn/history/pioneer-life.htm'},{text:'ğŸ“œ BYU - Trail Dangers',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer grass fires': { answer: "Pioneer grass fires were serious dangers. Fire causes: (1) Lightning strikes; (2) Unattended campfires; (3) Careless travelers; (4) Intentional burning by indigenous peoples. Fire dangers: (1) Could engulf entire companies; (2) Destroyed grass needed for animals; (3) Forced detours around burned areas; (4) Could trap travelers with no escape. Precautions: (1) Careful fire building and extinguishing; (2) Watching for smoke on horizon; (3) Carrying water for emergencies. Grass fires taught pioneers respect for fire.", sources: [{text:'ğŸ“œ National Park Service - Fire Dangers',url:'https://www.nps.gov/mopi/learn/history/pioneer-life.htm'},{text:'ğŸ“œ Utah History - Pioneer Fires',url:'https://history.utah.gov/topics/pioneer-life/'}] },
        'pioneer desert travel': { answer: "Pioneer desert travel was the hardest part. Desert challenges: (1) Extreme heat - 120 degrees possible; (2) Little water - major concern; (3) Soft sand - difficult walking; (4) Mirage - confusing travelers. Desert strategy: (1) Travel at night when possible; (2) Carry maximum water; (3) Move quickly through dangerous areas; (4) Rest during midday heat. Some companies lost people to desert dehydration. Deserts tested even the strongest pioneers. Proper preparation was essential for desert survival.", sources: [{text:'ğŸ“œ National Park Service - Desert Travel',url:'https://www.nps.gov/mopi/learn/history/pioneer-life.htm'},{text:'ğŸ“œ BYU - Pioneer Challenges',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer mountain passages': { answer: "Pioneer mountain passages were treacherous. Key challenges: (1) Narrow trails - wagons barely fit; (2) Steep grades - required oxen double-teamed; (3) Rock slides - danger from above; (4) Cold temperatures - even in summer. Routes: (1) Rocky Mountains - highest barrier; (2) Sierra Nevada - California route; (3) Wasatch - final Utah mountains. Mountain guides were essential. One wrong turn could be fatal. Mountains separated the prepared from the desperate.", sources: [{text:'ğŸ“œ National Park Service - Mountain Passes',url:'https://www.nps.gov/mopi/learn/history/pioneer-life.htm'},{text:'ğŸ“œ BYU - Trail Geography',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer immigration': { answer: "Pioneer immigration brought converts to America. Immigration: (1) Convert migrations from Europe to Utah; (2) Over 80,000 pioneers between 1847-1869; (3) Major waves from Britain, Scandinavia, America; (4) Immigration continued via trains after 1869. Immigration pattern: First convert, then save for family's migration. Perpetual Emigrating Fund helped poor converts. Immigrants often left everything to gather to Zion. Immigration was acts of faith and sacrifice. Immigration continues today in missionary work.", sources: [{text:'ğŸ“œ Church History - Pioneer Immigration',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-immigration'},{text:'ğŸ“œ Utah History - Immigration',url:'https://history.utah.gov/topics/pioneer-immigration/'}] },
        'pioneer company size': { answer: "Pioneer company size varied. Sizes: (1) Small companies - 50-100 people; (2) Medium companies - 100-300; (3) Large companies - 300-500; (4) Handcart companies - 300-600. Company size: (1) Affected speed and organization; (2) Determining resource needs; (3) Impacted daily schedule. Larger companies were safer but slower. Smaller companies moved faster but at risk. Company size was carefully planned. Brigham Young approved company sizes.", sources: [{text:'ğŸ“œ Church History - Company Organization',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-life'},{text:'ğŸ“œ National Park Service - Companies',url:'https://www.nps.gov/mopi/learn/history/pioneer-life.htm'}] },
        'pioneer captains': { answer: "Pioneer company captains led each group. Captains' duties: (1) Making daily decisions; (2) Maintaining discipline; (3) Ensuring safety; (4) Leading worship services; (5) Contact with Church leaders. Captains were experienced leaders. Some were Church elders, mountain men, or military veterans. Captains were chosen for wisdom and faith. They carried heavy responsibility. Captains answered to Church leadership. Good captains saved lives.", sources: [{text:'ğŸ“œ Church History - Company Captains',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-life'},{text:'ğŸ“œ BYU - Trail Leadership',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer company president': { answer: "Each pioneer company had a president. President duties: (1) Overall leadership of company; (2) Contact with Brigham Young; (3) Major decisions and direction; (4) Spiritual oversight; (5) Company discipline. Presidents received direct instructions. They coordinated with captains. Presidents were senior Church leaders. Their decisions affected everyone's lives. Presidents led Sunday worship and prayers. Their wisdom guided company success.", sources: [{text:'ğŸ“œ Church History - Company Presidents',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-life'},{text:'ğŸ“œ BYU - Pioneer Leadership',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer wagon trains': { answer: "Pioneer wagon trains were the caravan. Wagon train organization: (1) Groups of 10-50 wagons; (2) Oxen and horses pulling; (3) Livestock trailing; (4) People walking and riding. Wagon trains moved 10-20 miles daily. Trains circled at night for safety. Trains required coordination. Captains led each train division. Train organization was essential for safety.", sources: [{text:'ğŸ“œ National Park Service - Wagon Trains',url:'https://www.nps.gov/mopi/learn/history/pioneer-wagons.htm'},{text:'ğŸ“œ BYU - Wagon Train Organization',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },

w&F–öârÇW&Ã¢v‡GG3¢ò÷wwræ6‡W&6†öf¦W7W66‡&—7Bæ÷&r÷7GVG’ö†—7F÷'’÷F÷–72÷–öæVW"Ö–ÖÖ–w&F–öâwÒÇ·FW‡C¢	ù9ÂWF‚†—7F÷'’Ò–ÖÖ–w&F–öârÇW&Ã¢v‡GG3¢òö†—7F÷'’çWF‚æv÷b÷F÷–72÷–öæVW"Ö–ÖÖ–w&F–öâòwÕÒÒÀ¢w–öæVW"6ö×ç’6—¦Rs¢²ç7vW#¢%–öæVW"6ö×ç’6—¦Rf&–VBâ6—¦W3¢ƒ’6ÖÆÂ6ö×æ–W2ÒSÓV÷ÆS²ƒ"’ÖVF—VÒ6ö×æ–W2ÒÓ3²ƒ2’Æ&vR6ö×æ–W2Ò3ÓS²ƒB’†æF6'B6ö×æÚ±î¸Â¸­yêë¢°k¢G§¦*^ies - 300-600. Company size: (1) Affected speed and organization; (2) Determining resource needs; (3) Impacted daily schedule. Larger companies were safer but slower. Smaller companies moved faster but at risk. Company size was carefully planned. Brigham Young approved company sizes.", sources: [{text:'ğŸ“œ Church History - Company Organization',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-life'},{text:'ğŸ“œ National Park Service - Companies',url:'https://www.nps.gov/mopi/learn/history/pioneer-life.htm'}] },
        'pioneer captains': { answer: "Pioneer company captains led each group. Captains' duties: (1) Making daily decisions; (2) Maintaining discipline; (3) Ensuring safety; (4) Leading worship services; (5) Contact with Church leaders. Captains were experienced leaders. Some were Church elders, mountain men, or military veterans. Captains were chosen for wisdom and faith. They carried heavy responsibility. Captains answered to Church leadership. Good captains saved lives.", sources: [{text:'ğŸ“œ Church History - Company Captains',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-life'},{text:'ğŸ“œ BYU - Trail Leadership',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer company president': { answer: "Each pioneer company had a president. President duties: (1) Overall leadership of company; (2) Contact with Brigham Young; (3) Major decisions and direction; (4) Spiritual oversight; (5) Company discipline. Presidents received direct instructions. They coordinated with captains. Presidents were senior Church leaders. Their decisions affected everyone's lives. Presidents led Sunday worship and prayers. Their wisdom guided company success.", sources: [{text:'ğŸ“œ Church History - Company Presidents',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-life'},{text:'ğŸ“œ BYU - Pioneer Leadership',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer wagon trains': { answer: "Pioneer wagon trains were the caravan. Wagon train organization: (1) Groups of 10-50 wagons; (2) Oxen and horses pulling; (3) Livestock trailing; (4) People walking and riding. Wagon trains moved 10-20 miles daily. Trains circled at night for safety. Trains required coordination. Captains led each train division. Train organization was essential for safety.", sources: [{text:'ğŸ“œ National Park Service - Wagon Trains',url:'https://www.nps.gov/mopi/learn/history/pioneer-wagons.htm'},{text:'ğŸ“œ BYU - Wagon Train Organization',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer departure': { answer: "Pioneer departure from Nauvoo and Winter Quarters was emotional. Departure day: (1) Final goodbyes to friends; (2) Loading wagons and animals; (3) Prayer and blessing from leader; (4) First srch History - Tithing',url:'https://www.churchofjesuschrist.org/study/history/topics/tithing'},{text:'ğŸ“œ BYU - Pioneer Finance',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer word of wisdom': { answer: "Pioneer word of wisdom was observed. Word of wisdom: (1) No alcohol or tobacco; (2) Coffee or tea avoided; (3) Herbs used medicinally; (4) Meat eaten sparingly. Pioneers were healthier for obeying. The Word of Wisdom was early revelation. Some pioneers struggled with observance. Health was blessing.", sources: [{text:'ğŸ“œ Church History - Word of Wisdom',url:'https://www.churchofjesuschrist.org/study/history/topics/word-of-wisdom'},{text:'ğŸ“œ D&C 89',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/89'}] },
        'pioneer missionary': { answer: "Pioneer missionary efforts bore fruit. Conversion led to immigration. Missionaries: (1) Converted new members; (2) Taught families; (3) Helped gather to Zion; (4) Wrote home churches. Many converted and then gathered. Missionary work was essential to pioneer migration. Success was measured in converts. Missions strengthened faith.", sources: [{text:'ğŸ“œ Church History - Missions',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-life'},{text:'ğŸ“œ BYU - Pioneer Evangelism',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer baptisms': { answer: "Pioneer baptisms were key moments. Baptisms: (1) In rivers or streams; (2) When arriving in valley; (3) For new converts; (4) At pioneer meetings. Baptism meant new beginning. Cold water in winter was difficult. Baptism was testimony of faith. Baptism united pioneers with Christ.", sources: [{text:'ğŸ“œ Church History - Pioneer Baptisms',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-life'},{text:'ğŸ“œ BYU - Pioneer Rites',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer temple work': { answer: "Pioneer temple work created eternal blessings. Work included: (1) Endowments; (2) Proxy baptisms; (3) Sealings for families; (4) Work for dead. Temple work was priority. Work required sacrifice. Temples were distant. Spiritual progress was eternal.", sources: [{text:'ğŸ“œ Church History - Temple Work',url:'https://www.churchofjesuschrist.org/study/history/topics/temple-work'},{text:'ğŸ“œ BYU - Pioneer Temples',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer genealogy': { answer: "Pioneer genealogy connected families. Genealogy: (1) Family names recorded; (2) Ancestors remembered; (3) Temple work for dead; (4) Family history preserved. Finding ancestors was important. Temple work united families. Genealogy motivated pioneers. Family connections continue today.", sources: [{text:'ğŸ“œ Church History - Genealogy',url:'https://www.churchofjesuschrist.org/study/history/topics/genealogy'},{text:'ğŸ“œ Utah History - Family History',url:'https://history.utah.gov/topics/pioneer-genealogy/'}] },
        'pioneer relief society': { answer: "Pioneer Relief Society was vital. Relief Society: (1) Women's organization; (2) Visited sick and poor; (3)Provided supplies; (4) Organized assistance. Pioneers depended on each other. Women led Relief efforts. Support was essential. Relief Society continues today.", sources: [{text:'ğŸ“œ Church History - Relief Society',url:'https://www.churchofjesuschrist.org/study/history/topics/relief-society'},{text:'ğŸ“œ BYU - Pioneer Women',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer sunday school': { answer: "Pioneer Sunday School educated. Sunday School: (1) Taught doctrine; (2) Studied scriptures; (3) Children learned; (4) Adults taught. Learning happened despite hardships. Teachers were volunteers. Education was valued. Sunday School built knowledge.", sources: [{text:'ğŸ“œ Church History - Sunday School',url:'https://www.churchofjesuschrist.org/study/history/topics/sunday-school'},{text:'ğŸ“œ BYU - Pioneer Education',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer young women': { answer: "Pioneer Young Women prepared youth. Young Women: (1) Taught young women; (2) Learned homemaking; (3) Developed testimony; (4) Served others. Young women faced hard work. They prepared for marriage. They learned to help others. Young women built communities.", sources: [{text:'ğŸ“œ Church History - Young Women',url:'https://www.churchofjesuschrist.org/study/history/topics/young-women'},{text:'ğŸ“œ Utah History - Pioneer Youth',url:'https://history.utah.gov/topics/pioneer-youth/'}] },
        'pioneer young men': { answer: "Pioneer Young Men taught duty. Young Men: (1) Learned priesthood; (2) Served in duties; (3) Worked hard; (4) Prepared for leadership.Young men worked alongside fathers. They learned responsibility. They served the Church. Young men became leaders.", sources: [{text:'ğŸ“œ Church History - Young Men',url:'https://www.churchofjesuschrist.org/study/history/topics/aaronic-priesthood'},{text:'ğŸ“œ BYU - Pioneer Youth',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer primary': { answer: "Pioneer Primary taught children. Primary: (1) Singing songs; (2) Learning simple truths; (3) Playing games; (4) Memorizing scriptures. Children learned early. Simple lessons mattered. Children were important. Primary built foundation.", sources: [{text:'ğŸ“œ Church History - Primary',url:'https://www.churchofjesuschrist.org/study/history/topics/primary'},{text:'ğŸ“œ BYU - Pioneer Children',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer seminary': { answer: "Pioneer seminary taught youth. Seminary: (1) Daily scripture study; (2) Gospel instruction; (3) Young people taught; (4) Leadership trained. Young people learned early. Seminary prepared leaders. Learning was valued. Seminary changed lives.", sources: [{text:'ğŸ“œ Church History - Seminary',url:'https://www.churchofjesuschrist.org/study/history/topics/seminary'},{text:'ğŸ“œ BYU - Pioneer Training',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },

        'pioneer trails': { answer: "Pioneer trails led west. Trails: (1) Oregon Trail most famous; (2) California Trail; (3) Mormon Trail; (4) Santa Fe Trail. Trails connected east to west. Travel was difficult. Trails were marked. Many traveled trails. Trails shaped history.", sources: [{text:'ğŸ“œ Church History - Trails',url:'https://www.churchofjesuschrist.org/study/history/topics/trails'},{text:'ğŸ“œ National Park - Trails',url:'https://www.nps.gov/mopi/learn/history/pioneer-trails.htm'}] },
        'pioneer forts': { answer: "Pioneer forts provided protection. Forts: (1) Salt Lake Fort first; (2) Fort Douglas; (3) Fort Bridger; (4) Deseret Fort. Forts protected from threats. Forts were gathering places. Forts provided safety. Building forts was priority. Forts shaped settlement.", sources: [{text:'ğŸ“œ Church History - Forts',url:'https://www.churchofjesuschrist.org/study/history/topics/forts'},{text:'ğŸ“œ Utah History - Fortifications',url:'https://history.utah.gov/topics/pioneer-forts/'}] },
        'pioneer bridges': { answer: "Pioneer bridges crossed streams. Bridges: (1) Wooden bridges built; (2) Stone bridges; (3) Covered bridges; (4) Simple logs. Bridges were essential. Streams needed crossing. Building bridges was hard. Bridges connected communities. Bridge building was skill.", sources: [{text:'ğŸ“œ Church History - Bridges',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-life'},{text:'ğŸ“œ Utah History - Structures',url:'https://history.utah.gov/topics/pioneer-bridges/'}] },
        'pioneer ferries': { answer: "Pioneer ferries crossed rivers. Ferries: (1) Crossed large rivers; (2) Used boats; (3) Provided transport; (4) Collected fees. Ferries made crossing possible. Rivers were barriers. Ferries were businesses. River travel required ferries. Ferries were essential.", sources: [{text:'ğŸ“œ Church History - Ferries',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-life'},{text:'ğŸ“œ Utah History - River Crossing',url:'https://history.utah.gov/topics/pioneer-ferries/'}] },
        'pioneer stagecoaches': { answer: "Pioneer stagecoaches carried passengers. Stagecoaches: (1) Carried mail too; (2) Rushed travel; (3) Rough roads; (4) Schedule important. Stagecoaches were faster than wagons. Travel was uncomfortable. Stagecoaches changed communication. Stagecoaches connected towns. Stagecoach travel was rough.", sources: [{text:'ğŸ“œ Cities. Water shaped settlement.", sources: [{text:'ğŸ“œ Church History - Irrigation',url:'https://www.churchofjesuschrist.org/study/history/topics/irrigation'},{text:'ğŸ“œ Utah History - Water',url:'https://history.utah.gov/topics/pioneer-irrigation/'}] },
        'pioneer mills': { answer: "Pioneer mills processed grain. Mills: (1) Grinded wheat; (2) Made flour; (3) Processed corn; (4) Produced lumber. Mills were essential. Without mills, no bread. Mills required water power. Travel to mills was common. Mills were community hubs.", sources: [{text:'ğŸ“œ Church History - Mills',url:'https://www.churchofjesuschrist.org/study/history/topics/mills'},{text:'ğŸ“œ BYU - Pioneer Industry',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer trade': { answer: "Pioneer trade kept economy alive. Trade: (1) Goods exchanged; (2) Markets existed; (3) Trading posts; (4) Barter common. Trade was essential for survival. Essential goods were traded. Markets were gathering places. Money was rare. Trade built relationships.", sources: [{text:'ğŸ“œ Church History - Trade',url:'https://www.churchofjesuschrist.org/study/history/topics/trade'},{text:'ğŸ“œ Utah History - Economy',url:'https://history.utah.gov/topics/pioneer-economy/'}] },
        'pioneer currency': { answer: "Pioneer currency was limited. Currency: (1) US dollars used; (2) Barter common; (3) Tradable goods; (4) Labor traded. Money was scarce. Most transactions were barter. Labor had value. Trade goods served as money. Currency evolved as Utah grew.", sources: [{text:'ğŸ“œ Church History - Money',url:'https://www.churchofjesuschrist.org/study/history/topics/economy'},{text:'ğŸ“œ Utah History - Currency',url:'https://history.utah.gov/topics/pioneer-currency/'}] },
        'pioneer goods': { answer: "Pioneer goods were essential supplies. Goods: (1) Flour and sugar; (2) Coffee and tea; (3) Cloth and thread; (4) Tools and nails. Goods were packed carefully. Essential goods were scarce. Some goods were luxury. Goods determined survival.", sources: [{text:'ğŸ“œ Church History - Goods',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-life'},{text:'ğŸ“œ BYU - Pioneer Supplies',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer merchants': { answer: "Pioneer merchants ran businesses. Merchants: (1) Sold goods; (2) Operated stores; (3) Trading posts; (4) Markets. Merchants were essential. Trade required merchants. Merchants traveled. Stores were gathering places. Merchants served communities.", sources: [{text:'ğŸ“œ Church History - Merchants',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-life'},{text:'ğŸ“œ Utah History - Business',url:'https://history.utah.gov/topics/pioneer-business/'}] },
        'pioneer industry': { answer: "Pioneer industry built economy. Industry: (1) Mining important; (2) Lumber mills; (3) Tan yards; (4) Brick making. Industry created jobs. Raw materials were available. Industry required labor. Towns grew around industry. Industry shaped Utah.", sources: [{text:'ğŸ“œ Church History - Industry',url:'https://www.churchofjesuschrist.org/study/history/topics/industry'},{text:'ğŸ“œ Utah History - Industrial',url:'https://history.utah.gov/topics/pioneer-industry/'}] },
        'pioneer mining': { answer: "Pioneer mining extracted minerals. Mining: (1) Gold and silver; (2) Copper discovered; (3) Lead used; (4) Coal for fuel. Mining was dangerous. Miners worked hard. Mining towns grew. Minerals built Utah. Mining created wealth.", sources: [{text:'ğŸ“œ Church History - Mining',url:'https://www.churchofjesuschrist.org/study/history/topics/mining'},{text:'ğŸ“œ Utah History - Minerals',url:'https://history.utah.gov/topics/pioneer-mining/'}] },
        'pioneer lumber': { answer: "Pioneer lumber built structures. Lumber: (1) Sawmills processed; (2) Pine common; (3) Cedar valued; (4) Cottonwood used. Lumber was essential for buildings. Sawmills were vital. Trees provided materials. Lumber built homes. Lumber was industry.", sources: [{text:'ğŸ“œ Church History - Lumber',url:'https://www.churchofjesuschrist.org/study/history/topics/lumber'},{text:'ğŸ“œ Utah History - Timber',url:'https://history.utah.gov/topics/pioneer-timber/'}] },
        'pioneer brick': { answer: "Pioneer brick built permanent structures. Brick: (1) Made locally; (2) Adobe used; (3) Fired in kilns; (4) Built homes. Brick was durable. Brick buildings remain today. Making brick was hard. Adobe was alternative. Brick represented permanence.", sources: [{text:'ğŸ“œ Church History - Brick',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-life'},{text:'ğŸ“œ BYU - Pioneer Buildings',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer hotels': { answer: "Pioneer hotels welcomed travelers. Hotels: (1) Stayed travelers; (2) Meals served; (3) Stables attached; (4) Gathering places. Hotels were social hubs. Travelers needed shelter. Hotels made travel possible. Meals were served. Hotels served communities.", sources: [{text:'ğŸ“œ Church History - Hotels',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-life'},{text:'ğŸ“œ Utah History - Hospitality',url:'https://history.utah.gov/topics/pioneer-hospitity/'}] },
        'pioneer restaurants': { answer: "Pioneer restaurants fed travelers. Restaurants: (1) Meals served; (2) Stopping point; (3) Social hubs; (4) Lodging nearby. Restaurants were social. Food was essential. Travelers needed meals. Restaurants served community. Eating out was luxury.", sources: [{text:'ğŸ“œ Church History - Restaurants',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-life'},{text:'ğŸ“œ Utah History - Food Service',url:'https://history.utah.gov/topics/pioneer-food/'}] },
        'pioneer banks': { answer: "Pioneer banks stored money. Banks: (1) Deposits kept; (2) Loans made; (3) Currency exchanged; (4) Financial services. Banks were trusted. Money needed protection. Banks helped economy. Financial services grew. Banks were essential.", sources: [{text:'ğŸ“œ Church History - Banks',url:'https://www.churchofjm«ëŒ+Š×®º+º$zzb¥æW7W66‡&—7Bæ÷&r÷7GVG’ö†—7F÷'’÷F÷–72öV6öæö×’wÒÇ·FW‡C¢	ù9ÂWF‚†—7F÷'’Òf–ææ6RrÇW&Ã¢v‡GG3¢òö†—7F÷'’çWF‚æv÷b÷F÷–72÷–öæVW"Ö&æ·2òwÕÒÒÀ¢w–öæVW"&öG2s¢²ç7vW#¢%–öæVW"&öG26öææV7FVB6öÖ×Væ—F–W2â&öG3¢ƒ’G&–Â&öG2W6VC²ƒ"’–×&÷fVB÷fW"F–ÖS²ƒ2’Ö÷VçF–ç27&÷76VC²ƒB’FW6W'G27&÷76VBâ&öG2vW&RW76VçF–ÂâG&fVÂ&WV—&VB&öG2âV&Ç’&öG2vW&R7'VFRâ&öG2–×&÷fVB÷fW"F–ÖRâ&öG26öææV7FVBWF‚â"Â6÷W&6W3¢··FW‡C¢	ù9Â6‡W&6‚†—7F÷'’Ò&öG2rÇW&Ã¢v‡GG3¢ò÷wwræ6‡W&6†öf¦W7W66‡&—7Bæ÷&r÷7GVG’ö†—7F÷'’÷F÷–72÷&öG2wÒÇ·FW‡C¢	ù9ÂWF‚†—7F÷'’Ò†–v‡v—2rÇW&Ã¢v‡GG3¢òö†—7F÷'’çWF‚æv÷b÷F÷–72÷–öæVW"×&öG2òwÕÒÒÀ¢w–öæVW"G&–Ç2s¢²ç7vW#¢%–öæVW"G&–Ç2ÆVBvW7BâG&–Ç3¢ƒ’÷&VvöâG&–ÂÖ÷7BfÖ÷W3²ƒ"’6Æ–f÷&æ–G&–Ã²ƒ2’Ö÷&ÖöâG&–Ã²ƒB’6çFfRG&–ÂâG&–Ç26öææV7FVBV7BFòvW7BâG&fVÂv2F–ff–7VÇBâG&–Ç2vW&RÖ&¶VBâÖç’G&fVÆVBG&–Ç2âG&–Ç26†VB†—7F÷'’â"Â6÷W&6W3¢··FW‡C¢	ù9Â6‡W&6‚†—7F÷'’ÒG&–Ç2rÇW&Ã¢v‡GG3¢ò÷wwræ6‡W&6†öf¦W7W66‡&—7Bæ÷&r÷7GVG’ö†—7F÷'’÷F÷–72÷G&–Ç2wÒÇ·FW‡C¢	ù9ÂæF–öæÂ&²ÒG&–Ç2rÇW&Ã¢v‡GG3¢ò÷wwræç2æv÷böÖ÷’öÆV&âö†—7F÷'’÷–öæVW"×G&–Ç2æ‡FÒwÕÒÒÀ¢w–öæVW"f÷'G2s¢²ç7vW#¢%–öæVW"f÷'G2&÷f–FVB&÷FV7F–öââf÷'G3¢ƒ’6ÇBÆ¶Rf÷'Bf—'7C²ƒ"’f÷'BF÷VvÆ3²ƒ2’f÷'B'&–FvW#²ƒB’FW6W&WBf÷'Bâf÷'G2&÷FV7FVBg&öÒF‡&VG2âf÷'G2vW&RvF†W&–ærÆ6W2âf÷'G2&÷f–FVB6fWG’â'V–ÆF–ærf÷'G2v2&–÷&—G’âf÷'G26†VB6WGFÆVÖVçBâ"Â6÷W&6W3¢··FW‡C¢	ù9Â6‡W&6‚†—7F÷'’Òf÷'G2rÇW&Ã¢v‡GG3¢ò÷wwræ6‡W&6†öf¦W7W66‡&—7Bæ÷&r÷7GVG’ö†—7F÷'’÷F÷–72öf÷'G2wÒÇ·FW‡C¢	ù9ÂWF‚†—7F÷'’Òf÷'F–f–6F–öç2rÇW&Ã¢v‡GG3¢òö†—7F÷'’çWF‚æv÷b÷F÷–72÷–ö
