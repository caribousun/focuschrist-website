sired.' This is the watering of the soul â€” spiritual nourishment through Christ and His servants. \n\n**The connection:** Both teach that spiritual nourishment comes through Christ. The Samaritan woman sought physical water; Jesus offered spiritual water that satisfies forever. In the allegory, the Lord carefully waters and tends the tree â€” meaning He carefully tends to US, His spiritual children. \n\n**The application:** Are you drinking from the right source? The world's water leaves you thirsting again. The living water of Christ satisfies permanently. This is part of why He taught at wells â€” He knows we come seeking, and He offers what truly satisfies.", sources: [{text:'ğŸ“œ John 4:10',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/john/4.10'},{text:'ğŸ“œ Jacob 5:15-25',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/jacob/5.15'},{text:'ğŸ“œ John 7:37-39',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/john/7.37'},{text:'ğŸ“œ Isaiah 58:11',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/58.11'}] },
        'is it true': { answer: "That's a great question â€” one that many people ask. The answer comes through personal prayer and feeling the Holy Ghost. Moroni 10:4-5 invites you to ask God with sincere intent if this is true. Look for evidence in the Restoration, the Book of Mormon, and the teachings that resonate with your heart.", sources: [{text:'ğŸ“œ Moroni 10:4-5',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/morm/10.4'},{text:'ğŸ• How do I know its true?',url:'https://www.churchofjesuschrist.org/study/topics/knowing-the-church-is-true'}] },
        'old testament': { answer: "The Old Testament is the first division of the Christian Bible, containing books written before the birth of Jesus Christ. It includes the Torah (Genesis-Deuteronomy), historical books, poetry, wisdom literature, and major and minor prophets. Latter-day Saints believe the Old Testament contains God's word and testifies of Jesus Christ.", sources: [{text:'ğŸ“œ Old Testament',url:'https://www.churchofjesuschrist.org/study/scriptures/ot'}] },
        'genesis': { answer: "Genesis is the first book of the Old Testament, written by Moses. It describes the Creation, the Fall of Man, the Flood, and the lives of the patriarchs Abraham, Isaac, Jacob, and Joseph. It establishes the plan of salvation and God's covenant with His children.", sources: [{text:'ğŸ“œ Genesis',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/gen'}] },
        'exodus': { answer: "Exodus tells the story of Israel's deliverance from Egyptian bondage, the giving of the Law at Mount Sinai, and the building of the Tabernacle. Moses led the people out of Egypt and received the Ten Commandments.", sources: [{text:'ğŸ“œ Exodus',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/ex'}] },
        'leviticus': { answer: "Leviticus contains instructions for priests and the people of Israel about sacrifices, cleanliness, and holy days. It explains the law of Moses and the sacred ordinances that pointed forward to the Atonement of Jesus Christ.", sources: [{text:'ğŸ“œ Leviticus',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/lev'}] },
        'numbers': { answer: "Numbers records the journey of Israel from Sinai to the Promised Land. It includes the census of the tribes, the wilderness wanderings, and the laws given to guide the people toward Canaan.", sources: [{text:'ğŸ“œ Numbers',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/num'}] },
        'deuteronomy': { answer: "Deuteronomy contains Moses' farewell addresses to Israel. He reminds them of their journey, repeats the law, and urges obedience. Moses blesses the tribes and predicts the scattering and eventual restoration of Israel.", sources: [{text:'ğŸ“œ Deuteronomy',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/deut'}] },

        'james': { answer: "James teaches that faith without works is dead. He addresses trials, temptations, favoritism, and the power of the tongue. He emphasizes that pure religion is to care for widows and orphans.", sources: [{text:'ğŸ“œ James',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/james'}] },
        '1 peter': { answer: "1 Peter encourages Saints suffering for their faith. He teaches about Christ's suffering, the importance of holiness, and the hope of eternal inheritance through the resurrection.", sources: [{text:'ğŸ“œ 1 Peter',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet'}] },
        '2 peter': { answer: "2 Peter warns against false teachers and encourages growth in knowledge. Peter testifies of his eyewitness experience of Christ's transfiguration and promises a new heaven and earth.", sources: [{text:'ğŸ“œ 2 Peter',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/2-pet'}] },
        '1 john': { answer: "1 John emphasizes love and fellowship with God. He teaches that God is light and love, that we must keep His commandments, and that we can know we have eternal life through the Spirit.", sources: [{text:'ğŸ“œ 1 John',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/1-jn'}] },
        '2 john': { answer: "2 John warns against deceivers and encourages love in truth. It emphasizes the importance of abiding in the doctrine of Christ and not supporting those who deny the Incarnation.", sources: [{text:'ğŸ“œ 2 John',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/2-jn'}] },
        '3 john': { answer: "3 John praises Gaius for his hospitality to traveling teachers. It contrasts with Diotrephes, who refused to welcome the Saints. It teaches the importance of supporting those who preach the truth.", sources: [{text:'ğŸ“œ 3 John',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/3-jn'}] },
        'jude': { answer: "Jude warns against false teachers and describes the characteristics of ungodly men. He encourages the Saints to contend for the faith and to keep themselves in the love of God.", sources: [{text:'ğŸ“œ Jude',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/ Jude'}] },
        'revelation': { answer: "Revelation is a prophetic book given to John on the island of Patmos. It contains visions of the end times, the seven churches, the tribulation, and the ultimate victory of Christ. It ends with the promise of a new heaven and earth.", sources: [{text:'ğŸ“œ Revelation',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/rev'}] },
        'gospel': { answer: "The Gospels are the first four books of the New Testamentâ€”Matthew, Mark, Luke, and Johnâ€”that tell the story of Jesus Christ's mortal life, teachings, Atonement, death, and resurrection. Each gospel presents Jesus from a different perspective.", sources: [{text:'ğŸ“œ Gospel',url:'https://www.churchofjesuschrist.org/study/topics/gospels'},{text:'ğŸ“œ Matthew',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/matt'},{text:'ğŸ“œ Mark',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/mark'},{text:'ğŸ“œ Luke',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/luke'},{text:'ğŸ“œ John',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/john'}] },
        'epistle': { answer: "Epistles are letters written to early Christian congregations or individuals. New Testament epistles (Romans through Jude) teach doctrine, address problems, and encourage faithfulness. They provide guidance for Church organization and Christian living.", sources: [{text:'ğŸ“œ New Testament Epistles',url:'https://www.churchofjesuschrist.org/study/topics/paul-epistles'},{text:'ğŸ“œ Romans',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/rom'},{text:'ğŸ“œ Hebrews',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/heb'}] },
        'matthew': { answer: "The Gospel of Matthew was written to show Jesus as the promised Messiah. It includes the Sermon on the Mount, parables, and the Great Commission.", sources: [{text:'ğŸ“œ Matthew',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/matt'}] },
        'mark': { answer: "Mark's Gospel emphasizes Jesus as the Servant, focusing on His actions rather than teachings. It is the shortest gospel.", sources: [{text:'ğŸ“œ Mark',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/mark'}] },
        'luke': { answer: "Luke, a physician, wrote the longest gospel with detailed accounts of Jesus' birth and ministry. He also wrote Acts.", sources: [{text:'ğŸ“œ Luke',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/luke'}] },
        'john': { answer: "John's Gospel testifies that Jesus is the Christ, the Son of God. It includes the Bread of Life discourse and emphasizes Christ's divine nature.", sources: [{text:'ğŸ“œ John',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/john'}] },
        'romans': { answer: "Romans is Paul's greatest theological epistle, explaining justification by faith and the plan of salvation.", sources: [{text:'ğŸ“œ Romans',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/rom'}] },
        'book of mormon': { answer: "The Book of Mormon is another testament of Jesus Christ. It was written by ancient prophets in the Americas and translated by Joseph Smith. It contains the fullness of the gospel.", sources: [{text:'ğŸ“œ Book of Mormon',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm'},{text:'ğŸ“œ Moroni 10:4-5',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/morm/10.4'}] },
        '1 nephi': { answer: "1 Nephi begins the Book of Mormon. Lehi's family leaves Jerusalem and travels to the promised land. It includes Lehi's vision and Nephi's teachings.", sources: [{text:'ğŸ“œ 1 Nephi',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne'}] },
        '2 nephi': { answer: "2 Nephi contains Jacob's teachings, the poetry of Isaiah, and the doctrine of Christ. It teaches about the Atonement, agency, and the Messiah.", sources: [{text:'ğŸ“œ 2 Nephi',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne'}] },
        'alma': { answer: "Alma the Younger's teachings are among the most doctrinal in the Book of Mormon. It includes the allegory of the olive tree and the Atonement.", sources: [{text:'ğŸ“œ Alma',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma'}] },
        'helaman': { answer: "Helaman records the period of inequality, secret combinations, and Samuel the Lamanite. It testifies of Christ.", sources: [{text:'ğŸ“œ Helaman',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel'}] },
        'moroni': { answer: "Moroni was the final prophet in the Book of Mormon. He wrote the testimonies and the promise to ask God with sincere intent.", sources: [{text:'ğŸ“œ Moroni',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/morm'}] },
        'doctrine and covenants': { answer: "The Doctrine and Covenants is a collection of revelations given through Joseph Smith and modern prophets. It contains sections on church organization, temple work, and latter-day revelation.", sources: [{text:'ğŸ“œ D&C',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament'}] },
        'pearl of great price': { answer: "The Pearl of Great Price contains the Book of Moses, Abraham, Joseph Smith-Matthew, and Joseph Smith-History. It clarifies Genesis and explains the premortal life.", sources: [{text:'ğŸ“œ Pearl of Great Price',url:'https://www.churchofjesuschrist.org/study/scriptures/pgp'}] },
        'joseph smith': { answer: "Joseph Smith (1805-1844) was the Prophet who restored the Church of Jesus Christ in 1830. He received the First Vision in 1820 and translated the Book of Mormon.", sources: [{text:'ğŸ“œ JS-History',url:'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1'},{text:'ğŸ• Joseph Smith',url:'https://www.churchofjesuschrist.org/study/topics/joseph-smith'}] },
        'first vision': { answer: "In spring 1820, Joseph Smith prayed in a grove of trees and God the Father and Jesus Christ appeared to him. This is the foundational event of the Restoration.", sources: [{text:'ğŸ“œ JS-History 1:15-17',url:'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1.15'}] },
        'restoration': { answer: "The Restoration began when God the Father and Jesus Christ appeared to Joseph Smith in 1820. Through him, the priesthood was restored and the Church was organized in 1830.", sources: [{text:'ğŸ“œ D&C 1:30',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/1.30'}] },

        'recognizing spirits whisperings': { answer: "We live in a world of constant noise â€” notifications, demands, distractions. The Spirit's voice is often a 'still small whisper' (1 Kings 19:12) that requires intention to hear. The key? **Stillness.** We can't hear the whisper when we're shouting. Daily prayer, scripture study, and quiet moments create the space where the Spirit can speak plainly (D&C 8:2). **The Spirit often speaks through:** Peace â€” A calm assurance despite confusion. Promptings â€” 'Do this' or 'Don't go there.' Impressions â€” Thoughts that feel different from your own. Confirmations â€” 'That's right' or 'That's not from Me.' Book of Mormon witnesses: Nephi â€” 'I was led by the Spirit' (1 Nephi 2:16; 4:6). Lehi â€” Dream of the tree of life. Abish â€” The Spirit compelled her to witness (Alma 19:16). D&C 88:11 â€” 'Light cleaves unto light' â€” The more we seek, the more we're given.", sources: [{text:'ğŸ“œ 1 Kings 19:11-13',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/19.11'},{text:'ğŸ“œ D&C 8:2-3',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/8.2'},{text:'ğŸ“œ John 10:27',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/john/10.27'},{text:'ğŸ“œ 1 Nephi 2:16',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/2.16'},{text:'ğŸ“œ D&C 88:11',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88.11'}] },

        'obedience unlocks revelation': { answer: "There's a pattern in scripture: God doesn't force revelation on the unwilling. He waits to be asked. D&C 58:26 tells us the Lord doesn't give commandments 'unless I command... for unto him that is ready and obedient belongs the kingdom.' Obedience isn't just about avoiding sin â€” it's about qualifying for greater light. **The danger of pushing ahead without asking:** D&C 3:6 - Joseph Smith Sr. warned to not run faster than he had strength. Moses learned this in Exodus 32 - the people acted without asking, made a golden calf. **The reward of asking first:** Nephi asked about the things his father saw (1 Nephi 2:16) - received his own vision. Enos prayed all day and night (Enos 1:1-4) - received a personal remission of sins. Joseph Smith asked God (James 1:5) - received the First Vision. **Obedience creates the capacity to receive:** D&C 88:67-68 - 'Draw near unto me and I will draw near unto you.' Alma 32:27-28 - Exercise faith even a particle, and the word will enlarge your soul. Obedience PURIFIES the vessel so the light can enter (D&C 50:24).", sources: [{text:'ğŸ“œ D&C 58:26-28',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-Nephi 2:1',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/2.1'},{text:'ğŸ“œ 1 Nephi 11',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/11'}] },

        'spirit upon the face of the earth': { answer: "1 Nephi 10:17 records a beautiful truth: 'I beheld the Spirit of the Lord, that it was upon the face of the face of the earth.' This suggests the Spirit of the Lord is everywhere â€” present, aware, watching over His children. It wasn't just on specific people or places â€” the Lord's Spirit attends to the whole earth. This gives perspective: wherever we are, we are not alone. The Spirit of the Lord surrounds us.", sources: [{text:'ğŸ“œ 1 Nephi 10:17',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/10.17'}] },
        'plan of salvation': { answer: "The Plan of Salvation explains why we are here. We lived with God before this life, this life is a test, and after death we can return to God through Christ's Atonement.", sources: [{text:'ğŸ“œ Alma 42',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/42'}] },
        'family': { answer: "We believe the family is eternal. Marriage between a man and a woman can last forever through temple sealing. Families can be together forever.", sources: [{text:'ğŸ• Family Proclamation',url:'https://www.churchofjesuschrist.org/study/manual/the-family-a-proclamation-to-the-world'}] },
        'resurrection': { answer: "**Easter â€” He is Risen! ğŸ•Šï¸**\n\nThe Resurrection is the cornerstone of Christian hope. Because of Jesus Christ's Atonement, everyone will be resurrected â€” our bodies will be reunited with our spirits and become perfect. This is not optional or uncertain; it is guaranteed.\n\n**Why It's the Foundation of Faith:**\n\nâ€¢ **1 Corinthians 15:55-57** â€” 'O death, where is thy sting? O grave, where is thy victory?' Death's sting is gone, and we have victory through Christ.\n\nâ€¢ **Ether 15:26** â€” 'Death is swallowed up in victory.' What seemed like the end is transformed into eternal life.\n\nâ€¢ **D&C 138:13-16** â€” 'The Lamb slain from the foundation of the world' was also 'the firstfruits of the resurrection.' The Resurrection was planned from the very beginning.\n\nâ€¢ **2 Nephi 2:8** â€” 'Christ bringeth to pass the resurrection.' He is the author of this gift.\n\n**The Hope It Brings:**\n\nâ€¢ **2 Nephi 9:6-7** â€” 'Wherefore, it is appointed unto men that they must die... but the grave hath no victory.' Death is conquered; the grave has no power over us.\n\nâ€¢ **Alma 11:42-44** â€” The resurrection brings our bodies back, immortal and incorruptible. We will never die again.\n\nâ€¢ **Helaman 14:15-17** â€” Through the resurrection, the redemption of the soul becomes possible. The soul is saved from death.\n\nThis is why Easter is the most important day in Chm«ëŒ+Š×®º+º$zzb¥ç&—7F–æ—G’â†RF–VBf÷"W2Â'WBÖ÷&R–×÷'FçFÇ’(	B†R&÷6Rf÷"W2âFVF‚—2æ÷BF†RVæC²—B—2F†R&Vv–ææ–æröbWFW&æÂÆ–fRv—F‚vöBâ"Â6÷W&6W3¢··FW‡C¢	ù9Â6÷&–çF†–ç2S£SRÓSrrÇW&Ã¢v‡GG3¢ò÷wwræ6‡W&6†öf¦W7W66‡&—7Bæ÷&r÷7GVG’÷67&—GW&W2öçBóÖ6÷"óRãSRwÒÇ·FW‡C¢	ù9ÂWF†W"S£#brÇW&Ã¢v‡GG3¢ò÷wwræ6‡W&6†öf¦W7W66‡&—7Bæ÷&r÷7GVG’÷67&—GW&W2ö&öfÒöWF†W"óRã#bwÒÇ·FW‡C¢	ù9ÂBd23ƒ£2ÓbrÇW&Ã¢v‡GG3¢ò÷wwræ6‡W&6†öf¦W7W66‡&—7Bæ÷&r÷7GVG’÷67&—GW&W2öF2×FW7FÖVçBöF2ó3‚ã2wÒÇ·FW‡C¢	ù9Â"æW†’#£‚rÇW&Ã¢v‡GG3¢ò÷wwræ6‡W&6†öf¦W7W66‡&—7Bæ÷&r÷7GVG’÷67&—G         'atonement become like savior': { answer: "The Atonement is the power that transforms us into who we were meant to become. 2 Nephi 2:26 teaches: 'Counsel with the Lord in all things' â€” as we submit to His will, He shapes us. 2 Nephi 9:21 promises: 'He became as a child, submit' â€” Christ, though divine, submitted to the Father, and through His Atonement, we can become as little children, submissive and humble. This is the process of sanctification: daily drawing closer to Him, learning to love as He loves, serve as He serves, and forgive as He forgives. The Atonement doesn't just forgive our sins â€” it develops Christlike attributes in us over time.", sources: [{text:'ğŸ“œ 2 Nephi 2:26',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/2.26'},{text:'ğŸ“œ 2 Nephi 9:21',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/9.21'}] },
        'atonement comfort': { answer: "When we suffer, we can feel the Savior's presence because He already walked through suffering for us. Isaiah 53:4 promises: 'He hath borne our griefs and carried our sorrows.' Alma 7:11-13 teaches: 'He will take upon him the pains and the sicknesses of his people... that his bowels may be filled with mercy.' Ether 12:4 describes: 'The Lord softening the hearts of them which are hardness hardest to feel.' D&C 122:7-8 asks: 'Art thou greater than he? The Son of Man hath descended below them all.' He understands our pain personally. As we turn to Him, He carries our burdens. Our trials become His, and His strength becomes ours.", sources: [{text:'ğŸ“œ Isaiah 53:4',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/53.4'},{text:'ğŸ“œ Alma 7:11-13',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/7.11'},{text:'ğŸ“œ Ether 12:4',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/ether/12.4'},{text:'ğŸ“œ D&C 122:7-8',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/122.7'}] },
        'atonement justice mercy': { answer: "The Atonement is the perfect bridge â€” Christ pays what justice requires so mercy can be extended to us. Alma 42:24-25 teaches: 'Mercy doth service and justice demand. Hath paid the debt... the debt is paid.' D&C 20:17 explains: 'The Father... gave his only begotten Son... to satisfy the justice of his own law.' Romans 3:25-26 declares: 'God set forth to be a propitiation... to declare his righteousness... that he might be just, and the justifier.' Ether 3:12 describes: 'The Lord... suffereth the pain of all men... that they might be redeemed.' Neither attribute is compromised. God's law is honored AND His love is fulfilled. Justice and mercy embrace at the cross.", sources: [{text:'ğŸ“œ Alma 42:24-25',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/42.24'},{text:'ğŸ“œ D&C 20:17',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/20.17'},{text:'ğŸ“œ Romans 3:25-26',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3.25'},{text:'ğŸ“œ Ether 3:12',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/ether/3.12'}] },
        'atonement forgive others': { answer: "When we understand how much we've been forgiven, our hearts soften toward others. Matthew 6:14-15 warns: 'If ye forgive men their trespasses, your heavenly Father will also forgive you.' Alma 24:10 shows: 'We have no malice against our brethren... we remember how the Lord hath protected us.' D&C 64:9-10 commands: 'I, the Lord, will forgive whom I will forgive, but of you it is required to forgive all men.' Colossians 3:13 teaches: 'Forbearing one another, and forgiving one another, if any man have a quarrel.' The Atonement doesn't just free us from sin â€” it empowers us to release resentment and offer the same grace we received. Forgiveness is its own gift.", sources: [{text:'ğŸ“œ Matthew 6:14-15',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/6.14'},{text:'ğŸ“œ Alma 24:10',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/24.10'},{text:'ğŸ“œ D&C 64:9-10',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/64.9'},{text:'ğŸ“œ Colossians 3:13',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/col/3.13'}] },
        'atonement hope': { answer: "Hope isn't blind optimism â€” it's a confident expectation rooted in Christ's resurrection. The Atonement guarantees that death is not the end, that families can be sealed eternally, and that we can return to God's presence. Romans 15:13 declares: 'Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope.' Titus 1:2 speaks of 'hope of eternal life, which God, that cannot lie, promised before the world began.' 1 Peter 1:3-5 teaches we are 'born again to a lively hope by the resurrection of Jesus Christ... kept by the power of God.' Alma 41:10 promises: 'Do not suppose that this is any other than a restoration to God... to eternal life.' Ether 12:4 describes how 'The Lord... gave hope unto his people.' D&C 138:14-16 speaks of the Son of God going forth 'to bring back his treasure to him.' This hope anchors our souls through every trial and gives us purpose beyond this mortal life.", sources: [{text:'ğŸ“œ Romans 15:13',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/15.13'},{text:'ğŸ“œ Titus 1:2',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/titus/1.2'},{text:'ğŸ“œ 1 Peter 1:3-5',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/1.3'},{text:'ğŸ“œ Alma 41:10',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/41.10'},{text:'ğŸ“œ Ether 12:4',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/ether/12.4'},{text:'ğŸ“œ D&C 138:14-16',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/138.14'}] },
        'atonement forgive': { answer: "When we understand how much we've been forgiven, our hearts soften toward others. Matthew 6:14-15 warns: 'If ye forgive men their trespasses, your heavenly Father will also forgive you.' Alma 24:10 shows: 'We have no malice against our brethren... we remember how the Lord hath protected us.' D&C 64:9-10 commands: 'I, the Lord, will forgive whom I will forgive, but of you it is required to forgive all men.' Colossians 3:13 teaches: 'Forbearing one another, and forgiving one another, if any man have a quarrel.' The Atonement doesn't just free us from sin â€” it empowers us to release resentment and offer the same grace we received. Forgiveness is its own gift.", sources: [{text:'ğŸ“œ Matthew 6:14-15',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/6.14'},{text:'ğŸ“œ Alma 24:10',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/24.10'},{text:'ğŸ“œ D&C 64:9-10',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/64.9'},{text:'ğŸ“œ Colossians 3:13',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/col/3.13'}] },
        'atonement isaiah': { answer: "Isaiah 53:4-5 contains one of the most powerful Old Testament prophecies about the Savior's suffering: 'Surely he hath borne our griefs, and carried our sorrows... he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed.' This prophecy describes the Atonement as substitutionaryâ€”Christ taking upon Himself the punishment that we deserve. He bore our griefs, carried our sorrows, and was wounded for our transgressions. The phrase 'with his stripes we are healed' points to the physical suffering He endured. This is why Alma 7:11-13 teaches that He 'take upon him the pains and the sicknesses of his people'â€”He knows our suffering because He has already experienced it.", sources: [{text:'ğŸ“œ Isaiah 53:4-5',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/53.4'},{text:'ğŸ“œ Alma 7:11-13',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/7.11'}] },

        'let your light shine': { answer: "**'Let your light shine before others' (Matthew 5:14-16)** â€” Your light isn't meant to be hidden. It's a witnessâ€”a testimony that draws others toward Christ. In a world desperately needing hope, your example shows what following Him looks like in daily life. Not perfectâ€”but purposeful. **Three ways your light operates:** (1) **Example** â€” Your actions speak louder than words (Matthew 5:16). When you live with integrity, patience, and love, people notice. (2) **Influence** â€” Others watch how you handle trials. Do you complain or trust? (3) **Witness** â€” Your joy despite difficulties testifies (D&C 50:24). **Book of Mormon witnesses:** Nephi said 'I will go and do' despite being burdened (1 Nephi 3:7, 4:1). Abish converted an entire city through pure testimony (Alma 19:16-17). Helaman's sons went forth preaching, trusting the Lord (Helaman 5:18). 3 Nephi 12:14-16 parallels the Sermon on the Mountâ€”'salt of the earth.' D&C 103:9 calls us 'lightBearer.' Isaiah 60:1-3: 'Arise, shine; the Lord is my light.' Your light is needed. Don't hide it.", sources: [{text:'ğŸ“œ Matthew 5:14-16',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/5.14'},{text:'ğŸ“œ 3 Nephi 12:14-16',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/12.14'},{text:'ğŸ“œ D&C 103:9',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/103.9'},{text:'ğŸ“œ Isaiah 60:1-3',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/60.1'},{text:'ğŸ“œ John 8:12',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/john/8.12'},{text:'ğŸ“œ D&C 50:24',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/50.24'},{text:'ğŸ“œ 1 Nephi 3:7',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/3.7'},{text:'ğŸ“œ Alma 19:16-17',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/19.16'}] },
        'become like savior': { answer: "**'Become more like the Savior'** â€” The Atonement isn't just forgiveness; it's transformation. 2 Nephi 2:26 teaches: 'Counsel with the Lord in all things'â€”as we submit to His will, He shapes us. 2 Nephi 9:21 promises: 'He became as a child, submit'â€”Christ, though divine, submitted to the Father, and through His Atonement, we can become submissive and humble. **The process of sanctification:** Daily drawing closer to Him, learning to love as He loves, serve as He serves, and forgive as He forgives. 3 Nephi 12:48 commands: 'Be perfect, even as I... am.' This doesn't mean sinlessâ€”it means complete, whole, fulfilled. **Key scriptures:** Mosiah 3:19 â€” 'The natural man is an enemy to God' but can become 'a saint through the atonement.' Alma 12:24 â€” 'Pressing forward to the crown.' 3 Nephi 27:27 â€” 'What manner of men ought ye to be?' The Atonement doesn't just forgive our sinsâ€”it develops Christlike attributes over time. Ether 12:27: 'My grace is sufficient for thee.' Daily we become more like Him.", sources: [{text:'ğŸ“œ 2 Nephi 2:26',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/2.26'},{text:'ğŸ“œ 2 Nephi 9:21',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/9.21'},{text:'ğŸ“œ Mosiah 3:19',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/3.19'},{text:'ğŸ“œ Alma 12:24',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/12.24'},{text:'ğŸ“œ 3 Nephi 27:27',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/27.27'},{text:'ğŸ“œ Ether 12:27',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/ether/12.27'},{text:'ğŸ“œ 3 Nephi 12:48',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/12.48'}] },
        'light of christ': { answer: "The Light of Christ is the divine influence that proceeds from God. It illuminates every person's mind and heart, enabling them to distinguish good from evil. D&C 88:11 describes the Holy Ghost as one who 'giveth light to the understanding.' This is different from the Holy Ghost as a personageâ€”the Light of Christ is available to ALL people, everywhere, helping them recognize truth before they even join the Church.", sources: [{text:'ğŸ“œ D&C 88',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88'},{text:'ğŸ“œ D&C 88:11',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88.11'}] },

        'authority of priesthood': { answer: "Priesthood is the power and authority of God given to man to act in His name. It was restored through Joseph Smith. Without proper authority, ordinances are not valid. The LDS Church teaches that its priesthood authority comes directly from the restoration through heavenly messengers.", sources: [{text:'ğŸ“œ D&C 84',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84'},{text:'ğŸ“œ D&C 13',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/13'}] },
        'gathering of israel': { answer: "The gathering of Israel has multiple meanings: (1) Physical return of Jews to the promised land (fulfilled), (2) Spiritual gathering through conversion (ongoing), (3) Latter-day restoration of all Israel, and (4) Family sealing through temple work. The Book of Mormon plays a crucial role in this prophecy.", sources: [{text:'ğŸ“œ Ezekiel 37:21-28',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/37.21'},{text:'ğŸ“œ 3 Nephi 20-21',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/20'}] },
        'lamanites': { answer: "The Lamanites are descendants of Lehi's sons Laman and Lemuel, who became the ancestors of the Native Americans. They are part of the house of Israel and will receive blessings in the latter days. The Book of Mormon is their spiritual inheritance. 'The seed of thy brethren shall be convinced' (D&C 10:51).", sources: [{text:'ğŸ“œ D&C 10:47-51',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/10.47'},{text:'ğŸ“œ Book of Mormon Title Page',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/introduction'}] },

        'discerning spirits': { answer: "Elder David A. Bednar warned that there are many deceptive voices imitating the Holy Ghost. We can mistake personal sentiment or emotional feelings for genuine revelation. The Prophet Joseph Smith taught: \"For nothing is a greater injury to the children of men than to be under the influence of a false spirit when they think they have the Spirit of God.\" President Joseph F. Smith warned that those who NEED dramatic spiritual manifestations to stay steadfast are often on unstable ground. True spiritual experiences are guarded carefully and shared only when the Spirit prompts you. Your protection: a sincere heart, real intent, and faithful obedience.", sources: [{text:'ğŸ“œ Teachings of the Prophet Joseph Smith',url:'https://www.churchofjesuschrist.org/study/manual/teachings-of-the-prophet-joseph-smith'}] },
        'holy ghost is a person': { answer: "The Book of Mormon and Doctrine & Covenants clarify a truth many Christian churches miss: the Holy Ghost is not just an influence - He is a PERSONAGE OF SPIRIT. D&C 130:22 teaches: \"The Father has a body of flesh and bones as tangible as man's; the Son also; but the Holy Ghost has not a body of flesh and bones, but is a personage of Spirit.\" Because He is a personage, He can dwell in us as our companion. He bears witness to truth, teaches all things, reveals the Father and the Son, and can be our constant companion.", sources: [{text:'ğŸ“œ D&C 130:22',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/130.22'}] },
        'holy ghost gift that stays': { answer: "We live in a world of competing voices â€” but the Holy Ghost is different from other gifts. Wealth can fade. Health can fail. Success can vanish. But the Comforter is eternal â€” given to those who keep the commandments. D&C 88:78-79 promises: 'The Holy Ghost shall be thy constant companion.' This is not for special occasions only â€” He can be your ever-present guide, teaching you all things and bringing all things to your remembrance (John 14:26). The Holy Ghost testifies of Christ (John 15:26), warns of danger (Acts 20:23), and leads into all truth (John 16:13). This is the gift that truly stays â€” the only gift that cannot be taken away through death because it prepares you for eternal life. As Moroni 10:5 invites: 'Ask with real intent, and by the Holy Ghost ye may know the truth of all things.' This is the gift worth seeking above all others.", sources: [{text:'ğŸ“œ D&C 88:78-79',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88.78'},{text:'ğŸ“œ John 14:26',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/john/14.26'},{text:'ğŸ“œ John 16:13',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/john/16.13'},{text:'ğŸ“œ Moroni 10:5',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/10.5'}] },
        'holy ghost guide to truth': { answer: "John 16:13 declares: 'When he, the Spirit of truth, is come, he will guide you into all truth.' The Holy Ghost doesn't just inform â€” He leads. He's not just a teacher â€” He's a guide. This means the Spirit actively works to direct your path, not just answer questions. He guides into 'all truth' â€” not partial truth, not confusing truth, but complete truth. 2 Nephi 32:5 exhorts: 'Press forward, continuing in memorable... [remembering] the word of Christ.' The Spirit takes the words of Christ and applies them personally to your situation. D&C 45:56-57 records the Savior's prayer for His disciples: 'I have prayed for thee that thy faith fail not.' This is the promise â€” the Holy Ghost guides, but you must press forward. The gift of the Spirit is not passive; it requires action. Ask, and you shall receive. Seek, and you shall find. Knock, and it shall be opened unto you (Matthew 7:7). The Holy Ghost guides those who are actively seeking truth.", sources: [{text:'ğŸ“œ John 16:13',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/john/16.13'},{text:'ğŸ“œ 2 Nephi 32:5',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/32.5'},{text:'ğŸ“œ D&C 45:56-57',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45.56'},{text:'ğŸ“œ D&C 88:78-79',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88.78'}] },
        'three rs of choice': { answer: "President Thomas S. Monson taught that every choice carries one of three dimensions: THE RIGHT OF CHOICE - agency is God's greatest gift next to life itself (President David O. McKay). THE RESPONSIBILITY OF CHOICE - you cannot be neutral; there is no middle ground. THE RESULTS OF CHOICE - every decision has consequences, some eternal. Monson taught: \"Decisions are constantly before us. To make them wisely, courage is needed - the courage to say no, the courage to say yes. Decisions do determine destiny.\"", sources: [{text:'ğŸ“œ President Monson - The Three Rs of Choice, October 2010',url:'https://www.churchofjesuschrist.org/study/general-conference/2010/10/the-three-rs-of-choice'}] },
        'keep the commandments 100 percent': { answer: "President Thomas S. Monson shared the story of Clayton Christensen, a Harvard professor who at age 16 decided not to play sports on Sunday. Years later, playing center at Oxford, the championship game was scheduled on Sunday. He knelt and asked if it was okay just this once. He received a clear answer: \"You know the answer.\" He did not play. He later said: \"It is easier to keep the commandments 100 percent of the time than it is 98 percent of the time.\" Why? Because once you cross the line, the next extenuating circumstance makes it so much easier to cross again. Your life becomes a stream of \"just this once\" - and eventually you have drifted far from the path.", sources: [{text:'ğŸ“œ President Monson - The Three Rs of Choice',url:'https://www.churchofjesuschrist.org/study/general-conference/2010/10/the-three-rs-of-choice'}] },
        'lucifer': { answer: "President Thomas S. Monson warned of Lucifer's three-stage attack (from 2 Nephi 28): (1) He \"pacifieth\" us into \"carnal security\" - lulling us to sleep spiritually. (2) He \"flattereth away\" and tells us \"there is no hell.\" (3) Once deceived, he \"grasps them with his awful chains.\" Lucifer is a \"clever pied piper\" attracting the unsuspecting. King David fell. Cain fell. Judas fell. \"Brethren, whether we are 12-year-old deacons or mature high priests, we are susceptible.\" No temptation can overcome us unless we ALLOW it.", sources: [{text:'ğŸ“œ 2 Nephi 28:20-22',url:'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/28.20'},{text:'ğŸ“œ President Monson - The Three Rs of Choice',url:'https://www.churchofjesuschrist.org/study/general-conference/2010/10/the-three-rs-of-choice'}] },
        'repentance': { answer: "President Thomas S. Monson taught that when we make wrong choices - and we all do - there is a way back. It is called repentance. The ancient promise: \"Though your sins be as scarlet, they shall be as white as snow\" (Isaiah 1:18). The Lord added: \"I, the Lord, remember them no more\" (Jeremiah 31:34). Paul assured us: \"God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape\" (1 Corinthians 10:13). Monson's counsel: \"If you have a sin problem - correct it. If you have a bad habit - break it. The sooner you begin to make your way back, the sooner you will find the sweet peace and joy that come with the miracle of forgiveness.\"", sources: [{text:'ğŸ“œ President Monson - The Three Rs of Choice',url:'https://www.churchofjesuschrist.org/study/general-conference/2010/10/the-three-rs-of-choice'},{text:'ğŸ“œ Isaiah 1:18',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/1.18'}] },
        'ask seek knock': { answer: "President Russell M. Nelson taught that one of the most marvelous gifts God has offered mortals is the ability to access heaven directly - no hardware, software, or monthly fees. The Lord invites: \"Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you.\" To receive revelation: (1) HAVE FAITH - ask with a sincere heart, real intent, with faith in Christ. (2) STUDY IT OUT IN YOUR MIND - then ask God if it be right; if it is, your bosom will burn within you (D&C 9:7-9). (3) BE OBEDIENT - revelation never contradicts God's doctrine. (4) HAVE PATIENCE - revelation may come \"line upon line, precept upon precept.\" Nelson concluded: \"Every Latter-day Saint m«ëŒ+Š×®º+º$zzb¥ârÇW&Ã¢v‡GG3¢ò÷wwræ6‡W&6†öf¦W7W66‡&—7Bæ÷&r÷7GVG’övVæW&ÂÖ6öæfW&Væ6Ró#’óö6²×6VV²Ö¶æö6²wÕÒÒÀ¢vf—'7Bf—6–öâÖVæ–ærs¢²ç7vW#¢%FB"â6ÆÆ—7FW"FVv‡BF†Bg&öÒF†Rf—'7Bf—6–öâÂ¦÷6W‚6Ö—F‚ÆV&æVBf÷W"G'WF‡2Væ¶æ÷vâFòÖ÷7Böb6‡&—7FVæFöÓ¢ƒ’vöBF†RfF†W"æB†—26öâ¦W7W26‡&—7B&REtò4U$DRÂD•5D”ä5B$T”äu2Òæ÷BF†R6ÖR&V–ærâƒ"’F†RfF†W"æB6öâ†fRtÄõ$”d”TB$ôD”U2ôbdÄU4‚äB$ôäU2Ò&W7W'&V7FVBæBæWfW"Fò&V6öÖR7—&—Bv–ââƒ2’tôB5D”ÄÂ5Tµ2DòÔâDôD’ÒF†R†VfVç2&Ræ÷B6Æ÷6VBâ6³¢FöW2vöBÆ÷fRW22×V6‚2æ6–VçFÇ“òFöW2†R†fRF†R6ÖR÷vW#òFòvRæVVB†–Ò2×V6ƒò–b–W2ÂF†VâvöB7V·2FöF’âƒB’F†ReTÄÂäB4ôÕÄUDR4…U$4‚ôb¤U5U24…$•5Bv2æ÷BöâF†RV'F‚âF†R&W7F÷&F–öâ&VvâÒÂ&Æ–æRWöâÆ–æRÂ&V6WBWöâ&V6WBåÂ""Â6÷W&6W3¢··FW‡C¢	ù9ÂFB"â6ÆÆ—7FW"Ò¦÷6W‚6Ö—Fƒ¢&÷†WBöbF†R&W7F÷&F–öârÇW&Ã¢v‡GG3¢ò÷wwræ6‡W&6†öf¦W7W66‡&—7Bæ÷&r÷7GVG’övVæW&ÂÖ6öæfW&Væ6Ró#’óö¦÷6W‚×6Ö—F‚×&÷†WBÖöb×F†R×&W7F÷&F–öâwÒÇ·FW‡C¢	ù9Â¥2Ô†—7F÷'’£RÓrrÇW&Ã¢v‡GG3¢ò÷wwræ6‡W&6†öf¦W7W66‡&—7Bæ÷&r÷7GVG’÷67&—GW&W2÷wö§2Ö‚óãRwÕÒÒÀ¢vFöW2vöB7V²FöF’s¢²ç7vW#¢$öæRöbF†RÖ÷7B÷vW&gVÂG'WF‡2¦÷6W‚6Ö—F‚&W7F÷&VB—2F†BvöB†2äõB6Æ÷6VBF†R†V         'waiting on the Lord': { answer: "Elder David A. Bednar taught that one of the greatest tests of faith is learning to WAIT upon the Lord â€” not demanding answers on your timetable, but trusting His perfect timing. Revelation is not a vending machine. You cannot insert your request and immediately receive your answer. The Lord operates in His own way and in His own time, which is always better than yours. The Book of Mormon teaches this repeatedly â€” from Lehi waiting for the Liahona, to Alma waiting for the words of Samuel the Lamanite to be fulfilled, to the Savior Himself waiting until the precise moment to begin His ministry. Bednar taught that waiting is NOT passive â€” it is active faith. You continue to pray, you continue to study, you continue to serve, you continue to keep His commandments. And in the midst of that faithful waiting, the Lord reveals what you need, when you need it. The Spirit speaks best to those who are quietly, consistently, patiently living the gospel â€” not to those who are anxiously pacing.", sources: [{text:'ğŸ“œ Elder Bednar â€” The Spirit of Revelation',url:'https://www.churchofjesuschrist.org/study/general-conference/2011/04/the-spirit-of-revelation'},{text:'ğŸ“œ Isaiah 40:31',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/40.31'},{text:'ğŸ“œ D&C 101:35-36',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101.35'}] },
        'how to make a hard decision': { answer: "President Thomas S. Monson taught that when facing a difficult decision, the most important thing to remember is: DECISIONS DETERMINE DESTINY. He counseled: \"You cannot be neutral â€” there is no middle ground.\" When confronted with a tough choice, apply the Three Rs: First, recognize the RIGHT â€” is this choice aligned with God's commandments and the teachings of His prophets? If it violates conscience, if it leads you from the path, it is wrong. Second, accept the RESPONSIBILITY â€” you alone must decide. You cannot delegate your agency to others or wait for someone else to make the choice for you. Third, remember the RESULTS â€” every decision has consequences, and some decisions close eternal doors forever. President Monson also taught: \"It is easier to keep the commandments 100 percent of the time than it is 98 percent of the time.\" When in doubt, choose the path of greater obedience. Ask yourself: what would the Savior do? Then do that.", sources: [{text:'ğŸ“œ President Monson â€” The Three Rs of Choice',url:'https://www.churchofjesuschrist.org/study/general-conferednar taught that counterfeit spirits are everywhere â€” they imitate the genuine, they mimic the real, and they are dangerously convincing. How do you protect yourself? By understanding the nature of true revelation: the Holy Ghost speaks with perfect MILDNESS, not with fanfare or dramatic emotion. He whispers, He caresses, He gently instructs. False spirits tend toward sensationalism, dramatic manifestations, and emotional manipulation. Bednar's counsel: if a prompting tells you to violate the principles of the gospel, if it contradicts established scripture, if it leads you away from the covenants you have made â€” it is not of God. Stay in the covenant path, keep the commandments, and you will never be led astray.", sources: [{text:'ğŸ“œ Elder Bednar â€” The Spirit of Revelation',url:'https://www.churchofjesuschrist.org/study/general-conference/2011/04/the-spirit-of-revelation'},{text:'ğŸ“œ D&C 50:1-4',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/50.1'},{text:'ğŸ“œ Teachings of the Prophet Joseph Smith',url:'https://www.churchofjesuschrist.org/study/manual/teachings-of-the-prophet-joseph-smith'}] },

        'what does it mean to be brave': { answer: "President Thomas S. Monson taught that bravery is not the absence of fear â€” it is the courage to act RIGHTEOUSLY in spite of fear. He said: \"Decisions are constantly before us. To make them wisely, courage is needed â€” the courage to say NO, the courage to say YES.\" Being brave does not mean being reckless or confident â€” it means being determined to do what is right regardless of the cost. The Clayton Christensen story illustrates this perfectly: a 16-year-old boy who chose not to play championship basketball on Sunday, even when it meant sacrificing his athletic dreams. He was mocked. He stood alone. He was brave. President Monson reminded us: you cannot be neutral. Every day you are either moving closer to God or further away. Neutrality is a slow drift toward the world. Courage means standing firm when everyone around you is drifting, saying yes to the things of God and no to the things of men.", sources: [{text:'ğŸ“œ President Monson â€” The Three Rs of Choice',url:'https://www.churchofjesuschrist.org/study/general-conference/2010/10/the-three-rs-of-choice'},{text:'ğŸ“œ Joshua 1:9',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/1.9'},{text:'ğŸ“œ 1 Corinthians 16:13',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/16.13'}] },
        'grief and loss': { answer: "President Thomas S. Monson knew grief personally. He lost his father at a young age, and throughout his life he faced profound sorrows. Yet he taught that even in our deepest grief, there is hope â€” because of the Atonement of Jesus Christ. He quoted the ancient promise: \"Though your sins be as scarlet, they shall be as white as snow\" (Isaiah 1:18). And he added: the Lord not only forgives sin, He heals grief. He carries our sorrows. He is \"a very present help in trouble\" (Psalm 46:1). President Monson's counsel during times of loss: (1) Do not try to rush the grieving process â€” it takes time, and that is okay. (2) Turn to the Lord in prayer â€” He is the Prince of Peace. (3) Keep moving forward with determination â€” \"Eternal life is not achieved in one glorious attempt but is the result of a lifetime of righteousness.\" (4) Serve others â€” in serving, we find healing. The griem«ëŒ+Š×®º+º$zzb¥æbFöW2æ÷BF—6V"Â'WBF‡&÷Vv‚F†Rw&6RöbF†R6f–÷"Â—B6â&RG&ç6f÷&ÖVB–çFòV6Râ"Â6÷W&6W3¢··FW‡C¢	ù9Â&W6–FVçBÖöç6öâ(	BFWFW&Ö–æVBFòFòv†B’6†÷VÆBrÇW&Ã¢v‡GG3¢ò÷wwræ6‡W&6†öf¦W7W66‡&—7Bæ÷&r÷7GVG’övVæW&ÂÖ6öæfW&Væ6Ró#bóöFWFW&Ö–æVB×FòÖFò×v†BÖ’×6†÷VÆBwÒÇ·FW‡C¢	ù9Â—6–‚£‚rÇW&Ã¢v‡GG3¢ò÷wwræ6‡W&6†öf¦W7W66‡&—7Bæ÷&r÷7GVG’÷67&—GW&W2ö÷Bö—6óã‚wÒÇ·FW‡C¢	ù9ÂÖ÷6–‚#C£BÓRrÇW&Ã¢v‡GG3¢ò÷wwræ6‡W&6†öf¦W7W66‡&—7Bæ÷&r÷7GVG’÷67&—GW&W2ö&öfÒöÖ÷6–‚ó#BãBwÕÒÒÀ¢v†÷rFò†V"&WfVÆF–öâs¢²ç7vW#¢%&W6–FVçB'W76VÆÂÒâæVÇ6öâvfR†—2Ö÷7B÷vW&gVÂFG&W72–â&–Â##Â6–×Ç’F—FÆVBÂ$†V"†–ÒåÂ"†—2ÖW76vR7WBFòF†R†V'BöbvVæW&F–öã¢vR7VæB6ò×V6‚F–ÖR†V&–ær$õUB6‡&—7BF†BvRf÷&vWBFò7GVÆÇ’„T"†–ÒâFò†V"†–ÒW'6öæÆÇ’ÂæVÇ6öâFVv‡BÂ–÷R×W7BFòf÷W"F†–æw2âf—'7BÂ$UTåBD”Å’(	BGW&âv’g&öÒç—F†–ærF†B&Æö6·2&WfVÆF–öâÂ–æ6ÇVF–ær&–FRÂVæ¶–æFæW72Â÷"Væ6öæfW76VB6–ââ6V6öæBÂ5TÅD•dDRU%4ôäÂ$TÄD”ôå4„•t•D‚D„R4d”õ"(	Bæ÷B§W7BG&ç67F–öâÂ'WBg&–VæG6†         'what is the first vision': { answer: "In the spring of 1820, a 14-year-old boy named Joseph Smith went into a grove of trees near his home in upstate New York and prayed. He was confused by the religious contention among the churches of his day, and he sought divine guidance. What happened next is known as the First Vision â€” the founding event of the Restored Church of Jesus Christ. Joseph wrote: \"I saw a pillar of light exactly over my head, above the brightness of the sun, which descended gradually until it fell upon me.\" He saw God the Father and Jesus Christ the Son, standing before him. Christ told him that none of the churches were true. Through this vision, the truth about the Godhead was restored â€” that the Father and Son are two separate, glorified beings, and the Holy Ghost is a personage of Spirit. Joseph Smith emerged from that grove as the prophet of the Restoration â€” the beginning of God speaking to man again after nearly 2,000 years of silence. Every prophet since has testified of the truth and power of that singular, sacred event.", sources: [{text:'ğŸ“œ JS-History 1:1-20',url:'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1.1'},{text:'ğŸ“œ Joseph Smith â€” The First Vision',url:'https://www.churchofjesuschrist.org/study/manual/the-first-vision'},{text:'ğŸ“œ D&C 130:22',url:'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/130.22'}] },
        'martin handcart company': { answer: "The Martin Handcart Company was one of the most tragic events in Latter-day Saint pioneer history. In 1856, about 576 members of the Martin Company left Iowa in late July, later than planned. They faced severe winter storms in Wyoming and became trapped near the Sweetwater River. Over 210 people died from exposure and starvation before rescue parties from Salt Lake City arrived. The survivors reached Salt Lake Valley on November 30, 1856. This tragedy has become a symbol of faith and sacrifice, with members walking through deep snow while pushing their handcarts. The story continues to teach about perseverance and the price of gathering to Zion.", sources: [{text:'ğŸ“œ Church History â€” Handcart Companies',url:'https://www.churchofjesuschrist.org/study/history/topics/handcart-companies'},{text:'ğŸ“œ Willie and Martin Handcart Companies',url:'https://en.wikipedia.org/wiki/Willie_and_Martin_handcart_companies'},{text:'ğŸ“œ WyoHistory â€” Journey to Martin\'s Cove',url:'https://www.wyohistory.org/encyclopedia/journey-martins-cove-mormon-handcart-tragedy-1856'}] },
        'willie handcart company': { answer: "The Willie Handcart Company left Florence, Nebraska in July 1856 with about 404 pioneers. They faced early snowstorms in Wyoming and were stranded near the Sweetwater River. Despite rescue efforts, about 68 members died. The survivors arrived in Salt Lake City on November 9, 1856. Brigham Young had called for rescue parties when he learned of their plight, demonstrating the Church's commitment to rescue those in need. The Willie Company is remembered alongside the Martin Company for their faith in continuing westward despite extreme hardships.", sources: [{text:'ğŸ“œ Church History â€” Handcart Companies',url:'https://www.churchofjesuschrist.org/study/history/topics/handcart-companies'},{text:'ğŸ“œ Willie and Martin Handcart Companies',url:'https://en.wikipedia.org/wiki/Willie_and_Martin_handcart_companies'}] },
        'mormon handcart companies': { answer: "The Mormon handcart companies were a method of westward migration used by Latter-day Saints from 1856 to 1860. Led by Brigham Young, the Church introduced handcarts to reduce costs and speed up the journey to Utah. Over 3,000 pioneers used handcarts during this period. The system was discontinued after the tragedies of 1856 when the Willie and Martin companies were stranded in winter storms, resulting in over 210 deaths. The handcart pioneers are remembered for their faith and sacrifice in gathering to Zion.", sources: [{text:'ğŸ“œ Church History â€” Handcart Companies',url:'https://www.churchofjesuschrist.org/study/history/topics/handcart-companies'},{text:'ğŸ“œ Wikipedia â€” Mormon Handcart Pioneers',url:'https://en.wikipedia.org/wiki/Mormon_handcart_pioneers'}] },
        'mormon trail': { answer: "The Mormon Trail was the 1,300-mile route Latter-day Saints traveled from Nauvoo, Illinois to Salt Lake City, Utah between 1846-1869. Beginning in 1846 after being expelled from Nauvoo, pioneers traveled through Iowa, Nebraska, Wyoming, and Utah. Key landmarks included Winter Quarters (Nebraska), Fort Laramie (Wyoming), Independence Rock, Devil's Gate, and the Sweetwater River. The trail was used by about 80,000 pioneers until the transcontinental railroad made the journey obsolete.", sources: [{text:'ğŸ“œ Church History â€” Mormon Trail',url:'https://www.churchofjesuschrist.org/study/history/topics/mormon-trail'},{text:'ğŸ“œ Wikipedia â€” Mormon Trail',url:'https://en.wikipedia.org/wiki/Mormon_Trail'}] },
        'nauvoo illinois': { answer: "Nauvoo, Illinois was the headquarters of the Church from 1839 to 1846. Under Joseph Smith's leadership, it grew from a swampy wilderness to a thriving city of 20,000. The Nauvoo Temple was built there, and the City of Joseph became a beacon for converts worldwide. After Joseph Smith's martyrdom in 1844, tensions with locals led to the Exodus in 1846. Today, Nauvoo is a historic site where visitors can experience restored 1840s buildings and learn about early Church history.", sources: [{text:'ğŸ“œ Church History â€” Nauvoo',url:'https://www.churchofjesuschrist.org/study/history/topics/nauvoo'},{text:'ğŸ“œ Nauvoo Tourism',url:'https://www.nauvoo.com'}] },
        'winter quarters nebraska': { answer: "Winter Quarters (now Florence, Nebraska) was the temporary headquarters for Latter-day Saints from 1846-1848. About 2,000 Church members wintered there after being forced from Nauvoo, with many more passing through on their way west. It was a place of great hardshipâ€”over 600 died from disease and exposure. From here, the first pioneer company left in 1847 led by Brigham Young. Winter Quarters remains a significant historical site and memorial to the faith and sacrifice of early pioneers.", sources: [{text:'ğŸ“œ Church History â€” Winter Quarters',url:'https://www.churchofjesuschrist.org/study/history/topics/winter-quarters'},{text:'ğŸ“œ History CHECH â€” Winter Quarters',url:'https://history.churchofjesuschrist.org/landing/fleeing-illinois/winter-quarters'}] },
        'salt lake valley': { answer: "The Salt Lake Valley was the destination of the Mormon exodus, chosen by Brigham Young as the new gathering place for the Saints. On July 24, 1847, Young and the first pioneer company entered the valley. Despite initial concerns about the barren land, Young declared 'This is the right place' and work began immediately on irrigation and settlement. The valley became the headquarters of the Church and the foundation of Utah's civilization, with Salt Lake City growing to become a major western metropolis.", sources: [{text:'ğŸ“œ Church History â€” Salt Lake City',url:'https://www.churchofjesuschrist.org/study/history/topics/salt-lake-city'},{text:'ğŸ“œ July 24 Pioneer Day',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-day'}] },
        'pioneer day': { answer: "Pioneer Day is celebrated on July 24 each year in Utah to commemorate the arrival of Brigham Young and the first pioneer company in the Salt Lake Valley in 1847. It is a state holiday in Utah, celebrated with parades, fireworks, and gatherings. The day honors the faith and sacrifice of the approximately 80,000 pioneers who made the journey west between 1847-1869, as well as the indigenous peoples and helpers who assisted along the way.", sources: [{text:'ğŸ“œ Church History â€” Pioneer Day',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-day'},{text:'ğŸ“œ Utah State Holiday',url:'https://history.utah.gov/topim«ëŒ+Š×®º+º$zzb¥ç6†—Â—Bw&Wrg&öÒ7v×’v–ÆFW&æW72FòF‡&—f–ær6—G’öb#ÃâF†RæWföòFV×ÆRv2'V–ÇBF†W&RÂæBF†R6—G’öb¦÷6W‚&V6ÖR&V6öâf÷"6öçfW'G2v÷&ÆGv–FRâgFW"¦÷6W‚6Ö—F‚w2Ö'G—&FöÒ–âƒCBÂFVç6–öç2v—F‚Æö6Ç2ÆVBFòF†RW†öGW2–âƒCbâFöF’ÂæWföò—2†—7F÷&–26—FRv†W&Rf—6—F÷'26âW‡W&–Væ6R&W7F÷&VBƒC2'V–ÆF–æw2æBÆV&â&÷WBV&Ç’6‡W&6‚†—7F÷'’â"Â6÷W&6W3¢··FW‡C¢	ù9Â6‡W&6‚†—7F÷'’(	BæWföòrÇW&Ã¢v‡GG3¢ò÷wwræ6‡W&6†öf¦W7W66‡&—7Bæ÷&r÷7GVG’ö†—7F÷'’÷F÷–72öæWföòwÒÇ·FW‡C¢	ù9ÂæWföòF÷W&—6ÒrÇW&Ã¢v‡GG3¢ò÷wwrææWföòæ6öÒwÕÒÒÀ¢wv–çFW"V'FW'2æV'&6¶s¢²ç7vW#¢%v–çFW"V'FW'2†æ÷rfÆ÷&Væ6RÂæV'&6¶’v2F†RFV×÷&'’†VGV'FW'2f÷"ÆGFW"ÖF’6–çG2g&öÒƒCbÓƒC‚â&÷WB"Ã6‡W&6‚ÖVÖ&W'2v–çFW&VBF†W&RgFW"&V–ærf÷&6VBg&öÒæWföòÂv—F‚Öç’Ö÷&R76–ærF‡&÷Vv‚öâF†V—"v’vW7Bâ—Bv2Æ6Röbw&VB†&G6†—(	F÷fW"cF–VBg&öÒF—6V6RæBW‡÷7W&Râg&öÒ†W&RÂF†Rf—'7B–öæVW"6ö×ç’ÆVgB–âƒCrÆVB'’'&–v†Ò–÷Værâv–çFW"V'FW'2&VÖ–ç26–væ–f–6çB†—7F÷&–6Â6—FRæBÖVÖ÷&–ÂFòF†Rf—F‚æB67&–f–6RöbV&Ç’–öæVW'2â"Â6÷W&6W3¢··FW‡C¢	ù9Â6‡W&6‚†—7F÷'’(	Bv–çFW"V'FW'2rÇW&Ã¢v‡GG3¢ò÷wwræ6‡W&6†öf¦W7W66‡&—7Bæ÷&r÷7GVG’ö†—7F÷'’÷F÷–72÷v–çFW"×V'FW'2wÒÇ·FW‡C¢	ù9Â†—7F÷'’4„T4‚(	Bv–çFW"V'FW'2rÇW&Ã¢v‡GG3¢òö†         'calvary': { answer: "Calvary (Golgotha) is the hill outside Jerusalem where Jesus was crucified. It was the location of His crucifixion, death, and burial. The Atonement and Resurrection occurred here, making it the most important location in Christian history.", sources: [{text:'ğŸ“œ Britannica â€” Crucifixion',url:'https://www.britannica.com/place/Calvary'},{text:'ğŸ“œ Bible â€” crucifixion',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/27'}] },
        'temple of solomon': { answer: "The Temple of Solomon was built in Jerusalem around 950 BC by King Solomon. It was the house of God on earth and the center of Israelite worship. Jesus taught there as a child and later cleansed it of merchants. It was destroyed in 70 AD.", sources: [{text:'ğŸ“œ Britannica â€” Solomon\'s Temple',url:'https://www.britannica.com/place/Solomons-Temple'},{text:'ğŸ“œ Bible â€” Temple of Solomon',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6'}] },
        'red sea': { answer: "The Red Sea is where Moses divided the waters for the Israelites to escape Pharaoh's army (Exodus 14). This miracle saved Israel from slavery and demonstrated God's power. It remains one of the most famous biblical events.", sources: [{text:'ğŸ“œ Britannica â€” Red Sea',url:'https://www.britannica.com/place/Red-Sea'},{text:'ğŸ“œ Bible â€” Crossing the Red Sea',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14'}] },
        'abraham': { answer: "Abraham is the patriarch of Israel and father of the faithful. God called him from Ur and promised him land, many descendants, and that all nations would be blessed through him. The Abrahamic covenant is central to Latter-day Saint theology.", sources: [{text:'ğŸ“œ Church â€” Abraham',url:'https://www.churchofjesuschrist.org/study/history/topics/abraham'},{text:'ğŸ“œ Bible â€” Genesis 12',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/12'}] },
        'isaac': { answer: "Isaac was the son of Abraham and Sarah, born miraculously in their old age. He was the child of the promise. He demonstrated obedience by offering himself to be sacrificed at Mount Moriah. He is an ancestor of Jesus Christ.", sources: [{text:'ğŸ“œ Bible â€” Isaac',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/21'},{text:'ğŸ“œ Church â€” Isaac',url:'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual/isaac'}] },
        'jacob': { answer: "Jacob was the son of Isaac and grandson of Abraham. He received the birthright blessing from Esau through his mother Rebekah's help. Jacob wrestled with an angel and was renamed Israel. He is the father of the twelve tribes.", sources: [{text:'ğŸ“œ Church â€” Jacob',url:'https://www.churchofjesuschrist.org/study/history/topics/jacob'},{text:'ğŸ“œ Bible â€” Jacob Wrestles',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/32'}] },
        'moses': { answer: "Moses was the prophet who led Israel out of Egypt and received the law at Mount Sinai. He authored the first five books of the Bible. He performed miracles including the plagues of Egypt, dividing the Red Sea, and bringing water from a rock.", sources: [{text:'ğŸ“œ Church â€” Moses',url:'https://www.churchofjesuschrist.org/study/history/topics/moses'},{text:'ğŸ“œ Bible â€” Exodus',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/ex'}] },
        'pharaoh': { answer: "Pharaoh was the title of Egyptian rulers in biblical times. The Pharaoh of Exodus refused to release the Israelites, leading to ten plagues. The final plague was the death of all firstborn, after which Pharaoh allowed them to leave.", sources: [{text:'ğŸ“œ Britannica â€” Pharaoh',url:'https://www.britannica.com/topic/pharaoh'},{text:'ğŸ“œ Bible â€” Plagues of Egypt',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7'}] },
        'noah': { answer: "Noah was a righteous man who built an ark at God's command to save his family and animals from the Flood. He is a symbol of faith and obedience. The Flood covered the earth, and after the waters receded, God promised never to destroy all life again.", sources: [{text:'ğŸ“œ Church â€” Noah',url:'https://www.churchofjesuschrist.org/study/history/topics/noah'},{text:'ğŸ“œ Bible â€” Genesis 6-9',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/6'}] },
        'adam and eve': { answer: "Adam and Eve were the first man and woman, created in God's image. They lived in the Garden of Eden and were given agency. They ate the forbidden fruit, introducing sin and death into the world, but also making mortality and progression possible.", sources: [{text:'ğŸ“œ Church â€” Adam and Eve',url:'https://www.churchofjesuschrist.org/study/history/topics/adam-and-eve'},{text:'ğŸ“œ Bible â€” Genesis 1-3',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/1'}] },
        'melchizedek': { answer: "Melchizedek was a king and priest who lived in Abraham's time. He is mentioned in Genesis as offering bread and wine to Abraham. Abraham paid tithes to him. The priesthood order of Melchizedek is a holy order in LDS theology.", sources: [{text:'ğŸ“œ Bible â€” Genesis 14',url:'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/14.18'},{text:'ğŸ“œ Church â€” Melchizedek',url:'https://www.churchofjesuschrist.org/study/manual/book-of-mormon-student-manual/27-melchizedek'}] },
        'prophets': { answer: "Prophests are servants of God who speak for Him and receive revelation for His children. They testify of Jesus Christ, teach truth, warn of danger, and record scripture. The Church is led by living prophets today who receive revelation for our time.", sources: [{text:'ğŸ“œ Church â€” Prophets',url:'https://www.churchofjesuschrist.org/study/history/topics/prophets'},{text:'ğŸ“œ Bible â€” Hebrews 1',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/1'}] },
        'peter apostle': { answer: "Peter was one of the Twelve Apostles and considered the chief apostle. He was a fisherman called by Jesus to become a 'fisher of men.' He witnessed the Transfiguration, walked on water, and was given the keys of the kingdom. He led the early Church after Pentecost.", sources: [{text:'ğŸ“œ BYU â€” Peter Chief Apostle',url:'https://rsc.byu.edu/sperry-symposium-classics-new-testament/peter-chief-apostle'},{text:'ğŸ“œ Bible â€” Matthew 16',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/16'}] },
        'john apostle': { answer: "John was one of the Twelve Apostles, known as the 'Beloved disciple.' He wrote the Gospel of John, three epistles, and Revelation. He was exiled to Patmos and given visions of the Second Coming. He taught about love and bore testimony of Christ.", sources: [{text:'ğŸ“œ Encyclopedia â€” John',url:'https://eom.byu.edu/index.php/John'},{text:'ğŸ“œ Bible â€” John 1',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/john/1'}] },
        'paul apostle': { answer: "Paul was an apostle who persecuted Christians before converting on the road to Damascus. He wrote many New Testament epistles (Romans, Corinthians, Galatians, etc.) and spread Christianity throughout the Roman Empire. His writings form much of the New Testament.", sources: [{text:'ğŸ“œ Church â€” Paul',url:'https://www.churchofjesuschrist.org/study/history/topics/paul'},{text:'ğŸ“œ Bible â€” Acts 9',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/9'}] },
        'twelve apostles': { answer: "The Twelve Apostles were chosen by Jesus Christ to lead His Church after His departure. They received special authority and were witnesses of the Resurrection. The original twelve included Peter, Andrew, James, John, Philip, Bartholomew, Thomas, Matthew, James son of Alphaeus, Thaddaeus, Simon the Zealot, and Judas Iscariot (replaced by Matthias).", sources: [{text:'ğŸ“œ Church â€” Twelve Apostles',url:'https://www.churchofjesuschrist.org/study/history/topics/twelve-apostles'},{text:'ğŸ“œ Bible â€” Luke 6',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/6'}] },
        'Holy Ghost': { answer: "The Holy Ghost is the third member of the Godhead. He testifies of Christ, reveals truth, and sanctifies believers. In Latter-day Saint theology, the Holy Ghost is a personage of spirit who dwells in the hearts of the righteous.", sources: [{text:'ğŸ“œ Church â€” Holy Ghost',url:'https://www.churchofjesuschrist.org/study/history/topics/holy-ghost'},{text:'ğŸ“œ Bible â€” John 14',url:'https://www.churchofjesuschrist.org/study/scriptures/nt/john/14'}] },

ecially for children, during the difficult months on the trail. However, pets had to be cared for alongside the family's other needs.", sources: [{text:'ğŸ“œ National Park Service - Pioneer Life',url:'https://www.nps.gov/mopi/learn/history/pioneer-life.htm'},{text:'ğŸ“œ BYU - Pioneer Animals',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
        'pioneer fire': { answer: "Fire was essential for pioneer survival on the trail. Pioneers used fires for: (1) Cooking meals - bread, biscuits, stews, and coffee; (2) Warmth - especially cold mountain crossings and winter travel; (3) Water purification - boiling stream water to prevent disease; (4) Light - campfires provided illumination at night; (5) Signal fires - in emergencies. Firewood had to be gathered daily at campsites. Pioneers carried flint, steel, or matches to start fires. Women typically managed camp cooking while men gathered wood and water.", sources: [{text:'ğŸ“œ National Park Service - Camp Life',url:'https://www.nps.gov/mopi/learn/history/pioneer-camping.htm'},{text:'ğŸ“œ BYU - Pioneer Daily Life',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture/daily-life-trail'}] },
        'pioneer water': { answer: "Water was critical for pioneer survival on the Mormon Trail. Each person needed about 2 gallons daily for drinking and cooking. Key water sources along the trail included: (1) Rivers - Missouri, Platte, Sweetwater, and Green Rivers; (2) Springs and creeks in mountain passes; (3) Rainwater collected in barrels. Water was often muddy and scarce, especially in desert sections. Pioneers learned to conserve water carefully. Disease spread through contaminated water, making boiling essential. Some companies had difficulty finding water, leading to dehydration and illness.", sources: [{text:'ğŸ“œ National Park Service - Water and Trail',url:'https://www.nps.gov/mopi/learn/history/pioneer-life.htm'},{text:'ğŸ“œ Church History - Pioneer Provisions',url:'https://history.churchofjesuschrist.org/landing/fleeing-illinois/pioneer-provisions'}] },
        'pioneer grass': { answer: "Grass was vital for feeding draft animals on the Mormon Trail. Oxen, horses, and mules needed to graze daily while on the march. Pioneer companies stopped in areas with good grass, called 'grass parks' or 'rich bottoms.' The best grazing was typically near rivers and streams. In desert sections, pioneers carried grass seed to plant for future travelers. Poor grass meant weak animals that couldn't pull wagons, creating serious problems. The quality of grass often determined daily travel distance.", sources: [{text:'ğŸ“œ National Park Service - Animals on Trail',url:'https://www.nps.gov/mopi/learn/history/pioneer-life.htm'},{text:'ğŸ“œ BYU - Pioneer Oxen and Wagons',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture/pioneer-oxen-and-wagons'}] },
        'pioneer firewood': { answer: "Firewood was a daily necessity for pioneers. Each evening, men and boys went to gather wood while women prepared camp. Common fuel sources included: (1) Buffalo chips (dried dung) - used extensively on the plains where trees were scarce; (2) Driftwood - along riverbanks; (3) Tree branches and roots - in forested areas; (4) Sagebrush - in desert regions. Wood was often scarce, so pioneers burned efficiently and shared fuel. Women managed the fire and did most of the cooking. Adequate fuel meant warm meals and protection from cold.", sources: [{text:'ğŸ“œ National Park Service - Camp Life',url:'https://www.nps.gov/mopi/learn/history/pioneer-camping.htm'},{text:'ğŸ“œ BYU - Pioneer Cooking',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture/pioneer-food-and-cooking'}] },
        'pioneer rest days': { answer: "Pioneers observed Sunday as a day of rest whenever possible. On rest days, pioneers would: (1) Skip travel - no walking or wagon movement; (2) Hold church services - hymn singing, prayers, and preaching; (3) Do laundry - wash clothes in streams; (4) Repair equipment - fix wagons, shoes, and clothing; (5) Rest animals - let oxen and horses graze. Not all companies observed Sunday rest, especially in emergencies. The rhythm of rest days helped maintain physical and spiritual strength. Brigham Young encouraged pioneers to keep the Sabbath while on the trail.", sources: [{text:'ğŸ“œ Church History - Pioneer Life',url:'https://www.churchofjesuschrist.org/study/history/topics/pioneer-life'},{text:'ğŸ“œ National Park Service - Daily Schedule',url:'https://www.nps.gov/mopi/learn/history/pioneer-life.htm'}] },
        'pioneer weather': { answer: "Weather was one of the biggest challenges pioneers faced on the Mormon Trail. Summer brought: intense heat in deserts, dust storms, and thunderstorms. Winter dangers included: blizzards, freezing temperatures, and snow. Mountain crossings were especially hazardous with sudden weather changes. Pioneers had to judge timing carefully - leaving too late risked winter storms (like the 1856 tragedies), while leaving too early meant crossing swollen rivers. Weather determined daily travel, camp location, and sometimes survival. The pioneers endured extremes to reach Zion.", sources: [{text:'ğŸ“œ National Park Service - Weather Challenges',url:'https://www.nps.gov/mopi/learn/history/pioneer-life.htm'},{text:'ğŸ“œ BYU - Pioneer Hardships',url:'https://rsc.byu.edu/archived/pioneer-life-and-culture'}] },
