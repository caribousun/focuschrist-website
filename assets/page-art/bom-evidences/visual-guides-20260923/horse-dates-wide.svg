<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Keep the dates in view</title><desc id="desc">Keep the dates in view. Early 1600s CE: Horses in the northern Rockies and central plains. 1700s observers: European accounts came after this integration. The earlier question: This study does not establish Book of Mormon-era horses. Earlier than some written accounts does not mean every earlier period.</desc><rect width="1200" height="700" rx="18" fill="#142e38"/><text x="45" y="70" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="44"><tspan x="45" dy="0">Keep the dates in view</tspan></text><rect x="45" y="145" width="340" height="365" rx="12" fill="#203e45"/><path d="M69 172 H361" stroke="#b99b63" stroke-width="3"/><text x="69" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="69" dy="0">Early 1600s CE</tspan></text><text x="69" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="69" dy="0">Horses in the</tspan><tspan x="69" dy="40.0">northern Rockies</tspan><tspan x="69" dy="40.0">and central plains</tspan></text><rect x="430" y="145" width="340" height="365" rx="12" fill="#1c363e"/><path d="M454 172 H746" stroke="#b99b63" stroke-width="3"/><text x="454" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="454" dy="0">1700s observers</tspan></text><text x="454" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="454" dy="0">European accounts</tspan><tspan x="454" dy="40.0">came after this</tspan><tspan x="454" dy="40.0">integration</tspan></text><rect x="815" y="145" width="340" height="365" rx="12" fill="#203e45"/><path d="M839 172 H1131" stroke="#b99b63" stroke-width="3"/><text x="839" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="839" dy="0">The earlier</tspan><tspan x="839" dy="40.0">question</tspan></text><text x="839" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="839" dy="0">This study does</tspan><tspan x="839" dy="40.0">not establish Book</tspan><tspan x="839" dy="40.0">of Mormon-era</tspan><tspan x="839" dy="40.0">horses</tspan></text><path d="M45 552 H1155" stroke="#647469"/><text x="45" y="598" fill="#d4dccc" font-family="Arial, sans-serif" font-size="30"><tspan x="45" dy="0">Earlier than some written accounts does not mean every earlier</tspan><tspan x="45" dy="37.5">period.</tspan></text></svg>