<svg xmlns="http://www.w3.org/2000/svg" width="600" height="761" viewBox="0 0 600 761" role="img" aria-labelledby="title desc"><title id="title">Who is in the comparison?</title><desc id="desc">Who is in the comparison?. A text to examine: Its author is the question. Named candidates: The writers included in the study. An open set: The author may be outside that group. Changing the candidate set can change the conclusion.</desc><rect width="600" height="761" rx="18" fill="#142e38"/><text x="42" y="62" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="36" text-anchor="start"><tspan x="42" dy="0">Who is in the comparison?</tspan></text><path d="M48 130 H552 V241 H48 Z" fill="#203e45"/><path d="M48 130 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="163" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">A text to examine</tspan></text><text x="48" y="211" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Its author is the question</tspan></text><path d="M48 266 H552 V414 H48 Z" fill="#1d363d"/><path d="M48 266 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="299" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Named candidates</tspan></text><text x="48" y="347" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">The writers included in the</tspan><tspan x="48" dy="37.5">study</tspan></text><path d="M48 439 H552 V587 H48 Z" fill="#203e45"/><path d="M48 439 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="472" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">An open set</tspan></text><text x="48" y="520" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">The author may be outside</tspan><tspan x="48" dy="37.5">that group</tspan></text><path d="M42 617 H558" stroke="#647469" stroke-width="1"/><text x="42" y="656" fill="#d4dccc" font-family="Arial, sans-serif" font-size="28" text-anchor="start"><tspan x="42" dy="0">Changing the candidate set can</tspan><tspan x="42" dy="35.0">change the conclusion.</tspan></text></svg>