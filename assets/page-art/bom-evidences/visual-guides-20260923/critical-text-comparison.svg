<svg xmlns="http://www.w3.org/2000/svg" width="600" height="798" viewBox="0 0 600 798" role="img" aria-labelledby="title desc"><title id="title">Look closely at the witness</title><desc id="desc">Look closely at the witness. Photograph: See the surviving ink and paper. Transcript: Read the editors’ rendering of the marks. Comparison: Return to the image and examine the reading. A transcript helps us read; the photograph lets us look again.</desc><rect width="600" height="798" rx="18" fill="#142e38"/><text x="42" y="62" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="36" text-anchor="start"><tspan x="42" dy="0">Look closely at the witness</tspan></text><path d="M48 130 H552 V278 H48 Z" fill="#203e45"/><path d="M48 130 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="163" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Photograph</tspan></text><text x="48" y="211" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">See the surviving ink and</tspan><tspan x="48" dy="37.5">paper</tspan></text><path d="M48 303 H552 V451 H48 Z" fill="#1d363d"/><path d="M48 303 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="336" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Transcript</tspan></text><text x="48" y="384" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Read the editors’ rendering</tspan><tspan x="48" dy="37.5">of the marks</tspan></text><path d="M48 476 H552 V624 H48 Z" fill="#203e45"/><path d="M48 476 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="509" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Comparison</tspan></text><text x="48" y="557" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Return to the image and</tspan><tspan x="48" dy="37.5">examine the reading</tspan></text><path d="M42 654 H558" stroke="#647469" stroke-width="1"/><text x="42" y="693" fill="#d4dccc" font-family="Arial, sans-serif" font-size="28" text-anchor="start"><tspan x="42" dy="0">A transcript helps us read; the</tspan><tspan x="42" dy="35.0">photograph lets us look again.</tspan></text></svg>