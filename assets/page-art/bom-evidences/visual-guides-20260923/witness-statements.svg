<svg xmlns="http://www.w3.org/2000/svg" width="600" height="871" viewBox="0 0 600 871" role="img" aria-labelledby="title desc"><title id="title">Two published testimonies</title><desc id="desc">Two published testimonies. The Three Witnesses: An angel showed the plates; they heard God’s voice. The Eight Witnesses: Joseph showed the plates; they saw and handled them. Read each account: Different stated experiences belong in the comparison. These are summaries of the statements, not reconstructed signatures.</desc><rect width="600" height="871" rx="18" fill="#142e38"/><text x="42" y="62" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="36" text-anchor="start"><tspan x="42" dy="0">Two published testimonies</tspan></text><path d="M48 130 H552 V278 H48 Z" fill="#203e45"/><path d="M48 130 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="163" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">The Three Witnesses</tspan></text><text x="48" y="211" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">An angel showed the plates;</tspan><tspan x="48" dy="37.5">they heard God’s voice</tspan></text><path d="M48 303 H552 V451 H48 Z" fill="#1d363d"/><path d="M48 303 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="336" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">The Eight Witnesses</tspan></text><text x="48" y="384" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Joseph showed the plates;</tspan><tspan x="48" dy="37.5">they saw and handled them</tspan></text><path d="M48 476 H552 V661 H48 Z" fill="#203e45"/><path d="M48 476 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="509" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Read each account</tspan></text><text x="48" y="557" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Different stated</tspan><tspan x="48" dy="37.5">experiences belong in the</tspan><tspan x="48" dy="37.5">comparison</tspan></text><path d="M42 691 H558" stroke="#647469" stroke-width="1"/><text x="42" y="730" fill="#d4dccc" font-family="Arial, sans-serif" font-size="28" text-anchor="start"><tspan x="42" dy="0">These are summaries of the</tspan><tspan x="42" dy="35.0">statements, not reconstructed</tspan><tspan x="42" dy="35.0">signatures.</tspan></text></svg>