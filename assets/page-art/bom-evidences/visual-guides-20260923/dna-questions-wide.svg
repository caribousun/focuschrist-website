<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Ancestry and identification</title><desc id="desc">Ancestry and identification. Population history: Genetic research traces relationships among populations. A named family: Lehi’s own DNA profile is unknown. The distinction: Ancestry evidence does not identify Lehi’s descendants. The Church essay cautions against claiming DNA settles the book’s authenticity.</desc><rect width="1200" height="700" rx="18" fill="#142e38"/><text x="45" y="70" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="44"><tspan x="45" dy="0">Ancestry and identification</tspan></text><rect x="45" y="145" width="340" height="365" rx="12" fill="#203e45"/><path d="M69 172 H361" stroke="#b99b63" stroke-width="3"/><text x="69" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="69" dy="0">Population history</tspan></text><text x="69" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="69" dy="0">Genetic research</tspan><tspan x="69" dy="40.0">traces</tspan><tspan x="69" dy="40.0">relationships</tspan><tspan x="69" dy="40.0">among populations</tspan></text><rect x="430" y="145" width="340" height="365" rx="12" fill="#1c363e"/><path d="M454 172 H746" stroke="#b99b63" stroke-width="3"/><text x="454" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="454" dy="0">A named family</tspan></text><text x="454" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="454" dy="0">Lehi’s own DNA</tspan><tspan x="454" dy="40.0">profile is unknown</tspan></text><rect x="815" y="145" width="340" height="365" rx="12" fill="#203e45"/><path d="M839 172 H1131" stroke="#b99b63" stroke-width="3"/><text x="839" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="839" dy="0">The distinction</tspan></text><text x="839" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="839" dy="0">Ancestry evidence</tspan><tspan x="839" dy="40.0">does not identify</tspan><tspan x="839" dy="40.0">Lehi’s descendants</tspan></text><path d="M45 552 H1155" stroke="#647469"/><text x="45" y="598" fill="#d4dccc" font-family="Arial, sans-serif" font-size="30"><tspan x="45" dy="0">The Church essay cautions against claiming DNA settles the book’s</tspan><tspan x="45" dy="37.5">authenticity.</tspan></text></svg>