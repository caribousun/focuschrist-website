<svg xmlns="http://www.w3.org/2000/svg" width="600" height="871" viewBox="0 0 600 871" role="img" aria-labelledby="title desc"><title id="title">Compare the English texts</title><desc id="desc">Compare the English texts. King James Bible: Read the passage in its setting. Book of Mormon: Compare the corresponding passage. The scholarly question: What agrees, what differs, and how should it be explained?. A textual relationship does not, by itself, explain how translation occurred.</desc><rect width="600" height="871" rx="18" fill="#142e38"/><text x="42" y="62" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="36" text-anchor="start"><tspan x="42" dy="0">Compare the English texts</tspan></text><path d="M48 130 H552 V278 H48 Z" fill="#203e45"/><path d="M48 130 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="163" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">King James Bible</tspan></text><text x="48" y="211" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Read the passage in its</tspan><tspan x="48" dy="37.5">setting</tspan></text><path d="M48 303 H552 V451 H48 Z" fill="#1d363d"/><path d="M48 303 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="336" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Book of Mormon</tspan></text><text x="48" y="384" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Compare the corresponding</tspan><tspan x="48" dy="37.5">passage</tspan></text><path d="M48 476 H552 V661 H48 Z" fill="#203e45"/><path d="M48 476 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="509" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">The scholarly question</tspan></text><text x="48" y="557" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">What agrees, what differs,</tspan><tspan x="48" dy="37.5">and how should it be</tspan><tspan x="48" dy="37.5">explained?</tspan></text><path d="M42 691 H558" stroke="#647469" stroke-width="1"/><text x="42" y="730" fill="#d4dccc" font-family="Arial, sans-serif" font-size="28" text-anchor="start"><tspan x="42" dy="0">A textual relationship does not,</tspan><tspan x="42" dy="35.0">by itself, explain how</tspan><tspan x="42" dy="35.0">translation occurred.</tspan></text></svg>