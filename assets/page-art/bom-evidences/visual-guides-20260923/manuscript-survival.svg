<svg xmlns="http://www.w3.org/2000/svg" width="600" height="834" viewBox="0 0 600 834" role="img" aria-labelledby="title desc"><title id="title">What survives of the dictation</title><desc id="desc">What survives of the dictation. 1829: Dictation recorded by scribes. 1841–1882: Stored in a cornerstone; water damage followed. Today: About 28% of the original text survives. A surviving fragment is evidence; a missing page remains missing.</desc><rect width="600" height="834" rx="18" fill="#142e38"/><text x="42" y="62" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="36" text-anchor="start"><tspan x="42" dy="0">What survives of the</tspan><tspan x="42" dy="45.0">dictation</tspan></text><path d="M50 150 V312" stroke="#bb9558" stroke-width="3"/><circle cx="50" cy="163" r="8" fill="#e6c07b"/><text x="86" y="163" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="86" dy="0">1829</tspan></text><text x="86" y="211" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="86" dy="0">Dictation recorded by</tspan><tspan x="86" dy="37.5">scribes</tspan></text><path d="M50 323 V485" stroke="#bb9558" stroke-width="3"/><circle cx="50" cy="336" r="8" fill="#e6c07b"/><text x="86" y="336" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="86" dy="0">1841–1882</tspan></text><text x="86" y="384" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="86" dy="0">Stored in a cornerstone;</tspan><tspan x="86" dy="37.5">water damage followed</tspan></text><path d="M50 496 V658" stroke="#bb9558" stroke-width="3"/><circle cx="50" cy="509" r="8" fill="#e6c07b"/><text x="86" y="509" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="86" dy="0">Today</tspan></text><text x="86" y="557" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="86" dy="0">About 28% of the original</tspan><tspan x="86" dy="37.5">text survives</tspan></text><path d="M42 654 H558" stroke="#647469" stroke-width="1"/><text x="42" y="693" fill="#d4dccc" font-family="Arial, sans-serif" font-size="28" text-anchor="start"><tspan x="42" dy="0">A surviving fragment is</tspan><tspan x="42" dy="35.0">evidence; a missing page remains</tspan><tspan x="42" dy="35.0">missing.</tspan></text></svg>