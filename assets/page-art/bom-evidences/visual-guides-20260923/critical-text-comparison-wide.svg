<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Look closely at the witness</title><desc id="desc">Look closely at the witness. Photograph: See the surviving ink and paper. Transcript: Read the editors’ rendering of the marks. Comparison: Return to the image and examine the reading. A transcript helps us read; the photograph lets us look again.</desc><rect width="1200" height="700" rx="18" fill="#142e38"/><text x="45" y="70" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="44"><tspan x="45" dy="0">Look closely at the witness</tspan></text><rect x="45" y="145" width="340" height="365" rx="12" fill="#203e45"/><path d="M69 172 H361" stroke="#b99b63" stroke-width="3"/><text x="69" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="69" dy="0">Photograph</tspan></text><text x="69" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="69" dy="0">See the surviving</tspan><tspan x="69" dy="40.0">ink and paper</tspan></text><rect x="430" y="145" width="340" height="365" rx="12" fill="#1c363e"/><path d="M454 172 H746" stroke="#b99b63" stroke-width="3"/><text x="454" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="454" dy="0">Transcript</tspan></text><text x="454" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="454" dy="0">Read the editors’</tspan><tspan x="454" dy="40.0">rendering of the</tspan><tspan x="454" dy="40.0">marks</tspan></text><rect x="815" y="145" width="340" height="365" rx="12" fill="#203e45"/><path d="M839 172 H1131" stroke="#b99b63" stroke-width="3"/><text x="839" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="839" dy="0">Comparison</tspan></text><text x="839" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="839" dy="0">Return to the</tspan><tspan x="839" dy="40.0">image and examine</tspan><tspan x="839" dy="40.0">the reading</tspan></text><path d="M45 552 H1155" stroke="#647469"/><text x="45" y="598" fill="#d4dccc" font-family="Arial, sans-serif" font-size="30"><tspan x="45" dy="0">A transcript helps us read; the photograph lets us look again.</tspan></text></svg>