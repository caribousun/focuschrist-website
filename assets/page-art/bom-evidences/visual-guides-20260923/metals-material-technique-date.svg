<svg xmlns="http://www.w3.org/2000/svg" width="600" height="798" viewBox="0 0 600 798" role="img" aria-labelledby="title desc"><title id="title">Three questions for a metal</title><desc id="desc">Three questions for a metal. Material: Copper and copper alloys at Mayapan. Technique: Evidence of casting and remelting. Period: Postclassic Mayapan: 1100–1450 CE. These findings do not establish earlier steel production.</desc><rect width="600" height="798" rx="18" fill="#142e38"/><text x="42" y="62" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="36" text-anchor="start"><tspan x="42" dy="0">Three questions for a metal</tspan></text><path d="M50 150 V312" stroke="#bb9558" stroke-width="3"/><circle cx="50" cy="163" r="8" fill="#e6c07b"/><text x="86" y="163" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="86" dy="0">Material</tspan></text><text x="86" y="211" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="86" dy="0">Copper and copper alloys</tspan><tspan x="86" dy="37.5">at Mayapan</tspan></text><path d="M50 323 V485" stroke="#bb9558" stroke-width="3"/><circle cx="50" cy="336" r="8" fill="#e6c07b"/><text x="86" y="336" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="86" dy="0">Technique</tspan></text><text x="86" y="384" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="86" dy="0">Evidence of casting and</tspan><tspan x="86" dy="37.5">remelting</tspan></text><path d="M50 496 V658" stroke="#bb9558" stroke-width="3"/><circle cx="50" cy="509" r="8" fill="#e6c07b"/><text x="86" y="509" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="86" dy="0">Period</tspan></text><text x="86" y="557" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="86" dy="0">Postclassic Mayapan:</tspan><tspan x="86" dy="37.5">1100–1450 CE</tspan></text><path d="M42 654 H558" stroke="#647469" stroke-width="1"/><text x="42" y="693" fill="#d4dccc" font-family="Arial, sans-serif" font-size="28" text-anchor="start"><tspan x="42" dy="0">These findings do not establish</tspan><tspan x="42" dy="35.0">earlier steel production.</tspan></text></svg>