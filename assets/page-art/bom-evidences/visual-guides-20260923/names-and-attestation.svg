<svg xmlns="http://www.w3.org/2000/svg" width="600" height="798" viewBox="0 0 600 798" role="img" aria-labelledby="title desc"><title id="title">What can a name tell us?</title><desc id="desc">What can a name tell us?. The proposed reading: Alma and a Hebrew root for youth or lad. The linguistic argument: Examine the form and proposed derivation. The limit: A possible derivation does not identify a person. Read the worked example before drawing a larger conclusion.</desc><rect width="600" height="798" rx="18" fill="#142e38"/><text x="42" y="62" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="36" text-anchor="start"><tspan x="42" dy="0">What can a name tell us?</tspan></text><path d="M48 130 H552 V278 H48 Z" fill="#203e45"/><path d="M48 130 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="163" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">The proposed reading</tspan></text><text x="48" y="211" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Alma and a Hebrew root for</tspan><tspan x="48" dy="37.5">youth or lad</tspan></text><path d="M48 303 H552 V451 H48 Z" fill="#1d363d"/><path d="M48 303 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="336" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">The linguistic argument</tspan></text><text x="48" y="384" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Examine the form and</tspan><tspan x="48" dy="37.5">proposed derivation</tspan></text><path d="M48 476 H552 V624 H48 Z" fill="#203e45"/><path d="M48 476 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="509" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">The limit</tspan></text><text x="48" y="557" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">A possible derivation does</tspan><tspan x="48" dy="37.5">not identify a person</tspan></text><path d="M42 654 H558" stroke="#647469" stroke-width="1"/><text x="42" y="693" fill="#d4dccc" font-family="Arial, sans-serif" font-size="28" text-anchor="start"><tspan x="42" dy="0">Read the worked example before</tspan><tspan x="42" dy="35.0">drawing a larger conclusion.</tspan></text></svg>