<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">A pattern you can follow</title><desc id="desc">A pattern you can follow. Alma 41:13: Good · Righteous · Just · Merciful. Alma 41:14: Merciful · Justly · Righteously · Good. Follow the reversed sequence, then return to Alma’s teaching about restoration.</desc><rect width="1200" height="700" rx="18" fill="#142e38"/><text x="45" y="70" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="44"><tspan x="45" dy="0">A pattern you can follow</tspan></text><text x="45" y="156" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="45" dy="0">Alma 41:13</tspan></text><text x="45" y="500" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="45" dy="0">Alma 41:14</tspan></text><path d="M133 252 C133 290,1003 340,1003 382" stroke="#e6c07b" stroke-width="4" fill="none" opacity=".65"/><text x="45" y="230" fill="#e6c07b" font-family="Arial, sans-serif" font-size="36"><tspan x="45" dy="0">Good</tspan></text><text x="45" y="422" fill="#a6cbd3" font-family="Arial, sans-serif" font-size="36"><tspan x="45" dy="0">Merciful</tspan></text><path d="M423 252 C423 290,713 340,713 382" stroke="#b5d1c0" stroke-width="4" fill="none" opacity=".65"/><text x="335" y="230" fill="#b5d1c0" font-family="Arial, sans-serif" font-size="36"><tspan x="335" dy="0">Righteous</tspan></text><text x="335" y="422" fill="#dfb69e" font-family="Arial, sans-serif" font-size="36"><tspan x="335" dy="0">Justly</tspan></text><path d="M713 252 C713 290,423 340,423 382" stroke="#dfb69e" stroke-width="4" fill="none" opacity=".65"/><text x="625" y="230" fill="#dfb69e" font-family="Arial, sans-serif" font-size="36"><tspan x="625" dy="0">Just</tspan></text><text x="625" y="422" fill="#b5d1c0" font-family="Arial, sans-serif" font-size="36"><tspan x="625" dy="0">Righteously</tspan></text><path d="M1003 252 C1003 290,133 340,133 382" stroke="#a6cbd3" stroke-width="4" fill="none" opacity=".65"/><text x="915" y="230" fill="#a6cbd3" font-family="Arial, sans-serif" font-size="36"><tspan x="915" dy="0">Merciful</tspan></text><text x="915" y="422" fill="#e6c07b" font-family="Arial, sans-serif" font-size="36"><tspan x="915" dy="0">Good</tspan></text><path d="M45 552 H1155" stroke="#647469"/><text x="45" y="598" fill="#d4dccc" font-family="Arial, sans-serif" font-size="30"><tspan x="45" dy="0">Follow the reversed sequence, then return to Alma’s teaching about</tspan><tspan x="45" dy="37.5">restoration.</tspan></text></svg>