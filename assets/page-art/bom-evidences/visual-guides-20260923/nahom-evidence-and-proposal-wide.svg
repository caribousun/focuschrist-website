<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">An inscription and a proposal</title><desc id="desc">An inscription and a proposal. The inscription: NHM appears in ancient South Arabian inscriptions. The scriptural account: Ishmael is buried at a place called Nahom. The proposed connection: Scholars compare the consonants and regional setting. The inscription is an artifact; the identification remains an argument.</desc><rect width="1200" height="700" rx="18" fill="#142e38"/><text x="45" y="70" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="44"><tspan x="45" dy="0">An inscription and a proposal</tspan></text><rect x="45" y="145" width="340" height="365" rx="12" fill="#203e45"/><path d="M69 172 H361" stroke="#b99b63" stroke-width="3"/><text x="69" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="69" dy="0">The inscription</tspan></text><text x="69" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="69" dy="0">NHM appears in</tspan><tspan x="69" dy="40.0">ancient South</tspan><tspan x="69" dy="40.0">Arabian</tspan><tspan x="69" dy="40.0">inscriptions</tspan></text><rect x="430" y="145" width="340" height="365" rx="12" fill="#1c363e"/><path d="M454 172 H746" stroke="#b99b63" stroke-width="3"/><text x="454" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="454" dy="0">The scriptural</tspan><tspan x="454" dy="40.0">account</tspan></text><text x="454" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="454" dy="0">Ishmael is buried</tspan><tspan x="454" dy="40.0">at a place called</tspan><tspan x="454" dy="40.0">Nahom</tspan></text><rect x="815" y="145" width="340" height="365" rx="12" fill="#203e45"/><path d="M839 172 H1131" stroke="#b99b63" stroke-width="3"/><text x="839" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="839" dy="0">The proposed</tspan><tspan x="839" dy="40.0">connection</tspan></text><text x="839" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="839" dy="0">Scholars compare</tspan><tspan x="839" dy="40.0">the consonants and</tspan><tspan x="839" dy="40.0">regional setting</tspan></text><path d="M45 552 H1155" stroke="#647469"/><text x="45" y="598" fill="#d4dccc" font-family="Arial, sans-serif" font-size="30"><tspan x="45" dy="0">The inscription is an artifact; the identification remains an</tspan><tspan x="45" dy="37.5">argument.</tspan></text></svg>