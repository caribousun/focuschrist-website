<svg xmlns="http://www.w3.org/2000/svg" width="600" height="834" viewBox="0 0 600 834" role="img" aria-labelledby="title desc"><title id="title">Called by the name of Christ</title><desc id="desc">Called by the name of Christ. Mosiah 5:7: Changed hearts through faith in His name. Mosiah 5:8: Take upon you the name of Christ. Mosiah 5:12–15: Remember Him and continue in good works. Benjamin’s invitation concerns a covenant and a life of discipleship.</desc><rect width="600" height="834" rx="18" fill="#142e38"/><text x="42" y="62" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="36" text-anchor="start"><tspan x="42" dy="0">Called by the name of</tspan><tspan x="42" dy="45.0">Christ</tspan></text><path d="M48 130 H552 V278 H48 Z" fill="#203e45"/><path d="M48 130 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="163" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Mosiah 5:7</tspan></text><text x="48" y="211" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Changed hearts through</tspan><tspan x="48" dy="37.5">faith in His name</tspan></text><path d="M48 303 H552 V451 H48 Z" fill="#1d363d"/><path d="M48 303 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="336" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Mosiah 5:8</tspan></text><text x="48" y="384" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Take upon you the name of</tspan><tspan x="48" dy="37.5">Christ</tspan></text><path d="M48 476 H552 V624 H48 Z" fill="#203e45"/><path d="M48 476 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="509" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Mosiah 5:12–15</tspan></text><text x="48" y="557" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Remember Him and continue</tspan><tspan x="48" dy="37.5">in good works</tspan></text><path d="M42 654 H558" stroke="#647469" stroke-width="1"/><text x="42" y="693" fill="#d4dccc" font-family="Arial, sans-serif" font-size="28" text-anchor="start"><tspan x="42" dy="0">Benjamin’s invitation concerns a</tspan><tspan x="42" dy="35.0">covenant and a life of</tspan><tspan x="42" dy="35.0">discipleship.</tspan></text></svg>