<svg xmlns="http://www.w3.org/2000/svg" width="600" height="871" viewBox="0 0 600 871" role="img" aria-labelledby="title desc"><title id="title">Ancestry and identification</title><desc id="desc">Ancestry and identification. Population history: Genetic research traces relationships among populations. A named family: Lehi’s own DNA profile is unknown. The distinction: Ancestry evidence does not identify Lehi’s descendants. The Church essay cautions against claiming DNA settles the book’s authenticity.</desc><rect width="600" height="871" rx="18" fill="#142e38"/><text x="42" y="62" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="36" text-anchor="start"><tspan x="42" dy="0">Ancestry and identification</tspan></text><path d="M48 130 H552 V315 H48 Z" fill="#203e45"/><path d="M48 130 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="163" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Population history</tspan></text><text x="48" y="211" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Genetic research traces</tspan><tspan x="48" dy="37.5">relationships among</tspan><tspan x="48" dy="37.5">populations</tspan></text><path d="M48 340 H552 V488 H48 Z" fill="#1d363d"/><path d="M48 340 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="373" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">A named family</tspan></text><text x="48" y="421" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Lehi’s own DNA profile is</tspan><tspan x="48" dy="37.5">unknown</tspan></text><path d="M48 513 H552 V661 H48 Z" fill="#203e45"/><path d="M48 513 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="546" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">The distinction</tspan></text><text x="48" y="594" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Ancestry evidence does not</tspan><tspan x="48" dy="37.5">identify Lehi’s descendants</tspan></text><path d="M42 691 H558" stroke="#647469" stroke-width="1"/><text x="42" y="730" fill="#d4dccc" font-family="Arial, sans-serif" font-size="28" text-anchor="start"><tspan x="42" dy="0">The Church essay cautions</tspan><tspan x="42" dy="35.0">against claiming DNA settles the</tspan><tspan x="42" dy="35.0">book’s authenticity.</tspan></text></svg>