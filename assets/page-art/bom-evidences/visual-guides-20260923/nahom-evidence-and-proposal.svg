<svg xmlns="http://www.w3.org/2000/svg" width="600" height="871" viewBox="0 0 600 871" role="img" aria-labelledby="title desc"><title id="title">An inscription and a proposal</title><desc id="desc">An inscription and a proposal. The inscription: NHM appears in ancient South Arabian inscriptions. The scriptural account: Ishmael is buried at a place called Nahom. The proposed connection: Scholars compare the consonants and regional setting. The inscription is an artifact; the identification remains an argument.</desc><rect width="600" height="871" rx="18" fill="#142e38"/><text x="42" y="62" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="36" text-anchor="start"><tspan x="42" dy="0">An inscription and a</tspan><tspan x="42" dy="45.0">proposal</tspan></text><path d="M48 130 H552 V278 H48 Z" fill="#203e45"/><path d="M48 130 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="163" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">The inscription</tspan></text><text x="48" y="211" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">NHM appears in ancient</tspan><tspan x="48" dy="37.5">South Arabian inscriptions</tspan></text><path d="M48 303 H552 V451 H48 Z" fill="#1d363d"/><path d="M48 303 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="336" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">The scriptural account</tspan></text><text x="48" y="384" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Ishmael is buried at a</tspan><tspan x="48" dy="37.5">place called Nahom</tspan></text><path d="M48 476 H552 V661 H48 Z" fill="#203e45"/><path d="M48 476 H552" stroke="#b99b63" stroke-width="2"/><text x="48" y="509" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">The proposed connection</tspan></text><text x="48" y="557" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="48" dy="0">Scholars compare the</tspan><tspan x="48" dy="37.5">consonants and regional</tspan><tspan x="48" dy="37.5">setting</tspan></text><path d="M42 691 H558" stroke="#647469" stroke-width="1"/><text x="42" y="730" fill="#d4dccc" font-family="Arial, sans-serif" font-size="28" text-anchor="start"><tspan x="42" dy="0">The inscription is an artifact;</tspan><tspan x="42" dy="35.0">the identification remains an</tspan><tspan x="42" dy="35.0">argument.</tspan></text></svg>