<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Compare the English texts</title><desc id="desc">Compare the English texts. King James Bible: Read the passage in its setting. Book of Mormon: Compare the corresponding passage. The scholarly question: What agrees, what differs, and how should it be explained?. A textual relationship does not, by itself, explain how translation occurred.</desc><rect width="1200" height="700" rx="18" fill="#142e38"/><text x="45" y="70" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="44"><tspan x="45" dy="0">Compare the English texts</tspan></text><rect x="45" y="145" width="340" height="365" rx="12" fill="#203e45"/><path d="M69 172 H361" stroke="#b99b63" stroke-width="3"/><text x="69" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="69" dy="0">King James Bible</tspan></text><text x="69" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="69" dy="0">Read the passage</tspan><tspan x="69" dy="40.0">in its setting</tspan></text><rect x="430" y="145" width="340" height="365" rx="12" fill="#1c363e"/><path d="M454 172 H746" stroke="#b99b63" stroke-width="3"/><text x="454" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="454" dy="0">Book of Mormon</tspan></text><text x="454" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="454" dy="0">Compare the</tspan><tspan x="454" dy="40.0">corresponding</tspan><tspan x="454" dy="40.0">passage</tspan></text><rect x="815" y="145" width="340" height="365" rx="12" fill="#203e45"/><path d="M839 172 H1131" stroke="#b99b63" stroke-width="3"/><text x="839" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="839" dy="0">The scholarly</tspan><tspan x="839" dy="40.0">question</tspan></text><text x="839" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="839" dy="0">What agrees, what</tspan><tspan x="839" dy="40.0">differs, and how</tspan><tspan x="839" dy="40.0">should it be</tspan><tspan x="839" dy="40.0">explained?</tspan></text><path d="M45 552 H1155" stroke="#647469"/><text x="45" y="598" fill="#d4dccc" font-family="Arial, sans-serif" font-size="30"><tspan x="45" dy="0">A textual relationship does not, by itself, explain how translation</tspan><tspan x="45" dy="37.5">occurred.</tspan></text></svg>