<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Who is in the comparison?</title><desc id="desc">Who is in the comparison?. A text to examine: Its author is the question. Named candidates: The writers included in the study. An open set: The author may be outside that group. Changing the candidate set can change the conclusion.</desc><rect width="1200" height="700" rx="18" fill="#142e38"/><text x="45" y="70" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="44"><tspan x="45" dy="0">Who is in the comparison?</tspan></text><rect x="45" y="145" width="340" height="365" rx="12" fill="#203e45"/><path d="M69 172 H361" stroke="#b99b63" stroke-width="3"/><text x="69" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="69" dy="0">A text to examine</tspan></text><text x="69" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="69" dy="0">Its author is the</tspan><tspan x="69" dy="40.0">question</tspan></text><rect x="430" y="145" width="340" height="365" rx="12" fill="#1c363e"/><path d="M454 172 H746" stroke="#b99b63" stroke-width="3"/><text x="454" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="454" dy="0">Named candidates</tspan></text><text x="454" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="454" dy="0">The writers</tspan><tspan x="454" dy="40.0">included in the</tspan><tspan x="454" dy="40.0">study</tspan></text><rect x="815" y="145" width="340" height="365" rx="12" fill="#203e45"/><path d="M839 172 H1131" stroke="#b99b63" stroke-width="3"/><text x="839" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="839" dy="0">An open set</tspan></text><text x="839" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="839" dy="0">The author may be</tspan><tspan x="839" dy="40.0">outside that group</tspan></text><path d="M45 552 H1155" stroke="#647469"/><text x="45" y="598" fill="#d4dccc" font-family="Arial, sans-serif" font-size="30"><tspan x="45" dy="0">Changing the candidate set can change the conclusion.</tspan></text></svg>