<svg xmlns="http://www.w3.org/2000/svg" width="600" height="805" viewBox="0 0 600 805" role="img" aria-labelledby="title desc"><title id="title">A pattern you can follow</title><desc id="desc">A pattern you can follow. Alma 41:13: Good · Righteous · Just · Merciful. Alma 41:14: Merciful · Justly · Righteously · Good. Follow the reversed sequence, then return to Alma’s teaching about restoration.</desc><rect width="600" height="805" rx="18" fill="#142e38"/><text x="42" y="62" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="36" text-anchor="start"><tspan x="42" dy="0">A pattern you can follow</tspan></text><text x="42" y="150" fill="#e6c07b" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="42" dy="0">Alma 41:13</tspan></text><text x="330" y="150" fill="#e6c07b" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="330" dy="0">Alma 41:14</tspan></text><path d="M240 210 C310 210,290 505,330 505" fill="none" stroke="#e6c07b" stroke-width="3" opacity=".7"/><text x="42" y="220" fill="#e6c07b" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="42" dy="0">Good</tspan></text><text x="330" y="220" fill="#a6cbd3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="330" dy="0">Merciful</tspan></text><path d="M240 305 C310 305,290 410,330 410" fill="none" stroke="#b5d1c0" stroke-width="3" opacity=".7"/><text x="42" y="315" fill="#b5d1c0" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="42" dy="0">Righteous</tspan></text><text x="330" y="315" fill="#dfb69e" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="330" dy="0">Justly</tspan></text><path d="M240 400 C310 400,290 315,330 315" fill="none" stroke="#dfb69e" stroke-width="3" opacity=".7"/><text x="42" y="410" fill="#dfb69e" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="42" dy="0">Just</tspan></text><text x="330" y="410" fill="#b5d1c0" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="330" dy="0">Righteously</tspan></text><path d="M240 495 C310 495,290 220,330 220" fill="none" stroke="#a6cbd3" stroke-width="3" opacity=".7"/><text x="42" y="505" fill="#a6cbd3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="42" dy="0">Merciful</tspan></text><text x="330" y="505" fill="#e6c07b" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="330" dy="0">Good</tspan></text><path d="M42 625 H558" stroke="#647469" stroke-width="1"/><text x="42" y="664" fill="#d4dccc" font-family="Arial, sans-serif" font-size="28" text-anchor="start"><tspan x="42" dy="0">Follow the reversed sequence,</tspan><tspan x="42" dy="35.0">then return to Alma’s teaching</tspan><tspan x="42" dy="35.0">about restoration.</tspan></text></svg>