<svg xmlns="http://www.w3.org/2000/svg" width="600" height="871" viewBox="0 0 600 871" role="img" aria-labelledby="title desc"><title id="title">Keep the dates in view</title><desc id="desc">Keep the dates in view. Early 1600s CE: Horses in the northern Rockies and central plains. 1700s observers: European accounts came after this integration. The earlier question: This study does not establish Book of Mormon-era horses. Earlier than some written accounts does not mean every earlier period.</desc><rect width="600" height="871" rx="18" fill="#142e38"/><text x="42" y="62" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="36" text-anchor="start"><tspan x="42" dy="0">Keep the dates in view</tspan></text><path d="M50 150 V312" stroke="#bb9558" stroke-width="3"/><circle cx="50" cy="163" r="8" fill="#e6c07b"/><text x="86" y="163" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="86" dy="0">Early 1600s CE</tspan></text><text x="86" y="211" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="86" dy="0">Horses in the northern</tspan><tspan x="86" dy="37.5">Rockies and central</tspan><tspan x="86" dy="37.5">plains</tspan></text><path d="M50 323 V485" stroke="#bb9558" stroke-width="3"/><circle cx="50" cy="336" r="8" fill="#e6c07b"/><text x="86" y="336" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="86" dy="0">1700s observers</tspan></text><text x="86" y="384" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="86" dy="0">European accounts came</tspan><tspan x="86" dy="37.5">after this integration</tspan></text><path d="M50 496 V695" stroke="#bb9558" stroke-width="3"/><circle cx="50" cy="509" r="8" fill="#e6c07b"/><text x="86" y="509" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="86" dy="0">The earlier question</tspan></text><text x="86" y="557" fill="#fff1d3" font-family="Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="86" dy="0">This study does not</tspan><tspan x="86" dy="37.5">establish Book of Mormon-</tspan><tspan x="86" dy="37.5">era horses</tspan></text><path d="M42 691 H558" stroke="#647469" stroke-width="1"/><text x="42" y="730" fill="#d4dccc" font-family="Arial, sans-serif" font-size="28" text-anchor="start"><tspan x="42" dy="0">Earlier than some written</tspan><tspan x="42" dy="35.0">accounts does not mean every</tspan><tspan x="42" dy="35.0">earlier period.</tspan></text></svg>