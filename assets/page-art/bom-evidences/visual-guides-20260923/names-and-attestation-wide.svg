<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">What can a name tell us?</title><desc id="desc">What can a name tell us?. The proposed reading: Alma and a Hebrew root for youth or lad. The linguistic argument: Examine the form and proposed derivation. The limit: A possible derivation does not identify a person. Read the worked example before drawing a larger conclusion.</desc><rect width="1200" height="700" rx="18" fill="#142e38"/><text x="45" y="70" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="44"><tspan x="45" dy="0">What can a name tell us?</tspan></text><rect x="45" y="145" width="340" height="365" rx="12" fill="#203e45"/><path d="M69 172 H361" stroke="#b99b63" stroke-width="3"/><text x="69" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="69" dy="0">The proposed</tspan><tspan x="69" dy="40.0">reading</tspan></text><text x="69" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="69" dy="0">Alma and a Hebrew</tspan><tspan x="69" dy="40.0">root for youth or</tspan><tspan x="69" dy="40.0">lad</tspan></text><rect x="430" y="145" width="340" height="365" rx="12" fill="#1c363e"/><path d="M454 172 H746" stroke="#b99b63" stroke-width="3"/><text x="454" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="454" dy="0">The linguistic</tspan><tspan x="454" dy="40.0">argument</tspan></text><text x="454" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="454" dy="0">Examine the form</tspan><tspan x="454" dy="40.0">and proposed</tspan><tspan x="454" dy="40.0">derivation</tspan></text><rect x="815" y="145" width="340" height="365" rx="12" fill="#203e45"/><path d="M839 172 H1131" stroke="#b99b63" stroke-width="3"/><text x="839" y="217" fill="#f4cb7a" font-family="Arial, sans-serif" font-size="32"><tspan x="839" dy="0">The limit</tspan></text><text x="839" y="310" fill="#fff1d3" font-family="Arial, sans-serif" font-size="32"><tspan x="839" dy="0">A possible</tspan><tspan x="839" dy="40.0">derivation does</tspan><tspan x="839" dy="40.0">not identify a</tspan><tspan x="839" dy="40.0">person</tspan></text><path d="M45 552 H1155" stroke="#647469"/><text x="45" y="598" fill="#d4dccc" font-family="Arial, sans-serif" font-size="30"><tspan x="45" dy="0">Read the worked example before drawing a larger conclusion.</tspan></text></svg>