name: Art Scroll Cue

on:
  push:
    paths:
      - '.github/workflows/art-scroll-cue.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify expected production baseline
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "4e1908514ced88634fa0a638fb28ca35392bf0af"

      - name: Apply Art desktop scroll cue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('art.html')
          html = page.read_text(encoding='utf-8')
          old_href = 'art-hero.css?v=20260830-2'
          new_href = 'art-hero.css?v=20260830-3'
          if html.count(old_href) != 1:
              raise SystemExit(f'Expected exactly one old Art hero stylesheet version, found {html.count(old_href)}')
          html = html.replace(old_href, new_href, 1)
          page.write_text(html, encoding='utf-8')

          css = Path('art-hero.css')
          text = css.read_text(encoding='utf-8')
          marker = '/* Desktop gallery scroll cue — owner-approved 2026-08-30. */'
          if marker in text:
              raise SystemExit('Scroll cue marker already present')
          text += '''\n/* Desktop gallery scroll cue — owner-approved 2026-08-30.\n   A subtle visual instruction only; hidden on tablet/mobile and nonessential to navigation. */\n@media (min-width: 1100px) and (min-height: 760px) {\n    body.fc-site .fc-page-intro .fc-container--standard::after {\n        content: "Scroll to explore the gallery ↓";\n        display: block;\n        margin-top: 18px;\n        text-align: center;\n        color: var(--fc-gold-light);\n        font-size: 0.9rem;\n        font-weight: 500;\n        letter-spacing: 0.08em;\n        opacity: 0.92;\n    }\n}\n'''
          css.write_text(text, encoding='utf-8')
          PY

      - name: Verify narrow change and QA
        shell: bash
        run: |
          grep -F 'art-hero.css?v=20260830-3' art.html
          grep -F 'Scroll to explore the gallery ↓' art-hero.css
          python tools/site_qa.py
          python tools/unified_experience_qa.py
          python tools/resource_qa.py
          python tools/study_intelligence_qa.py
          python tools/hardened_experience_qa.py
          python tools/church_history_qa.py
          node --check site-common.js
          node --check art-study-router.js

      - name: Commit Art scroll cue
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art.html art-hero.css
          git commit -m 'Add Art desktop gallery scroll cue'
          git push origin HEAD:main
