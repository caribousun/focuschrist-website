name: Deploy focusChrist Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "groq-proxy/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: focuschrist-worker-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Worker source-integrity policy tests
        run: node groq-proxy/source-policy.test.js

      - name: Validate Worker JavaScript
        run: node --check groq-proxy/src/index.js

      - name: Deploy hardened Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: groq-proxy
          command: deploy
          wranglerVersion: "4.126.0"

      - name: Report missing deployment authorization
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "ERROR: deployment authorization is not configured."
          echo "Add encrypted CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, then run this workflow again."
          exit 1
