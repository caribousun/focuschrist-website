name: Deploy focusChrist Worker

on:
  workflow_dispatch:
    inputs:
      run_live_verification:
        description: "Run the paid live verification steps after deployment (live AI response matrix, conversation follow-ups, Pioneer topic battery, and the live-evidence artifact). Default false. Turning this on makes billable live requests, and turning it on is not itself cost authority: enabling paid live validation still requires explicit existing cost authority. This gate authorizes containment, not new billable tests (decision A-2026-10-25-CI-PAID-VALIDATION-GATE-01)."
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "groq-proxy/**"
      - "scripture-library.js"
      - "scripture-data/**"
      - "tools/build_church_source_index.py"
      - "tools/live_ai_response_matrix.js"
      - "tools/live_ai_capacity_contract.js"
      - "tools/live_ai_capacity_contract.test.js"
      - "tools/conversation_followup_live_qa.mjs"
      - "tools/pioneer_disclosure_live_qa.js"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: focuschrist-worker-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify complete scripture library and deterministic guard
        run: |
          python tools/build_scripture_catalog.py --check
          node tools/scripture_library_qa.js

      - name: Run Worker source-integrity policy tests
        run: |
          node tools/live_ai_capacity_contract.test.js
          node groq-proxy/source-policy.test.js
          node groq-proxy/self-help-support.test.js
          node groq-proxy/self-help-reviewed.test.js
          node groq-proxy/conversation-context.test.js
          node groq-proxy/research-escalation.test.js
          node groq-proxy/scripture-evidence.test.js
          node groq-proxy/source-discovery.test.js
          node groq-proxy/evidence-budget.test.js
          node groq-proxy/openai-research.test.js
          node groq-proxy/corpus-coverage.test.js
          node groq-proxy/corpus-evidence.test.js
          node groq-proxy/factual-followup.test.js
          node groq-proxy/relationship-audit.test.js
          node groq-proxy/historical-relationship.test.js
          node groq-proxy/transaction-outcome.test.js
          node groq-proxy/reviewed-readings.test.js
          node groq-proxy/reviewed-source-context.test.js
          node groq-proxy/direct-scripture-reading.test.js
          node groq-proxy/paragraph-intent.test.js
          node groq-proxy/source-caveat.test.js
          node groq-proxy/missing-subject.test.js
          node tools/scripture_quote_display_qa.js
          node groq-proxy/church-source-index.test.js

      - name: Validate committed Church source index
        run: python tools/build_church_source_index.py --check

      - name: Validate Worker JavaScript
        run: |
          node --check groq-proxy/src/index.js
          node --check groq-proxy/src/church-source-index.js

      - name: Set up Node.js
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: groq-proxy/package-lock.json

      - name: Install pinned Worker deployment dependencies
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: groq-proxy
        run: npm ci --ignore-scripts

      - name: Deploy hardened Worker
        id: deploy_worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: groq-proxy
        run: |
          cd ..
          python tools/wait_for_scripture_release.py
          cd groq-proxy
          npx --no-install wrangler deploy --config wrangler.toml

      - name: Allow Worker propagation
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: sleep 15

      - name: Run live AI response matrix
        if: ${{ !cancelled() && steps.deploy_worker.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_live_verification == true }}
        shell: bash
        run: node tools/live_ai_response_matrix.js 2>&1 | tee "$RUNNER_TEMP/focus-ai-matrix.log"

      - name: Allow live Ask rate limit to reset
        if: ${{ !cancelled() && steps.deploy_worker.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_live_verification == true }}
        run: sleep 70

      - name: Verify conversation follow-ups
        if: ${{ !cancelled() && steps.deploy_worker.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_live_verification == true }}
        shell: bash
        run: node tools/conversation_followup_live_qa.mjs 2>&1 | tee "$RUNNER_TEMP/focus-followups.log"

      - name: Verify all Pioneer topic answers
        if: ${{ !cancelled() && steps.deploy_worker.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_live_verification == true }}
        shell: bash
        run: node tools/pioneer_disclosure_live_qa.js 2>&1 | tee "$RUNNER_TEMP/focus-pioneer-topics.log"

      - name: Preserve live verification evidence
        if: ${{ !cancelled() && steps.deploy_worker.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_live_verification == true }}
        uses: actions/upload-artifact@v4
        with:
          name: focus-live-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/focus-ai-matrix.log
            ${{ runner.temp }}/focus-followups.log
            ${{ runner.temp }}/focus-pioneer-topics.log
          if-no-files-found: error

      - name: Record live verification opt-out
        if: ${{ cancelled() || steps.deploy_worker.outcome != 'success' || github.event_name != 'workflow_dispatch' || inputs.run_live_verification != true }}
        run: |
          {
            echo "## Live verification: NOT_RUN_OPT_OUT"
            echo ""
            echo "The paid live verification steps (live AI response matrix, conversation follow-ups, Pioneer topic battery, and the live-evidence artifact) did not run in this workflow run."
            echo "This record is NOT a live verification PASS."
            echo ""
            echo "- Event: ${{ github.event_name }}"
            echo "- workflow_dispatch input run_live_verification: ${{ inputs.run_live_verification }}"
            echo "- Deploy step outcome: ${{ steps.deploy_worker.outcome }}"
            echo ""
            echo "Live verification runs only when this workflow is started manually with workflow_dispatch and the run_live_verification input is set to true, and then only after a successful deployment."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report missing deployment authorization
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "ERROR: deployment authorization is not configured."
          echo "Add encrypted CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, then run this workflow again."
          exit 1
