name: Clean proven FocusChrist duplicate media

on:
  push:
    branches:
      - focus/robustness-phase2
    paths:
      - '.github/workflows/cleanup-proven-duplicates.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove only audited safe duplicates
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import re

          report = Path('repository-audit-phase2.md').read_text(encoding='utf-8')
          section = report.split('## Safe root duplicate candidates', 1)[1].split('## Safe zero-byte candidates', 1)[0]
          matches = re.findall(r'- `([^`]+)` → identical canonical copy `([^`]+)`', section)
          if not matches:
              raise SystemExit('No audited safe duplicate candidates found')

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          removed = []
          for duplicate, canonical in matches:
              duplicate_path = Path(duplicate)
              canonical_path = Path(canonical)
              if duplicate_path.parent != Path('.'):
                  raise SystemExit(f'Refusing non-root deletion: {duplicate}')
              if not canonical.startswith('art/') or canonical.startswith('art/thumbs/'):
                  raise SystemExit(f'Refusing noncanonical replacement: {canonical}')
              if not duplicate_path.exists() or not canonical_path.exists():
                  raise SystemExit(f'Missing audited pair: {duplicate} / {canonical}')
              if digest(duplicate_path) != digest(canonical_path):
                  raise SystemExit(f'Hash mismatch, refusing deletion: {duplicate}')
              duplicate_path.unlink()
              removed.append(duplicate)

          if len(removed) != 23:
              raise SystemExit(f'Expected 23 audited removals, got {len(removed)}')
          print(f'Removed {len(removed)} proven duplicate root media files')

      - name: Re-run repository audit
        run: python tools/repository-audit.py

      - name: Run FocusChrist site QA after cleanup
        run: python tools/site_qa.py

      - name: Commit conservative cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove 23 proven unreferenced duplicate media files"
          git push
