name: Validated duplicate cleanup second pass

on:
  push:
    branches:
      - focus/robustness-phase2
    paths:
      - '.github/workflows/cleanup-second-pass.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove only second-pass validated duplicates
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          candidates = [
              ('Divine-Push.png', 'art/Divine-Push.png'),
              ('Forever-Friends.png', 'art/Forever-Friends.png'),
              ('Forever.png', 'art/Forever.png'),
              ('Jesus-walking-Jerusalem.jpg', 'art/Jesus-walking-Jerusalem.jpg'),
              ('Little-Friends.jpg', 'art/Little-Friends.jpg'),
              ('Never-Alone.png', 'art/Never-Alone.png'),
              ('Palms.jpg', 'art/Palms.jpg'),
              ('Posterity.png', 'art/Posterity.png'),
              ('Tranquil-Morning.png', 'art/Tranquil-Morning.png'),
              ('working banner.png', 'working-banner.png'),
              ('art/Let it go.png', 'art/Let-It-Go.png'),
          ]
          text_exts = {'.html','.css','.js','.json','.jsonc','.xml','.txt','.md','.py','.yml','.yaml','.toml','.ini','.cfg','.csv'}
          ignore = {
              '.github/workflows/cleanup-second-pass.yml',
              'repository-audit-phase2.md',
          }

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          texts = {}
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_exts:
                  continue
              rel = path.as_posix()
              if rel in ignore:
                  continue
              texts[rel] = path.read_text(encoding='utf-8', errors='ignore')

          removed = []
          for duplicate, canonical in candidates:
              dup = Path(duplicate)
              can = Path(canonical)
              if not dup.exists() or not can.exists():
                  raise SystemExit(f'Missing candidate pair: {duplicate} / {canonical}')
              if digest(dup) != digest(can):
                  raise SystemExit(f'Byte mismatch: {duplicate} / {canonical}')

              for source, text in texts.items():
                  # Ignore the canonical path occurrence when it shares the same basename.
                  scrubbed = text.replace(canonical, '')
                  if duplicate in scrubbed:
                      raise SystemExit(f'Refusing deletion; {duplicate} is directly referenced by {source}')

              dup.unlink()
              removed.append(duplicate)

          if len(removed) != len(candidates):
              raise SystemExit('Unexpected removal count')
          print(f'Removed {len(removed)} additional validated duplicates')

      - name: Run strengthened site QA
        run: python tools/site_qa.py

      - name: Refresh audit snapshot
        run: python tools/repository-audit.py

      - name: Commit second-pass cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove 11 additional validated duplicate media files"
          git push
