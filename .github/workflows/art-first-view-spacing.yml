name: Art First View Spacing

on:
  push:
    paths:
      - '.github/workflows/art-first-view-spacing.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify expected production baseline
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "83686e5a2ebddee39ef11f03ee9d8238891252f4"

      - name: Apply narrow Art desktop spacing refinement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('art.html')
          html = page.read_text(encoding='utf-8')
          old_href = 'art-hero.css?v=20260830-1'
          new_href = 'art-hero.css?v=20260830-2'
          if html.count(old_href) != 1:
              raise SystemExit(f'Expected exactly one old Art hero stylesheet version, found {html.count(old_href)}')
          html = html.replace(old_href, new_href, 1)
          page.write_text(html, encoding='utf-8')

          css = Path('art-hero.css')
          text = css.read_text(encoding='utf-8')
          marker = '/* Desktop first-view gallery reveal refinement — owner-approved 2026-08-30. */'
          if marker in text:
              raise SystemExit('Spacing refinement marker already present')
          text += '''\n/* Desktop first-view gallery reveal refinement — owner-approved 2026-08-30.\n   Keep the introductory view visually complete before the first artwork row enters.\n   Tablet/mobile are intentionally unchanged. */\n@media (min-width: 1100px) and (min-height: 760px) {\n    body.fc-site .gallery {\n        padding-top: clamp(118px, 8vw, 136px) !important;\n    }\n}\n'''
          css.write_text(text, encoding='utf-8')
          PY

      - name: Verify narrow change and QA
        shell: bash
        run: |
          grep -F 'art-hero.css?v=20260830-2' art.html
          grep -F 'Desktop first-view gallery reveal refinement' art-hero.css
          grep -F 'padding-top: clamp(118px, 8vw, 136px) !important;' art-hero.css
          python tools/site_qa.py
          python tools/unified_experience_qa.py

      - name: Commit Art desktop spacing refinement
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art.html art-hero.css
          git commit -m 'Refine Art first-view gallery spacing'
          git push origin HEAD:main
