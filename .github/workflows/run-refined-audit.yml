name: Run refined repository audit

on:
  push:
    branches:
      - focus/robustness-phase2
    paths:
      - '.github/workflows/run-refined-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/repository-audit.py
      - run: python tools/site_qa.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repository-audit-phase2.md
          git commit -m "Refresh refined repository audit"
          git push
