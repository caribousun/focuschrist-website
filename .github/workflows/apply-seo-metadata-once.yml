name: Apply FocusChrist SEO Metadata Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-seo-metadata-once.yml'

permissions:
  contents: write

jobs:
  apply-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply managed SEO metadata
        run: python tools/apply-seo-metadata.py

      - name: Validate diff
        run: git -c core.whitespace=cr-at-eol diff --check

      - name: Commit static HTML updates
        run: |
          if git diff --quiet; then
            echo "No SEO changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ask.html art.html pioneers.html about.html
          git commit -m "Add search and social metadata to core pages"
          git push origin main

# CRLF-aware one-time metadata application.
