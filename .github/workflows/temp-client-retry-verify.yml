name: Temporary client retry verification

on:
  push:
    branches:
      - codex/client-transient-retry-scratch

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/client-transient-retry-scratch
          fetch-depth: 0
      - name: Apply bounded client retry patch
        run: python tools/temp_apply_client_retry.py
      - name: Run focused retry QA
        run: |
          python tools/study_intelligence_qa.py
          node tools/study_intelligence_v3_runtime_qa.js
          node --check study-intelligence-v3.js
          node --check site-common.js
          node --check study-source-router.js
      - name: Run complete site release QA
        run: |
          python tools/site_qa.py
          python tools/unified_experience_qa.py
          python tools/resource_qa.py
          python tools/study_intelligence_qa.py
          python tools/hardened_experience_qa.py
          python tools/pioneer_local_first_qa.py
          python tools/production_hardening_qa.py
          python tools/church_history_qa.py
          python tools/scripture_grounding_qa.py
          python tools/source_integrity_inventory.py
          python tools/static_content_audit.py
          node tools/source_integrity_runtime_qa.js
          node tools/reviewed_ask_knowledge_qa.js
          node tools/pioneer_ask_runtime_qa.js
          node tools/church_history_ask_runtime_qa.js
          node tools/study_intelligence_v3_runtime_qa.js
          node tools/question_safety_runtime_qa.js
          node groq-proxy/source-policy.test.js
          node groq-proxy/church-source-index.test.js
          python tools/build_church_source_index.py --check
      - name: Commit verified candidate
        run: |
          git config user.name "focusChrist retry verification"
          git config user.email "actions@users.noreply.github.com"
          git add study-intelligence-v3.js site-common.js study-source-router.js ask.html pioneers.html tools/study_intelligence_qa.py tools/hardened_experience_qa.py tools/scripture_grounding_qa.py tools/source_integrity_inventory.py tools/study_intelligence_v3_runtime_qa.js MEMORY.md
          git commit -m "Add bounded client retry for transient Ask failures"
          git push origin HEAD:codex/client-transient-retry-scratch
