name: Synchronize FocusChrist Site Header

on:
  push:
    branches:
      - focus/youtube-distribution-phase1
    paths:
      - '.github/workflows/sync-site-header.yml'
      - 'tools/sync_site_header.py'
      - 'site-header.css'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize all public page headers
        run: python tools/sync_site_header.py
      - name: Run permanent site QA
        run: python tools/site_qa.py
      - name: Commit synchronized header system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ask.html answers.html art.html pioneers.html about.html 404.html answers art-study tools/site_qa.py
          git commit -m "Synchronize canonical header across all public pages"
          git push
