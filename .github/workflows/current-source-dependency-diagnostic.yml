name: Current source dependency diagnostic (bounded, read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/current-source-dependency-diagnostic.yml
      - tools/current_source_dependency_diagnostic.py
      - tools/artwork_gabriel_owner_delivery.py
      - tools/artwork_three_reviewed_delivery.py
      - tools/historical_generated_index_context.py
      - tools/test_historical_generated_index_context.py
      - tools/run_current_mixed_regressions.py
      - tools/test_current_normalizer_fail_closed.py
      - tools/artwork_owner_closure.py
      - tools/test_artwork_owner_closure.py
      - timeline.html
      - timeline.css
      - tools/timeline_selector_check.py
      - tools/timeline_selector_semantics.py
      - tools/owner_integration_navigation.js
      - tools/test_owner_integration_navigation.js
      - tools/sitewide_artwork_review_qa.py
      - tools/test_owner_integration_contract.py
      - tools/test_owner_integration_panels.py
      - tools/test_owner_integration_successor.py
      - assets/page-art/jesus-journey/**
      - assets/page-art/answers-study/**
permissions:
  contents: read
jobs:
  current-source-diagnostic:
    name: Collect bounded source-validator results (not release acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact requested revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify existing QA dependency contract
        run: python tools/qa_dependency_contract.py --self-test
      - name: Install existing QA dependencies
        run: python -m pip install -r tools/qa-requirements.txt
      - name: Run independent bounded source diagnostics
        run: python tools/current_source_dependency_diagnostic.py
      - name: Retain individual results and callsite inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-source-dependency-diagnostic
          path: .qa-artifacts/current-source-dependency/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
