name: Art Scroll Cue Position

on:
  push:
    paths:
      - '.github/workflows/art-scroll-cue-position.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify expected production baseline
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "d981e54131f8832e1c331257133da735ea8dc880"

      - name: Move Art desktop scroll cue upward
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('art.html')
          html = page.read_text(encoding='utf-8')
          old_href = 'art-hero.css?v=20260830-3'
          new_href = 'art-hero.css?v=20260830-4'
          if html.count(old_href) != 1:
              raise SystemExit(f'Expected exactly one old Art hero stylesheet version, found {html.count(old_href)}')
          html = html.replace(old_href, new_href, 1)
          page.write_text(html, encoding='utf-8')

          css = Path('art-hero.css')
          text = css.read_text(encoding='utf-8')
          needle = '        margin-top: 18px;\n        text-align: center;'
          replacement = '        margin-top: 18px;\n        transform: translateY(-36px);\n        text-align: center;'
          if text.count(needle) != 1:
              raise SystemExit(f'Expected exactly one cue positioning target, found {text.count(needle)}')
          text = text.replace(needle, replacement, 1)
          css.write_text(text, encoding='utf-8')
          PY

      - name: Verify narrow change and QA
        shell: bash
        run: |
          grep -F 'art-hero.css?v=20260830-4' art.html
          grep -F 'Scroll to explore the gallery ↓' art-hero.css
          grep -F 'transform: translateY(-36px);' art-hero.css
          python tools/site_qa.py
          python tools/unified_experience_qa.py
          python tools/resource_qa.py
          python tools/study_intelligence_qa.py
          python tools/hardened_experience_qa.py
          python tools/church_history_qa.py
          node --check site-common.js
          node --check art-study-router.js

      - name: Commit Art scroll cue position
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art.html art-hero.css
          git commit -m 'Move Art gallery scroll cue upward'
          git push origin HEAD:main
