name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Verify complete scripture library and deterministic guard
        run: |
          python tools/build_scripture_catalog.py --check
          node tools/scripture_library_qa.js

      - name: Install decoded image QA dependency
        run: python -m pip install Pillow==12.2.0

      - name: Verify global artwork scanner regression fixtures
        run: python tools/topic_artwork_uniqueness_runtime_qa.py

      - name: Run focusChrist structural site QA
        run: |
          python tools/site_qa.py
          python tools/site_flow_qa.py
          python tools/media_voice_qa.py

      - name: Run Come Follow Me hub QA
        run: |
          python tools/come_follow_me_qa.py
          node tools/come_follow_me_reading_runtime_qa.js

      - name: Verify General Conference study hub and filters
        run: |
          python tools/general_conference_qa.py
          node tools/general_conference_runtime_qa.js
          node --check general-conference.js
          node tools/study_navigation_runtime_qa.js

      - name: Run focusChrist unified experience QA
        run: python tools/unified_experience_qa.py

      - name: Run site-wide artwork detail QA
        run: |
          python tools/artwork_details_qa.py
          python tools/art_study_enrichment_qa.py
          node tools/hero_details_runtime_qa.js

      - name: Verify every featured art supporting picture study panel
        run: |
          npm install --prefix "$RUNNER_TEMP/focuschrist-dom-qa" --no-save --package-lock=false --ignore-scripts jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/focuschrist-dom-qa/node_modules" node tools/art_study_picture_runtime_qa.js
          NODE_PATH="$RUNNER_TEMP/focuschrist-dom-qa/node_modules" node tools/scripture_display_runtime_qa.js
          NODE_PATH="$RUNNER_TEMP/focuschrist-dom-qa/node_modules" node tools/ask_composer_scroll_runtime_qa.js

      - name: Verify visual resource coverage and source thumbnails
        run: python tools/resource_thumbnail_qa.py

      - name: Verify every permanent Answer study experience
        run: |
          python tools/topic_inline_scripture_qa.py
          python tools/answer_study_parser_qa.py
          python tools/answer_study_qa.py
          python tools/answer_video_uniqueness_qa.py
          python tools/global_video_uniqueness_qa.py

      - name: Verify scripture reader sources and interactions
        run: |
          python tools/build_scripture_reader_data.py --check
          node tools/scripture_reader_runtime_qa.js
          node --check header-scroll.js

      - name: Run focusChrist resource QA
        run: python tools/resource_qa.py

      - name: Run focusChrist Study Intelligence QA
        run: python tools/study_intelligence_qa.py

      - name: Run focusChrist hardened experience QA
        run: python tools/hardened_experience_qa.py

      - name: Run Pioneer local-first and site-wide answer routing QA
        run: python tools/pioneer_local_first_qa.py

      - name: Run focusChrist production hardening QA
        run: python tools/production_hardening_qa.py

      - name: Run Church History source and experience QA
        run: python tools/church_history_qa.py

      - name: Run scripture grounding QA
        run: python tools/scripture_grounding_qa.py

      - name: Inventory source-dependent answer paths
        run: python tools/source_integrity_inventory.py

      - name: Enforce reviewed static-content ledger
        run: python tools/static_content_audit.py

      - name: Exercise source-integrity runtime guard
        run: node tools/source_integrity_runtime_qa.js

      - name: Exercise reviewed Ask knowledge registry
        run: node tools/reviewed_ask_knowledge_qa.js

      - name: Exercise Pioneer Ask final owner
        run: node tools/pioneer_ask_runtime_qa.js

      - name: Exercise Church History Ask final owner
        run: node tools/church_history_ask_runtime_qa.js

      - name: Exercise final Study Intelligence owner
        run: node tools/study_intelligence_v3_runtime_qa.js

      - name: Exercise shared question safety boundaries
        run: node tools/question_safety_runtime_qa.js

      - name: Exercise gateway source policy
        run: |
          node groq-proxy/source-policy.test.js
          node groq-proxy/conversation-context.test.js
          node groq-proxy/research-escalation.test.js
          node groq-proxy/scripture-evidence.test.js
          node groq-proxy/source-discovery.test.js
          node groq-proxy/evidence-budget.test.js
          node groq-proxy/openai-research.test.js
          node tools/scripture_quote_display_qa.js

      - name: Validate shared site JavaScript
        run: node --check site-common.js

      - name: Validate artwork detail JavaScript
        run: node --check artwork-details.js

      - name: Validate full-image viewer JavaScript
        run: node --check full-image-viewer.js

      - name: Verify artwork caption DOM and legacy detail contracts
        run: |
          python tools/topic_artwork_caption_runtime_qa.py
          node tools/artwork_details_runtime_qa.js

      - name: Run full-image viewer runtime QA
        run: node tools/full_image_viewer_runtime_qa.js

      - name: Validate grounded Study Intelligence JavaScript
        run: node --check study-intelligence-v3.js

      - name: Validate study journey JavaScript
        run: node --check study-journey.js

      - name: Validate study source router JavaScript
        run: node --check study-source-router.js

      - name: Validate Church History experience JavaScript
        run: node --check church-history-experience.js

      - name: Validate Art study router JavaScript
        run: node --check art-study-router.js

      - name: Validate Watch study enrichment JavaScript
        run: node --check watch-study-enrichment.js

      - name: Validate Watch experience JavaScript
        run: node --check watch-experience.js

      - name: Validate Art Ask context JavaScript
        run: node --check art-ask-context.js

      - name: Validate Ask experience JavaScript
        run: node --check ask-experience.js

      - name: Validate Pioneer experience JavaScript
        run: node --check pioneer-experience.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
