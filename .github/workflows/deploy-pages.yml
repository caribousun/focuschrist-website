name: Publish nursery retrieval and reviewed answer search once
on:
  push:
    branches:
      - albert/nursery-search-20261112-deploy
permissions:
  pages: write
  id-token: write
  contents: read
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 3ee6f3486838ddfe8e0f14b46106c5ab82dc4907
      EXPECTED_WORKFLOW_SHA256: 'bcf0f0a9fb7a1a0d6fcfd4684998508838d72d6abbbd0111478d401533488746'
    steps:
      - name: Check out one-release workflow
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 2
          sparse-checkout: .github/workflows/deploy-pages.yml
          sparse-checkout-cone-mode: false
      - name: Verify workflow and expected parent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/albert/nursery-search-20261112-deploy
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA 722b5b792575fc352a368496d5120bd23c4db70f"
          test "$(git diff-tree --no-commit-id --name-only -r 722b5b792575fc352a368496d5120bd23c4db70f HEAD)" = .github/workflows/deploy-pages.yml
          python -c "import hashlib,os,re,pathlib; p=pathlib.Path('.github/workflows/deploy-pages.yml').read_bytes(); x,n=re.subn(rb'(?m)^(      EXPECTED_WORKFLOW_SHA256: .)[0-9a-f]{64}(.).?$', lambda m:m.group(1)+b'0'*64+m.group(2), p); assert n==1 and hashlib.sha256(x).hexdigest()==os.environ['EXPECTED_WORKFLOW_SHA256'], 'workflow identity differs'"
          test "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
      - name: Check out only reviewed retrieval and search files
        uses: actions/checkout@v5
        with:
          ref: 3ee6f3486838ddfe8e0f14b46106c5ab82dc4907
          path: reviewed-bank
          submodules: false
          fetch-depth: 1
          sparse-checkout: |
            answer-bank-data.js
            ask.html
            pioneers.html
            site-search.js
            search.html
            tools/site_search_qa.py
            tools/site_search_runtime_qa.js
          sparse-checkout-cone-mode: false
      - name: Verify and preserve reviewed retrieval and search files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C reviewed-bank rev-parse HEAD)" = 3ee6f3486838ddfe8e0f14b46106c5ab82dc4907
          test "$(git -C reviewed-bank rev-parse HEAD:answer-bank-data.js)" = cceda78be3d682b95be5280a254fd9f3bbffbc9e
          echo '21d18d0799174e43e4853b69d8dc60f016f697985ea2b3d412a62963b048b8c2  reviewed-bank/answer-bank-data.js' | sha256sum --check
          cp reviewed-bank/answer-bank-data.js "$RUNNER_TEMP/reviewed-answer-bank-data.js"
          test "$(git -C reviewed-bank rev-parse HEAD:ask.html)" = adda66de747f1b4c8b16d65c5b2b3e7e9f27fd25
          echo '43a54294e85eb9edeadf3c0eda858e5c844e82dd1a8d880f1f20ce6b09e3d404  reviewed-bank/ask.html' | sha256sum --check
          cp reviewed-bank/ask.html "$RUNNER_TEMP/reviewed-ask.html"
          test "$(git -C reviewed-bank rev-parse HEAD:pioneers.html)" = 431b7e376fa6f2af52172aece0d70454f9d2d2c1
          echo 'f61c62011297d72279af71e94eec500e797a8f179658f8d566c29ccb1de26ce6  reviewed-bank/pioneers.html' | sha256sum --check
          cp reviewed-bank/pioneers.html "$RUNNER_TEMP/reviewed-pioneers.html"
          test "$(git -C reviewed-bank rev-parse HEAD:site-search.js)" = 47a2bdd31c07c0a48423446c5b1208ae0198e0be
          echo 'd98c242ff4866ae1c04ae0e0aa47c5cec4e6acaab7ead94d6200308586f4beeb  reviewed-bank/site-search.js' | sha256sum --check
          cp reviewed-bank/site-search.js "$RUNNER_TEMP/reviewed-site-search.js"
          test "$(git -C reviewed-bank rev-parse HEAD:search.html)" = 20fa1d268d70108b87bbd1c892617c944bc20262
          echo 'f0d1d0f3b4478b4ac77684b2c797cf1804f25fea2aad27643c0d0baec7a239b9  reviewed-bank/search.html' | sha256sum --check
          cp reviewed-bank/search.html "$RUNNER_TEMP/reviewed-search.html"
          test "$(git -C reviewed-bank rev-parse HEAD:tools/site_search_qa.py)" = 6b7e340afef21af36ed1065e9bc5d34a7d55d201
          echo 'fa5e56574d691998a18cc5682864dfff644e307b6005d77e4352f1707d54473d  reviewed-bank/tools/site_search_qa.py' | sha256sum --check
          cp reviewed-bank/tools/site_search_qa.py "$RUNNER_TEMP/reviewed-tools_site_search_qa.py"
          test "$(git -C reviewed-bank rev-parse HEAD:tools/site_search_runtime_qa.js)" = 9c4217b787dc82dc774c1ddb62773d60f278a88c
          echo '4c0c64456c6814dba1dfdfd787896d6d25d8f4b1a5d66418d5a136dd49958e82  reviewed-bank/tools/site_search_runtime_qa.js' | sha256sum --check
          cp reviewed-bank/tools/site_search_runtime_qa.js "$RUNNER_TEMP/reviewed-tools_site_search_runtime_qa.js"
      - name: Check out last published source
        uses: actions/checkout@v5
        with:
          ref: 722b5b792575fc352a368496d5120bd23c4db70f
          path: published-source
          submodules: false
          fetch-depth: 1
      - name: Verify published base, overlay, and focused checks
        shell: bash
        working-directory: published-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 722b5b792575fc352a368496d5120bd23c4db70f
          test "$(git rev-parse 'HEAD^{tree}')" = 3e6fce81a2c4ea23cdbc3e113ea064f99c25ba4d
          test "$(git rev-parse HEAD:answer-bank-matcher.js)" = d5908cb51cd6476b867f437393345998dc0b2d01
          test "$(git rev-parse HEAD:answer-bank-guards.js)" = 30a9ece3774143106b01a352836d02ccb3c24569
          test "$(git rev-parse HEAD:site-common.js)" = a335ffa999db24984d53f5052efce4b6b92dfc14
          test "$(git rev-parse HEAD:reviewed-ask-knowledge.js)" = 15783ef23f25961f31a4d9f26d3850011e815220
          test ! -L answer-bank-data.js
          cp "$RUNNER_TEMP/reviewed-answer-bank-data.js" answer-bank-data.js
          test ! -L ask.html
          cp "$RUNNER_TEMP/reviewed-ask.html" ask.html
          test ! -L pioneers.html
          cp "$RUNNER_TEMP/reviewed-pioneers.html" pioneers.html
          test ! -L site-search.js
          cp "$RUNNER_TEMP/reviewed-site-search.js" site-search.js
          test ! -L search.html
          cp "$RUNNER_TEMP/reviewed-search.html" search.html
          test ! -L tools/site_search_qa.py
          cp "$RUNNER_TEMP/reviewed-tools_site_search_qa.py" tools/site_search_qa.py
          test ! -L tools/site_search_runtime_qa.js
          cp "$RUNNER_TEMP/reviewed-tools_site_search_runtime_qa.js" tools/site_search_runtime_qa.js
          node --check answer-bank-data.js
          node -e 'const fs=require("fs"),vm=require("vm"),crypto=require("crypto");const c={window:{}};vm.runInNewContext(fs.readFileSync("answer-bank-data.js","utf8"),c);const b=c.window.FocusChristAnswerBankData;const sha=p=>crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex");if(!b||!Array.isArray(b.records)||b.records.length!==665||b.header.dataset.records!==665||sha("answer-bank-matcher.js")!==b.header.matcher.sha256||sha("reviewed-ask-knowledge.js")!==b.header.legacy_source.sha256)throw Error("answer bank or runtime binding mismatch");console.log("PASS: 665 reviewed records and runtime hash bindings")'
          node --check site-search.js
          node tools/reviewed_ask_knowledge_qa.js
          npm install --prefix "$RUNNER_TEMP/focuschrist-search-qa" --no-save --package-lock=false --ignore-scripts jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/focuschrist-search-qa/node_modules" node tools/site_search_runtime_qa.js
          python tools/build_watch_shorts.py --check
          python tools/build_site_search.py
          python tools/build_site_search.py --check
          sha256sum --check <<'HASHES'
          21d18d0799174e43e4853b69d8dc60f016f697985ea2b3d412a62963b048b8c2  answer-bank-data.js
          43a54294e85eb9edeadf3c0eda858e5c844e82dd1a8d880f1f20ce6b09e3d404  ask.html
          f61c62011297d72279af71e94eec500e797a8f179658f8d566c29ccb1de26ce6  pioneers.html
          d98c242ff4866ae1c04ae0e0aa47c5cec4e6acaab7ead94d6200308586f4beeb  site-search.js
          f0d1d0f3b4478b4ac77684b2c797cf1804f25fea2aad27643c0d0baec7a239b9  search.html
          fa5e56574d691998a18cc5682864dfff644e307b6005d77e4352f1707d54473d  tools/site_search_qa.py
          4c0c64456c6814dba1dfdfd787896d6d25d8f4b1a5d66418d5a136dd49958e82  tools/site_search_runtime_qa.js
          ca11d19f5cad12c2478ae875dc056e4e5247aac5e3bfde176a4aaf2472397e3b  watch.html
          13f5ea644b1781af325aee4f0344e83e614b3fd6d1e03fe4eb5e26d25db5b664  docs/watch-shorts.json
          b9b8a71893d3389ab9f12ed70c260e410d8fce3a74cbd85c6ddc180a9be7fc3a  site-search-index.json
          8eeaff370d942f18598b921f7577298d2b3751d124c2f67e6879000bd16f6ee6  assets/shorts/please-choose-to-stay-wilcox-20261031.png
          HASHES
          echo 'Scoped nursery/search release: published source 722b5b7 plus seven exact reviewed files; 665 bank records, 636 discoverable questions, and unchanged Watch/static search index. Production DOM search checks passed. Whole-site global QA, rendered browser acceptance, and whole-artifact comparison are not claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm current main before upload
        run: test "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: published-source
      - name: Confirm current main before deployment
        run: test "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
