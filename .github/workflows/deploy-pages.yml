name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Run focusChrist structural site QA
        run: python tools/site_qa.py

      - name: Run focusChrist unified experience QA
        run: python tools/unified_experience_qa.py

      - name: Validate Ask experience JavaScript
        run: node --check ask-experience.js

      - name: Validate Pioneer experience JavaScript
        run: node --check pioneer-experience.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
