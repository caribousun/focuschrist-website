name: Publish reviewed answer bank 640 once
on:
  push:
    branches:
      - albert/answer-bank-640-20261112-deploy
permissions:
  pages: write
  id-token: write
  contents: read
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 324894b6656ae3d05e86d046c3bdef805ccacae0
      EXPECTED_WORKFLOW_SHA256: 'fde6a169dca00cc9391b49889abb7fa21e52dc5c410a1ca5b64c94ef6e7272d6'
    steps:
      - name: Check out one-release workflow
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 2
          sparse-checkout: .github/workflows/deploy-pages.yml
          sparse-checkout-cone-mode: false
      - name: Verify workflow and expected parent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/albert/answer-bank-640-20261112-deploy
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA 722b5b792575fc352a368496d5120bd23c4db70f"
          test "$(git diff-tree --no-commit-id --name-only -r 722b5b792575fc352a368496d5120bd23c4db70f HEAD)" = .github/workflows/deploy-pages.yml
          python -c "import hashlib,os,re,pathlib; p=pathlib.Path('.github/workflows/deploy-pages.yml').read_bytes(); x,n=re.subn(rb'(?m)^(      EXPECTED_WORKFLOW_SHA256: .)[0-9a-f]{64}(.).?$', lambda m:m.group(1)+b'0'*64+m.group(2), p); assert n==1 and hashlib.sha256(x).hexdigest()==os.environ['EXPECTED_WORKFLOW_SHA256'], 'workflow identity differs'"
          test "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
      - name: Check out only reviewed answer-bank file
        uses: actions/checkout@v5
        with:
          ref: 324894b6656ae3d05e86d046c3bdef805ccacae0
          path: reviewed-bank
          submodules: false
          fetch-depth: 1
          sparse-checkout: |
            answer-bank-data.js
            ask.html
            pioneers.html
          sparse-checkout-cone-mode: false
      - name: Verify and preserve reviewed bank
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C reviewed-bank rev-parse HEAD)" = 324894b6656ae3d05e86d046c3bdef805ccacae0
          test "$(git -C reviewed-bank rev-parse HEAD:answer-bank-data.js)" = 4fa54decf2779b470652692dc328454c23c933f2
          echo 'ecd954e989b9e9acfa16ca00f43bf3b2a730f9ff0ffd0e641b8578df4ec242be  reviewed-bank/answer-bank-data.js' | sha256sum --check
          test "$(git -C reviewed-bank rev-parse HEAD:ask.html)" = 13c41a9ae39ed1205a83ff4a1e293b0ed0762743
          test "$(git -C reviewed-bank rev-parse HEAD:pioneers.html)" = 4fd1a2e2b3b4113554246d90841517bcd2623f26
          cp reviewed-bank/answer-bank-data.js "$RUNNER_TEMP/reviewed-answer-bank-data.js"
          cp reviewed-bank/ask.html "$RUNNER_TEMP/reviewed-ask.html"
          cp reviewed-bank/pioneers.html "$RUNNER_TEMP/reviewed-pioneers.html"
      - name: Check out last published source
        uses: actions/checkout@v5
        with:
          ref: 722b5b792575fc352a368496d5120bd23c4db70f
          path: published-source
          submodules: false
          fetch-depth: 1
      - name: Verify published base, overlay, and focused checks
        shell: bash
        working-directory: published-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 722b5b792575fc352a368496d5120bd23c4db70f
          test "$(git rev-parse 'HEAD^{tree}')" = 3e6fce81a2c4ea23cdbc3e113ea064f99c25ba4d
          test "$(git rev-parse HEAD:answer-bank-matcher.js)" = d5908cb51cd6476b867f437393345998dc0b2d01
          test "$(git rev-parse HEAD:answer-bank-guards.js)" = 30a9ece3774143106b01a352836d02ccb3c24569
          test "$(git rev-parse HEAD:site-common.js)" = a335ffa999db24984d53f5052efce4b6b92dfc14
          test "$(git rev-parse HEAD:reviewed-ask-knowledge.js)" = 15783ef23f25961f31a4d9f26d3850011e815220
          test ! -L answer-bank-data.js
          cp "$RUNNER_TEMP/reviewed-answer-bank-data.js" answer-bank-data.js
          cp "$RUNNER_TEMP/reviewed-ask.html" ask.html
          cp "$RUNNER_TEMP/reviewed-pioneers.html" pioneers.html
          node --check answer-bank-data.js
          node -e 'const fs=require("fs"),vm=require("vm"),crypto=require("crypto");const c={window:{}};vm.runInNewContext(fs.readFileSync("answer-bank-data.js","utf8"),c);const b=c.window.FocusChristAnswerBankData;const sha=p=>crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex");if(!b||!Array.isArray(b.records)||b.records.length!==640||b.header.dataset.records!==640||sha("answer-bank-matcher.js")!==b.header.matcher.sha256||sha("reviewed-ask-knowledge.js")!==b.header.legacy_source.sha256)throw Error("answer bank or runtime binding mismatch");console.log("PASS: 640 reviewed records and runtime hash bindings")'
          node tools/reviewed_ask_knowledge_qa.js
          python tools/build_watch_shorts.py --check
          python tools/build_site_search.py
          python tools/build_site_search.py --check
          sha256sum --check <<'HASHES'
          ecd954e989b9e9acfa16ca00f43bf3b2a730f9ff0ffd0e641b8578df4ec242be  answer-bank-data.js
          29349453e3db9f417ea392c5992059249f181096430510600ea544dc932e0bc6  ask.html
          94b39530ca87ce7a2c7120255fc4e1fb5a8f920d61814f1c5613f55676b561e3  pioneers.html
          ca11d19f5cad12c2478ae875dc056e4e5247aac5e3bfde176a4aaf2472397e3b  watch.html
          13f5ea644b1781af325aee4f0344e83e614b3fd6d1e03fe4eb5e26d25db5b664  docs/watch-shorts.json
          b9b8a71893d3389ab9f12ed70c260e410d8fce3a74cbd85c6ddc180a9be7fc3a  site-search-index.json
          8eeaff370d942f18598b921f7577298d2b3751d124c2f67e6879000bd16f6ee6  assets/shorts/please-choose-to-stay-wilcox-20261031.png
          HASHES
          echo 'Scoped answer-bank cache release: published source 722b5b7 plus exact reviewed bank and two cache-version pages. Whole-site global QA and whole-artifact comparison are not claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm current main before upload
        run: test "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: published-source
      - name: Confirm current main before deployment
        run: test "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
