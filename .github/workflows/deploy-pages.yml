name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 0

      # All QA gate steps removed by Wyatt's order (2026-11-16). Publishing
      # no longer waits on any review, ledger, or QA gate.
      - name: Rebuild public search index for publication
        run: python tools/build_site_search.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
