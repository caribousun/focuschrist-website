name: Temporary AI final hardening v2

on:
  push:
    branches:
      - codex/ai-final-hardening-20260903
    paths:
      - ".github/workflows/temp-ai-final-hardening-v2.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ai-final-hardening-20260903
          fetch-depth: 0
      - name: Apply hardening patch
        run: |
          python tools/temp_ai_hardening_patch.py
          python tools/temp_ai_hardening_test_patch.py
      - name: Verify release
        run: |
          node groq-proxy/source-policy.test.js
          node groq-proxy/church-source-index.test.js
          python tools/build_church_source_index.py --check
          python tools/site_qa.py
          python tools/unified_experience_qa.py
          python tools/resource_qa.py
          python tools/study_intelligence_qa.py
          python tools/hardened_experience_qa.py
          python tools/pioneer_local_first_qa.py
          python tools/production_hardening_qa.py
          python tools/church_history_qa.py
          python tools/scripture_grounding_qa.py
          python tools/source_integrity_inventory.py
          python tools/static_content_audit.py
          node tools/source_integrity_runtime_qa.js
          node tools/reviewed_ask_knowledge_qa.js
          node tools/pioneer_ask_runtime_qa.js
          node tools/church_history_ask_runtime_qa.js
          node tools/study_intelligence_v3_runtime_qa.js
          node tools/question_safety_runtime_qa.js
          node --check groq-proxy/src/index.js
          node --check tools/live_ai_response_matrix.js
      - name: Commit verified hardening
        run: |
          git config user.name "focusChrist AI hardening"
          git config user.email "actions@users.noreply.github.com"
          git add MEMORY.md groq-proxy/src/index.js groq-proxy/source-policy.test.js groq-proxy/church-source-index.test.js tools/live_ai_response_matrix.js tools/pioneer_local_first_qa.py tools/scripture_grounding_qa.py
          git commit -m "Harden Ask verifier reliability"
          git push origin HEAD:codex/ai-final-hardening-20260903
