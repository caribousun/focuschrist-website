name: Ask Hero Update

on:
  push:
    paths:
      - '.github/workflows/ask-hero-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install approved Ask hero
        shell: bash
        run: |
          cat <<'B64' | base64 --decode > ask-hero.webp
