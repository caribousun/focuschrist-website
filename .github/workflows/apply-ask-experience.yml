name: Apply FocusChrist Ask Experience

on:
  push:
    branches:
      - focus/ask-experience-redesign
    paths:
      - '.github/workflows/apply-ask-experience.yml'
      - 'tools/apply_ask_experience.py'
      - 'ask-experience.css'
      - 'ask-experience.js'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Ask experience migration
        run: python tools/apply_ask_experience.py
      - name: Run permanent FocusChrist QA
        run: python tools/site_qa.py
      - name: Commit migrated Ask experience
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ask.html tools/site_qa.py
          git commit -m "Redesign Ask as guided spiritual study experience"
          git push
