name: Apply FocusChrist robustness phase 1

on:
  push:
    branches:
      - focus/robustness-phase1
    paths:
      - '.github/workflows/apply-robustness-phase1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply controlled robustness update
        run: python tools/apply-robustness-phase1.py

      - name: Commit updated site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ask.html art.html pioneers.html about.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Harden FocusChrist core site behavior"
          git push
