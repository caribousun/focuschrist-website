name: Build FocusChrist Art thumbnails

on:
  push:
    branches:
      - focus/robustness-phase2
    paths:
      - '.github/workflows/build-art-thumbnails.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build gallery thumbnails
        run: python tools/build-art-thumbnails.py

      - name: Run FocusChrist site QA
        run: python tools/site_qa.py

      - name: Commit thumbnail optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art.html art/thumbs/
          if git diff --cached --quiet; then
            echo "No thumbnail changes produced"
            exit 1
          fi
          git commit -m "Optimize Art gallery with lightweight thumbnails"
          git push
