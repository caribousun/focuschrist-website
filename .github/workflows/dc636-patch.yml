name: "DC636 centerpiece patch"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dc636-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch page and reviewed ledger
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, importlib.util
          page = Path('answers/look-unto-me-doctrine-and-covenants-6-36.html')
          text = page.read_text(encoding='utf-8')
          text = text.replace('<link rel="stylesheet" href="../answer-styles.css">', '<link rel="stylesheet" href="../answer-styles.css"><link rel="stylesheet" href="../dc636-study.css?v=20260906-1">')
          text = text.replace('<body class="fc-site">', '<body class="fc-site fc-dc636-page">')
          old = '<section id="watch"><p class="fc-eyebrow">Watch and continue studying</p><h2>Official Church Media and Study Paths</h2><div class="fc-grid fc-grid--2"><article class="fc-card"><h3 class="fc-card-title"><a href="https://www.churchofjesuschrist.org/media/video/2018-03-1000-days-of-harmony?lang=eng" target="_blank" rel="noopener noreferrer">Days of Harmony</a></h3><p>Use this Church video to place Joseph Smith, Oliver Cowdery, Harmony, and the translation work into a visual historical setting.</p></article><article class="fc-card"><h3 class="fc-card-title"><a href="https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-book-of-mormon-2024/10?lang=eng" target="_blank" rel="noopener noreferrer">“We Rejoice in Christ” Come, Follow Me</a></h3><p>This official lesson gathers 2 Nephi 20-25 around Christ, testimony, Isaiah, joy, and speaking more openly of the Savior.</p></article><article class="fc-card"><h3 class="fc-card-title"><a href="https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-new-testament-2027/41?lang=eng" target="_blank" rel="noopener noreferrer">Philippians and Colossians: 2027 Come, Follow Me</a></h3><p>Study Paul\'s joy and confidence in Christ, including Philippians 4 and “I can do all things through Christ.”</p></article><article class="fc-card"><h3 class="fc-card-title"><a href="https://www.churchofjesuschrist.org/study/new-era/2014/12/rejoice-in-christ?lang=eng" target="_blank" rel="noopener noreferrer">Rejoice in Christ</a></h3><p>Read prophetic and apostolic testimonies centered directly on Jesus Christ, His Redemption, and His Resurrection.</p></article></div></section>'
          new = '''<section id="watch"><p class="fc-eyebrow">Watch, see, and continue studying</p><h2>Official Church Media: Keep Looking to Christ</h2><p>Use these visual and video paths as part of the study, not as decoration. Each one opens an official Church resource that extends the invitation to center attention, confidence, remembrance, and joy in Jesus Christ.</p><div class="fc-media-library">
<a class="fc-media-card" href="https://www.churchofjesuschrist.org/media/video/2025-06-look-unto-christ?lang=eng" target="_blank" rel="noopener noreferrer"><div class="fc-media-card__media"><img src="https://www.churchofjesuschrist.org/imgs/k1rz6ejij35ipafv59vncxvj343v4gbevwb3qkm6/full/%21320%2C/0/default" alt="Look Unto Christ official Church video thumbnail" loading="lazy"><span class="fc-media-card__play" aria-hidden="true">▶</span><span class="fc-media-card__badge">Official video</span></div><div class="fc-media-card__body"><h3>Look Unto Christ</h3><p>A direct visual companion to Doctrine and Covenants 6:36 and the Church's invitation to look to the Savior.</p></div></a>
<a class="fc-media-card" href="https://www.churchofjesuschrist.org/media/video/2018-03-1000-days-of-harmony?lang=eng" target="_blank" rel="noopener noreferrer"><div class="fc-media-card__media"><img src="https://www.churchofjesuschrist.org/imgs/7fc7a82f77be9711408c1658e5e8938738edd7ed/full/%21320%2C/0/default" alt="Days of Harmony official Church video thumbnail" loading="lazy"><span class="fc-media-card__play" aria-hidden="true">▶</span><span class="fc-media-card__badge">Church history video</span></div><div class="fc-media-card__body"><h3>Days of Harmony</h3><p>See Oliver Cowdery's experience as Joseph Smith's scribe and place Doctrine and Covenants 6 in its historical setting.</p></div></a>
<a class="fc-media-card" href="https://www.churchofjesuschrist.org/media/video/2022-10-1020-dieter-f-uchtdorf?lang=eng" target="_blank" rel="noopener noreferrer"><div class="fc-media-card__media"><img src="https://www.churchofjesuschrist.org/imgs/34b569eb41af11ed8e33eeeeac1ecf6724142267/full/%21320%2C/0/default" alt="Jesus Christ Is the Strength of Youth official Church video thumbnail" loading="lazy"><span class="fc-media-card__play" aria-hidden="true">▶</span><span class="fc-media-card__badge">General Conference</span></div><div class="fc-media-card__body"><h3>Jesus Christ Is the Strength of Youth</h3><p>Elder Dieter F. Uchtdorf teaches that Jesus Christ is the best guide for making choices and explicitly draws on Doctrine and Covenants 6:36.</p></div></a>
<a class="fc-media-card" href="https://www.churchofjesuschrist.org/media/video/2025-10-look-unto-christ-worldwide-event-for-youth?lang=eng" target="_blank" rel="noopener noreferrer"><div class="fc-media-card__media"><img src="../assets/heroes/home.webp" alt="Jesus Christ artwork for the Look Unto Christ worldwide youth event study link" loading="lazy"><span class="fc-media-card__play" aria-hidden="true">▶</span><span class="fc-media-card__badge">Worldwide youth event</span></div><div class="fc-media-card__body"><h3>Look Unto Christ: Worldwide Event for Youth</h3><p>Continue through a worldwide youth broadcast inviting disciples to reflect on what it means to look unto Christ.</p></div></a>
</div></section>'''
          if old not in text:
              raise SystemExit('Watch section signature not found')
          text = text.replace(old, new)
          marker = '<section class="fc-deep-study" id="rejoice" data-connected-study><p class="fc-eyebrow">2027 Church theme connection</p>'
          visual = '''<section class="fc-deep-study" aria-labelledby="visual-witness"><p class="fc-eyebrow">See the theme in Church media</p><h2 id="visual-witness">Look to Christ. Rejoice in Christ.</h2><div class="fc-resource-gallery"><a class="fc-resource-visual" href="https://www.churchofjesuschrist.org/media/image/mormonad-big-picture-jesus-christ-edca63e?lang=eng" target="_blank" rel="noopener noreferrer"><img src="https://www.churchofjesuschrist.org/imgs/449ddc4ca1547ac2357e01aab9d0b7ff86f63887/full/%2C500/0/default" alt="Official Church scripture picture quote related to looking to Jesus Christ" loading="lazy"><span><h3>Look unto Him</h3><p>Open an official Church media image centered on Doctrine and Covenants 6:36 and the invitation to look to the Savior.</p></span></a><a class="fc-resource-visual" href="https://www.churchofjesuschrist.org/media/image/meme-2-nephi-christ-449ddc4?lang=eng" target="_blank" rel="noopener noreferrer"><img src="https://www.churchofjesuschrist.org/imgs/449ddc4ca1547ac2357e01aab9d0b7ff86f63887/full/%2C500/0/default" alt="We talk of Christ and rejoice in Christ official Church picture quote" loading="lazy"><span><h3>We rejoice in Christ</h3><p>See the Church's visual rendering of 2 Nephi 25:26, a central companion scripture for this study.</p></span></a></div></section>'''
          if 'id="visual-witness"' not in text:
              text = text.replace(marker, visual + marker)
          page.write_text(text, encoding='utf-8')

          spec = importlib.util.spec_from_file_location('audit', Path('tools/static_content_audit.py'))
          audit = importlib.util.module_from_spec(spec); spec.loader.exec_module(audit)
          h = audit.content_hash(page)
          lp = Path('content-audit.json'); ledger = json.loads(lp.read_text(encoding='utf-8'))
          rec = next(r for r in ledger['documents'] if r.get('path') == 'answers/look-unto-me-doctrine-and-covenants-6-36.html')
          rec['published_text_sha256'] = h
          rec['reviewed_on'] = '2026-09-06'
          rec['review_standard'] = 'Signature centerpiece enrichment review: D&C 6:36 historical and scriptural context, visual Look Unto Christ and Rejoice in Christ pathways, official Church video destinations and thumbnails, Philippians and Book of Mormon cross-references, accessibility, responsive layout, and source integrity checked against authoritative Church resources.'
          for u in [
            'https://www.churchofjesuschrist.org/media/video/2025-06-look-unto-christ?lang=eng',
            'https://www.churchofjesuschrist.org/media/video/2018-03-1000-days-of-harmony?lang=eng',
            'https://www.churchofjesuschrist.org/media/video/2022-10-1020-dieter-f-uchtdorf?lang=eng',
            'https://www.churchofjesuschrist.org/media/video/2025-10-look-unto-christ-worldwide-event-for-youth?lang=eng',
            'https://www.churchofjesuschrist.org/media/image/meme-2-nephi-christ-449ddc4?lang=eng',
            'https://www.churchofjesuschrist.org/media/image/mormonad-big-picture-jesus-christ-edca63e?lang=eng']:
              if u not in rec['authoritative_sources']: rec['authoritative_sources'].append(u)
          lp.write_text(json.dumps(ledger, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          PY
          python tools/static_content_audit.py
          python tools/site_qa.py
          python tools/unified_experience_qa.py
          python tools/connected_study_qa.py
          git config user.name 'focusChrist QA'
          git config user.email 'actions@users.noreply.github.com'
          git add answers/look-unto-me-doctrine-and-covenants-6-36.html content-audit.json
          git commit -m 'Build D&C 6:36 into a visual Christ-centered study centerpiece'
          git push
