name: Focus production hardening run

on:
  push:
    branches:
      - focus-production-sanity-20260830
    paths:
      - .github/workflows/focus-production-hardening-run.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardened branch
        uses: actions/checkout@v4
        with:
          ref: focus-production-sanity-20260830
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Restore tested hardening applicator
        run: |
          base64 -d tools/.production_hardening_apply.py.gz.b64 | gzip -d > tools/_production_apply.py

      - name: Apply presentation hardening
        run: python tools/_production_apply.py

      - name: Run complete production QA stack
        run: |
          python tools/site_qa.py
          python tools/unified_experience_qa.py
          python tools/resource_qa.py
          python tools/study_intelligence_qa.py
          python tools/hardened_experience_qa.py
          python tools/church_history_qa.py
          python tools/production_hardening_qa.py

      - name: Validate production JavaScript
        run: |
          node --check site-common.js
          node --check study-intelligence.js
          node --check study-intelligence-v2.js
          node --check study-intelligence-v3.js
          node --check study-journey.js
          node --check study-source-router.js
          node --check church-history-experience.js
          node --check art-study-router.js
          node --check watch-study-enrichment.js
          node --check watch-experience.js
          node --check ask-experience.js
          node --check art-ask-context.js
          node --check pioneer-experience.js

      - name: Remove one-time build machinery and commit hardened release candidate
        run: |
          rm -f tools/_production_apply.py tools/.production_hardening_apply.py.gz.b64
          rm -f .github/workflows/focus-production-asset-localization.yml
          rm -f .github/workflows/focus-production-hardening-run.yml
          git config user.name "focusChrist production bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden focusChrist production presentation and study continuity"
          git push origin HEAD:focus-production-sanity-20260830
