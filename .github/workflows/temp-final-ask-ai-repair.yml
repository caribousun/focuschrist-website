name: Temporary final Ask AI repair

on:
  push:
    branches:
      - codex/final-ai-completion-20260903
    paths:
      - ".github/workflows/temp-final-ask-ai-repair.yml"

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/final-ai-completion-20260903
          fetch-depth: 0

      - name: Apply provider and reviewed-knowledge repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_required(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} occurrences of {old!r}, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: replaced {count} occurrence(s)')

          registry = Path('reviewed-ask-knowledge.js')
          text = registry.read_text(encoding='utf-8')
          if "const POLICY_VERSION = '2026-09-03.16';" not in text:
              raise SystemExit('reviewed knowledge policy baseline changed unexpectedly')
          text = text.replace("const POLICY_VERSION = '2026-09-03.16';", "const POLICY_VERSION = '2026-09-03.17';", 1)
          text = text.replace("profiles: ['pioneers', 'church-history'],", "profiles: ['ask', 'pioneers', 'church-history'],")
          text = text.replace("profiles: ['church-history'],", "profiles: ['ask', 'church-history'],")
          if "'Tell me about First Vision'," not in text:
              needle = "                'Tell me about the First Vision',\n"
              if needle not in text:
                  raise SystemExit('First Vision reviewed positive-test anchor not found')
              text = text.replace(needle, needle + "                'Tell me about First Vision',\n", 1)
          registry.write_text(text, encoding='utf-8')

          replace_required('tools/reviewed_ask_knowledge_qa.js',
              "registry && registry.policyVersion === '2026-09-03.16'",
              "registry && registry.policyVersion === '2026-09-03.17'")
          replace_required('ask-question-contracts.json',
              '"release": "2026-09-03.16"',
              '"release": "2026-09-03.17"')

          qa = Path('tools/reviewed_ask_knowledge_qa.js')
          qtext = qa.read_text(encoding='utf-8')
          anchor = "const handcart = registry.match('What year did the handcarts begin?', { profile: 'pioneers' });\n"
          if anchor not in qtext:
              raise SystemExit('reviewed Ask QA handcart anchor not found')
          owner_regression = """const ownerFirstVision = registry.match('Tell me about First Vision', { profile: 'ask' });
          assert(ownerFirstVision && ownerFirstVision.id === 'church-first-vision-1820'
              && ownerFirstVision.mode === 'reviewed-local' && ownerFirstVision.sourceIntegrityPassed === true
              && ownerFirstVision.sources.every((source) => source.url.includes('churchofjesuschrist.org')),
              'owner First Vision regression must resolve on Main Ask from reviewed official Church sources with zero provider dependency');
          registry.entries.filter((entry) => entry.profiles.includes('church-history')).forEach((entry) => {
              assert(entry.profiles.includes('ask'), 'reviewed Church History knowledge must also be available to Main Ask: ' + entry.id);
          });
          registry.entries.filter((entry) => entry.profiles.includes('pioneers')).forEach((entry) => {
              assert(entry.profiles.includes('ask'), 'reviewed Pioneer knowledge must also be available to Main Ask: ' + entry.id);
          });

          """
          if 'owner First Vision regression must resolve on Main Ask' not in qtext:
              qtext = qtext.replace(anchor, owner_regression + anchor, 1)
          qa.write_text(qtext, encoding='utf-8')

          for p in Path('.').rglob('*.html'):
              html = p.read_text(encoding='utf-8')
              if 'reviewed-ask-knowledge.js?v=20260903-16' in html:
                  p.write_text(html.replace('reviewed-ask-knowledge.js?v=20260903-16',
                                            'reviewed-ask-knowledge.js?v=20260903-17'), encoding='utf-8')

          worker = Path('groq-proxy/src/index.js')
          w = worker.read_text(encoding='utf-8')
          required = [
              "const VERIFIER_MODEL = 'openai/gpt-oss-20b';",
              "const SOURCE_POLICY_VERSION = '2026-09-03.34';",
              "const OFFICIAL_EXCERPT_CACHE_VERSION = '2026-09-03.34';",
              "  const groqFallbackBody = { ...plainJsonBody, model: VERIFIER_MODEL };\n",
          ]
          for needle in required:
              if needle not in w:
                  raise SystemExit('Worker baseline anchor missing: ' + needle)
          w = w.replace("const VERIFIER_MODEL = 'openai/gpt-oss-20b';", "const VERIFIER_MODEL = 'groq/compound-mini';", 1)
          w = w.replace("const SOURCE_POLICY_VERSION = '2026-09-03.34';", "const SOURCE_POLICY_VERSION = '2026-09-03.35';", 1)
          w = w.replace("const OFFICIAL_EXCERPT_CACHE_VERSION = '2026-09-03.34';", "const OFFICIAL_EXCERPT_CACHE_VERSION = '2026-09-03.35';", 1)
          verifier_anchor = "  const groqFallbackBody = { ...plainJsonBody, model: VERIFIER_MODEL };\n"
          groq_primary = verifier_anchor + """  if (String(env && env.VERIFIER_PROVIDER || '').toLowerCase() === 'groq') {
              const primary = validateGroqVerifierResult(
                await callGroq(env && env.GROQ_KEY_NEW, groqFallbackBody, deadline, false),
                requireSourceIndexes,
              );
              return {
                ...primary,
                verifierRoute: 'groq-primary',
                fallbackReason: primary.response && primary.response.ok ? null : 'groq-primary-error',
                totalCloudflareVerifierCalls: 0,
                totalCloudflareEstimatedNeurons: 0,
                totalCloudflareUnmeteredNeurons: 0,
                totalGroqVerifierCalls: Number(primary.callCount || 1),
                verifierDurationMs: Date.now() - started,
              };
            }
          """
          w = w.replace(verifier_anchor, groq_primary, 1)
          worker.write_text(w, encoding='utf-8')

          wrangler = Path('groq-proxy/wrangler.toml')
          wt = wrangler.read_text(encoding='utf-8')
          if 'VERIFIER_PROVIDER' not in wt:
              wt = wt.replace('compatibility_date = "2024-01-01"\n\n',
                              'compatibility_date = "2024-01-01"\n\n[vars]\nVERIFIER_PROVIDER = "groq"\n\n', 1)
          wrangler.write_text(wt, encoding='utf-8')

          matrix = Path('tools/live_ai_response_matrix.js')
          mt = matrix.read_text(encoding='utf-8')
          if "const POLICY_VERSION = '2026-09-03.34';" not in mt:
              raise SystemExit('live matrix policy baseline changed unexpectedly')
          mt = mt.replace("const POLICY_VERSION = '2026-09-03.34';", "const POLICY_VERSION = '2026-09-03.35';", 1)
          mt = mt.replace("['cloudflare-primary', 'cloudflare-fast-fallback', 'groq-fallback'].includes(result.verifierRoute)",
                          "['groq-primary', 'cloudflare-primary', 'cloudflare-fast-fallback', 'groq-fallback'].includes(result.verifierRoute)")
          matrix.write_text(mt, encoding='utf-8')

          policy_test = Path('groq-proxy/source-policy.test.js')
          pt = policy_test.read_text(encoding='utf-8')
          pt = pt.replace("focuschrist_source_policy === '2026-09-03.34'", "focuschrist_source_policy === '2026-09-03.35'")
          test_anchor = "const verifierFetchBeforeTests = globalThis.fetch;\n"
          if test_anchor not in pt:
              raise SystemExit('source policy verifier test anchor not found')
          groq_test = """const verifierFetchBeforeGroqPrimary = globalThis.fetch;
          let directGroqVerifierCalls = 0;
          globalThis.fetch = async (_url, init) => {
            directGroqVerifierCalls += 1;
            const requestBody = JSON.parse(init.body);
            assert(requestBody.model === 'groq/compound-mini', 'production Groq verifier must use Compound Mini');
            return new Response(JSON.stringify({
              choices: [{ message: { content: '{\"approved\":true,\"answer\":\"Supported answer.\",\"source_indexes\":[1]}' } }],
              usage: { prompt_tokens: 200, completion_tokens: 30 },
            }), { status: 200, headers: { 'Content-Type': 'application/json' } });
          };
          const directGroqVerifierResult = await callVerifier({
            GROQ_KEY_NEW: 'test-key',
            VERIFIER_PROVIDER: 'groq',
            AI: { run: async () => { throw new Error('production Groq-primary route must not call Cloudflare'); } },
          }, verifierBodyForTest, Date.now() + 12000, { requireSourceIndexes: true });
          globalThis.fetch = verifierFetchBeforeGroqPrimary;
          assert(directGroqVerifierCalls === 1
            && directGroqVerifierResult.response.ok
            && directGroqVerifierResult.verifierRoute === 'groq-primary'
            && directGroqVerifierResult.totalCloudflareVerifierCalls === 0
            && directGroqVerifierResult.totalGroqVerifierCalls === 1,
            'production verifier route must use exactly one Groq Compound Mini call and zero Cloudflare calls');

          """
          if 'production verifier route must use exactly one Groq Compound Mini call' not in pt:
              pt = pt.replace(test_anchor, groq_test + test_anchor, 1)
          policy_test.write_text(pt, encoding='utf-8')

          memory = Path('MEMORY.md')
          mem = memory.read_text(encoding='utf-8')
          note = """

          ### Ask universal reviewed-knowledge + verifier-provider correction — candidate 2026-09-03.35

          - Owner reproduced Main Ask failure for `Tell me about First Vision`. The First Vision answer was already reviewed and source-pinned, but its profile was limited to Church History, so Main Ask unnecessarily entered the remote verifier lane.
          - Main Ask is now the universal superset for reviewed Pioneer and Church History knowledge. Reviewed matches remain profile-aware on their specialized pages, but any already-audited answer can resolve on Main Ask with zero provider dependency.
          - The post-reset production matrix proved Cloudflare verifier calls still fail with zero provider usage. This invalidates quota-reset waiting as the root fix. Production policy `.35` routes verification through the already-authorized Groq path using Compound Mini, while retaining strict evidence/source-index validation and zero Cloudflare verifier calls. The dormant Cloudflare adapter remains tested but is not the production verifier.
          - Production remains unverified until PR QA, deployment, the full live AI matrix, and the exact owner First Vision journey pass.
          """
          if 'Ask universal reviewed-knowledge + verifier-provider correction — candidate 2026-09-03.35' not in mem:
              memory.write_text(mem + note, encoding='utf-8')
          PY

          node - <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const vm = require('vm');
          global.window = {};
          vm.runInThisContext(fs.readFileSync('reviewed-ask-knowledge.js', 'utf8'), { filename: 'reviewed-ask-knowledge.js' });
          const registry = window.focusChristReviewedKnowledge;
          const audit = JSON.parse(fs.readFileSync('answer-audit.json', 'utf8'));
          function stable(value) {
            if (Array.isArray(value)) return value.map(stable);
            if (!value || typeof value !== 'object') return value;
            return Object.keys(value).sort().reduce((out, key) => { out[key] = stable(value[key]); return out; }, {});
          }
          function entryHash(entry) {
            return crypto.createHash('sha256').update(JSON.stringify(stable(entry))).digest('hex');
          }
          function sourceUrls(entry) {
            const sources = [].concat(entry.sources || []).concat(entry.followup && Array.isArray(entry.followup.variants)
              ? entry.followup.variants.flatMap((variant) => variant.sources || []) : []);
            return [...new Set(sources.map((source) => source.url))];
          }
          const byId = new Map(audit.reviewed_knowledge.map((record) => [record.id, record]));
          if (byId.size !== registry.entries.length) throw new Error('audit ledger count no longer matches reviewed registry');
          for (const entry of registry.entries) {
            const record = byId.get(entry.id);
            if (!record) throw new Error('missing audit record: ' + entry.id);
            record.entry_sha256 = entryHash(entry);
            record.authoritative_sources = sourceUrls(entry);
          }
          audit.reviewed_on = '2026-09-03';
          fs.writeFileSync('answer-audit.json', JSON.stringify(audit, null, 2) + '\n');
          NODE

      - name: Run full relevant local verification
        run: |
          node tools/reviewed_ask_knowledge_qa.js
          node tools/source_integrity_runtime_qa.js
          node tools/pioneer_ask_runtime_qa.js
          node tools/church_history_ask_runtime_qa.js
          node groq-proxy/source-policy.test.js
          node groq-proxy/church-source-index.test.js
          python tools/build_church_source_index.py --check
          python tools/site_qa.py
          python tools/unified_experience_qa.py
          python tools/pioneer_local_first_qa.py
          python tools/production_hardening_qa.py
          python tools/church_history_qa.py
          python tools/scripture_grounding_qa.py
          node --check groq-proxy/src/index.js
          node --check tools/live_ai_response_matrix.js

      - name: Commit verified repair to branch
        run: |
          git config user.name "focusChrist repair automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes produced"
            exit 1
          fi
          git commit -m "Repair Ask local coverage and verifier provider"
          git push origin HEAD:codex/final-ai-completion-20260903
