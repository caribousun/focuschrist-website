name: Finalize Specialized focusChrist Experiences

on:
  push:
    branches:
      - focus/unified-experience-phase1
    paths:
      - 'tools/finalize_specialized_experiences.py'
      - '.github/workflows/finalize-specialized-experiences.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire Art and Pioneer experiences
        run: python tools/finalize_specialized_experiences.py
      - name: Add Pioneer secondary-action styling
        shell: python
        run: |
          from pathlib import Path
          path = Path('pioneer-experience.css')
          text = path.read_text(encoding='utf-8')
          marker = 'body.fc-site .pioneer-extra-action'
          if marker not in text:
              text += '''\nbody.fc-site .pioneer-extra-action {\n    margin-top: 14px;\n    padding: 9px 16px;\n    border: 1px solid var(--fc-gold);\n    border-radius: 999px;\n    background: transparent;\n    color: var(--fc-gold-light);\n    font: inherit;\n    font-size: .82rem;\n    font-weight: 700;\n    cursor: pointer;\n}\nbody.fc-site .pioneer-extra-action:hover,\nbody.fc-site .pioneer-extra-action:focus-visible {\n    background: rgba(201,169,97,.10);\n    outline: none;\n}\n'''
          path.write_text(text, encoding='utf-8')
      - name: Validate JavaScript syntax
        run: |
          node --check pioneer-experience.js
          node --check ask-experience.js
      - name: Run permanent site QA
        run: python tools/site_qa.py
      - name: Commit specialized experience wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art.html pioneers.html pioneer-experience.css pioneer-experience.js art-experience.css
          git commit -m "Unify Art and Pioneer experiences"
          git push
