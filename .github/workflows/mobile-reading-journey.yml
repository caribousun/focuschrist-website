name: Mobile reading journey presentation
on:
  pull_request:
    branches: [main]
    paths:
      - 'answers/what-happens-after-death.html'
      - 'tools/mobile_reading_journey_browser_qa.js'
      - '.github/workflows/mobile-reading-journey.yml'
  push:
    branches: [main]
    paths:
      - 'answers/what-happens-after-death.html'
      - 'tools/mobile_reading_journey_browser_qa.js'
      - '.github/workflows/mobile-reading-journey.yml'
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install browser
        run: |
          npm install --prefix /tmp/mobile-journey-qa --no-save --package-lock=false --ignore-scripts playwright@1.55.1
          /tmp/mobile-journey-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Inspect phone, desktop, enlarged text and navigation
        run: NODE_PATH=/tmp/mobile-journey-qa/node_modules node tools/mobile_reading_journey_browser_qa.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-reading-journey-render
          path: .qa-artifacts/mobile-reading-journey/
          include-hidden-files: true
          if-no-files-found: error
