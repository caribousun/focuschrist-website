name: Ask Hero Cache Bust

on:
  push:
    paths:
      - '.github/workflows/ask-hero-cache-bust.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish corrected Ask hero crop with fresh stylesheet version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('ask.html')
          text = page.read_text(encoding='utf-8')
          old = 'ask-hero.css?v=20260830-1'
          new = 'ask-hero.css?v=20260830-2'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one Ask hero stylesheet version marker, found {text.count(old)}')
          page.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')
          PY
          grep -F 'ask-hero.css?v=20260830-2' ask.html
          grep -F 'background-position: center 30%' ask-hero.css
          python tools/site_qa.py
          python tools/unified_experience_qa.py
          python tools/hardened_experience_qa.py
          node --check ask-experience.js

      - name: Commit cache-safe Ask crop and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ask.html
          git rm .github/workflows/ask-hero-cache-bust.yml
          git commit -m 'Publish cache-safe Ask hero crop refinement'
          git push origin HEAD:main
