name: Temporary final owner journey verification
on:
  push:
    branches:
      - codex/final-owner-journeys-47
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/final-owner-journeys-47
          fetch-depth: 0
      - name: Apply candidate 47 patch
        run: python tools/temp_exec47_patch.py
      - name: Update reviewed answer audit hash
        run: |
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const vm = require('vm');
          global.window = {};
          vm.runInThisContext(fs.readFileSync('reviewed-ask-knowledge.js','utf8'), {filename:'reviewed-ask-knowledge.js'});
          const registry = window.focusChristReviewedKnowledge;
          const entry = registry.entries.find((item) => item.id === 'church-book-of-mormon-publication-1830');
          if (!entry) throw new Error('new reviewed Book of Mormon entry missing');
          function stable(value) {
            if (Array.isArray(value)) return value.map(stable);
            if (!value || typeof value !== 'object') return value;
            return Object.keys(value).sort().reduce((out,key) => { out[key] = stable(value[key]); return out; }, {});
          }
          const hash = crypto.createHash('sha256').update(JSON.stringify(stable(entry))).digest('hex');
          const audit = JSON.parse(fs.readFileSync('answer-audit.json','utf8'));
          audit.reviewed_on = '2026-09-03';
          audit.reviewed_knowledge = audit.reviewed_knowledge.filter((item) => item.id !== entry.id);
          audit.reviewed_knowledge.push({
            id: entry.id,
            entry_sha256: hash,
            authoritative_sources: [
              'https://www.churchofjesuschrist.org/learn/locations/grandin-printshop?lang=eng',
              'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/historical-summary?lang=eng'
            ]
          });
          fs.writeFileSync('answer-audit.json', JSON.stringify(audit, null, 2) + '\n');
          console.log('Book of Mormon reviewed entry hash:', hash);
          NODE
      - name: Run executive release suite
        run: |
          node groq-proxy/source-policy.test.js
          node groq-proxy/church-source-index.test.js
          python tools/build_church_source_index.py --check
          python tools/site_qa.py
          python tools/unified_experience_qa.py
          python tools/resource_qa.py
          python tools/study_intelligence_qa.py
          python tools/hardened_experience_qa.py
          python tools/pioneer_local_first_qa.py
          python tools/production_hardening_qa.py
          python tools/church_history_qa.py
          python tools/scripture_grounding_qa.py
          python tools/source_integrity_inventory.py
          python tools/static_content_audit.py
          node tools/source_integrity_runtime_qa.js
          node tools/reviewed_ask_knowledge_qa.js
          node tools/pioneer_ask_runtime_qa.js
          node tools/church_history_ask_runtime_qa.js
          node tools/study_intelligence_v3_runtime_qa.js
          node tools/question_safety_runtime_qa.js
          node --check groq-proxy/src/index.js
          node --check tools/live_ai_response_matrix.js
          node --check tools/live_production_ask_qa.js
          node tools/live_ai_response_matrix.js --definition-check
          ! grep -R "reviewed-ask-knowledge.js?v=20260903-17" ask.html pioneers.html church-history.html tools/source_integrity_inventory.py tools/live_production_ask_qa.js
      - name: Commit verified production repair
        run: |
          git config user.name "focusChrist AI verification"
          git config user.email "actions@users.noreply.github.com"
          git add MEMORY.md answer-audit.json ask-question-contracts.json ask.html pioneers.html church-history.html reviewed-ask-knowledge.js groq-proxy/src/index.js groq-proxy/source-policy.test.js tools/reviewed_ask_knowledge_qa.js tools/live_production_ask_qa.js tools/live_ai_response_matrix.js tools/source_integrity_inventory.py tools/pioneer_local_first_qa.py tools/scripture_grounding_qa.py
          git commit -m "Harden final Ask owner journeys"
          git push origin HEAD:codex/final-owner-journeys-47
