name: Focus production asset localization

on:
  push:
    branches:
      - focus-production-sanity-20260830
    paths:
      - .github/workflows/focus-production-asset-localization.yml

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: focus-production-sanity-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check pillow
      - name: Download audited assets, verify exact bytes, and localize
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import hashlib, urllib.request, shutil

          sources = [
              ("1NWPUsngEeD59ld3wA23HT7z2Ge4Wcpca", "de8da59c35116cd1e43200e76ab5f2877e02b8f054ea5be4cf641d2df1710417", "assets/heroes/answers.webp", "copy", 95),
              ("1A-QViKaQ80YHgJtaeLZ_6X2yMDgx32JH", "e5dbca9bacb84f3da52d5f73e37f3edf04cb0e13cc90668d9711bd38d4b617a6", "assets/heroes/art.webp", "webp", 95),
              ("1wVOC_A1NeKq0JadLFeYkX49uTfbRacAI", "eb4dd027ded2b9bd2c36ee52d3fe38bc06a3aea54df1af02b6d6b55559881455", "assets/heroes/watch.webp", "webp", 95),
              ("12zX-BsQAH20zbzMZLGrPlBim904RmjCa", "508b1d7b6d1c4dff1f5d7f22e4402ef9e0a8842fe4c6e0af68573adc8c463cb8", "assets/heroes/about.webp", "webp", 95),
              ("1B1dzLdcOSCEf5ahk-wFAsd7IAJVaVjMk", "8357e8b40059819a79a1004704aaf01562fc01d97808cf540562170715209c6f", "assets/heroes/church-history.webp", "webp", 95),
              ("19IhXuUSdUQx7EgTgpM5BsFm9qX3s4UOo", "88031983d6e338e0d06ba08a35d33a3e7e2bba9ba8047e246fb2633742e122f9", "assets/heroes/ask.webp", "copy", 95),
              ("1q65yOBzmCkvvWDetz2kp4tS4sWYRHoZd", "1e9e952db879e67fe9518416892e25da2234d0b5bed7c6e232a95282eba07260", "assets/heroes/pioneers.webp", "copy", 95),
              ("1SppqkODHL1-omZbSqACwYinvtwqK4r-z", "13bc5370c34ca12d485debd25ed15e5e787a845adeb6f143a8179de4f85aa0a1", "art/new/the-saviors-invitation.webp", "webp", 94),
              ("1yD5W3I92EmlEj5beepV7cZxwgd4_oSdg", "12e23cc7a973c11d1294e7d2701a11e3dcd12fccbe7ab161e767201b455317ea", "art/new/rest-in-the-lord-trust-in-the-lord-psalms-37-7.webp", "webp", 94),
              ("1OkcYHcshVlev67kDztIBdzE46UFFUnK8", "7c414998cdd82b3c1ef351101dc16a71b6706e6e1015d158ec53cc547b4d9464", "art/new/see-that-ye-be-not-troubled-matthew-24-6.webp", "webp", 94),
              ("1JoLls3ZJtY0V3zfCC4kS8kN4lYj7duKr", "5f14af0c34ed16ea1a2036089b9cf355ae279e7889e312c3fb85e7e127cd5a6b", "art/new/joy-cometh-in-the-morning-psalm-30-5.webp", "webp", 94),
              ("1FD_VBYJ3XyzYK8T1_nO-4jQv4wvotz90", "aa58e91cdb8bc52c3817b1a912020a709378a2dc02f4246fed329a425fe89b1f", "art/new/blessed-be-the-name-of-the-lord-job-1-21.webp", "webp", 94),
              ("1wZmbozSrOHCIXKB8b7iWyLgo0poi6IDu", "698b566dfbe9e39147c5e73e30d20bab2ea6321335842ea022fb5603837e6c57", "art/new/there-is-a-green-hill-far-away.webp", "webp", 94),
              ("1GDOY10NCYCNMEBgp-XYkMeE83mD3tN-_", "5a1574e2cbf1b8bf766e253931021f5c57a6013af221e123ca84cc7bac6c8fa3", "art/new/make-a-joyful-noise-unto-god-psalm-66-1-2.webp", "webp", 94),
              ("1PKe5lvYbdlwFl3KYxHVM5ylAHKGPs-bZ", "664536cc058ac4e26ba753e5d1ec49a979209619ff891f66ef3fd24af510af96", "art/new/in-the-name-of-the-lord-of-hosts-1-samuel-17-45.webp", "webp", 94),
              ("1HTTuHQapktGeETeraeCtao_5W00bLMMN", "d0748aae0387ed91a41b629907598486736cd649d071dbd91c807e86ac9dd510", "art/new/there-is-a-greater-victory-ahead.webp", "webp", 94),
              ("1kl7rFYp5uqfrhwsWF_xnc22b063dO1EW", "57adb21f46e38b841c4407d39bbf5714a7e7afce95e0e9cbdd3783f7e83f1f31", "art/new/his-strength-and-redeeming-power-russell-m-nelson.webp", "webp", 94),
              ("1XYtPXOyPqQKMV18zUmi5EEPsHOxSomNV", "cdac3647d323300b5db14df9493808481a0c41a6698ad6bcfddeea390385a177", "art/new/god-will-feel-after-you-joseph-smith.webp", "webp", 94),
          ]

          tmp = Path(".asset-localization")
          tmp.mkdir(exist_ok=True)
          for idx, (file_id, expected_sha, output, mode, quality) in enumerate(sources):
              src = tmp / f"source-{idx}"
              url = f"https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t"
              urllib.request.urlretrieve(url, src)
              actual = hashlib.sha256(src.read_bytes()).hexdigest()
              if actual != expected_sha:
                  raise SystemExit(f"SHA256 mismatch for {file_id}: {actual} != {expected_sha}")
              dest = Path(output)
              dest.parent.mkdir(parents=True, exist_ok=True)
              if mode == "copy":
                  shutil.copyfile(src, dest)
              else:
                  with Image.open(src) as im:
                      im.convert("RGB").save(dest, "WEBP", quality=quality, method=6)
              with Image.open(dest) as check:
                  if check.width < 900 or check.height < 400:
                      raise SystemExit(f"Unexpected output dimensions for {dest}: {check.size}")

          home_src = Path("Jesus.png")
          home_dest = Path("assets/heroes/home.webp")
          home_dest.parent.mkdir(parents=True, exist_ok=True)
          with Image.open(home_src) as im:
              im.convert("RGB").save(home_dest, "WEBP", quality=95, method=6)
          with Image.open(home_dest) as check:
              if check.size != (1424, 752):
                  raise SystemExit(f"Unexpected Home hero dimensions: {check.size}")

          shutil.rmtree(tmp)
      - name: Commit localized production assets
        run: |
          git config user.name "focusChrist production bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/heroes art/new
          git commit -m "Localize and optimize production visual assets"
          git push origin HEAD:focus-production-sanity-20260830
