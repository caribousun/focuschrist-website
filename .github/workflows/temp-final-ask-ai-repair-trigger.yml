name: Trigger second final Ask AI repair

on:
  push:
    branches:
      - codex/final-ai-completion-20260903
    paths:
      - ".github/workflows/temp-final-ask-ai-repair-trigger.yml"

permissions:
  contents: write

jobs:
  prepare-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/final-ai-completion-20260903
          fetch-depth: 0
      - name: Refresh dependent QA policy and retrigger repair
        run: |
          python - <<'PY'
          from pathlib import Path
          qa = Path('tools/pioneer_local_first_qa.py')
          text = qa.read_text(encoding='utf-8')
          old = 'WORKER_POLICY = "2026-09-03.34"'
          new = 'WORKER_POLICY = "2026-09-03.35"'
          if old not in text and new not in text:
              raise SystemExit('Pioneer QA worker-policy anchor missing')
          qa.write_text(text.replace(old, new, 1), encoding='utf-8')
          repair = Path('.github/workflows/temp-final-ask-ai-repair.yml')
          body = repair.read_text(encoding='utf-8')
          marker = '# retry-after-dependent-policy-refresh\n'
          if marker not in body:
              repair.write_text(body + '\n' + marker, encoding='utf-8')
          PY
          git config user.name "focusChrist repair automation"
          git config user.email "actions@users.noreply.github.com"
          git add tools/pioneer_local_first_qa.py .github/workflows/temp-final-ask-ai-repair.yml
          git commit -m "Refresh Ask repair dependent QA policy"
          git push origin HEAD:codex/final-ai-completion-20260903
