name: Refine FocusChrist repository audit

on:
  push:
    branches:
      - focus/robustness-phase2
    paths:
      - '.github/workflows/refine-repository-audit.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine root-reference detection
        shell: python
        run: |
          from pathlib import Path

          path = Path('tools/repository-audit.py')
          text = path.read_text(encoding='utf-8')
          old = '''def references_for(target: Path, texts):
    target_rel = rel(target)
    name = target.name
    refs = []
    for source, text in texts.items():
        if source == target:
            continue
        if target_rel in text or name in text:
            refs.append(rel(source))
    return sorted(set(refs))
'''
          new = '''def references_for(target: Path, texts):
    target_rel = rel(target)
    name = target.name
    refs = []
    for source, text in texts.items():
        if source == target:
            continue
        if target.parent == ROOT:
            # A root filename inside art/<name> or another subdirectory is not
            # a reference to the root copy. Require a path/name boundary.
            pattern = re.compile(r'(?<![A-Za-z0-9_./-])' + re.escape(name) + r'(?![A-Za-z0-9_.-])')
            matched = bool(pattern.search(text))
        else:
            matched = target_rel in text
        if matched:
            refs.append(rel(source))
    return sorted(set(refs))
'''
          if old not in text:
              raise SystemExit('Expected references_for implementation not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Refresh audit report
        run: python tools/repository-audit.py

      - name: Run FocusChrist site QA
        run: python tools/site_qa.py

      - name: Commit refined audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/repository-audit.py repository-audit-phase2.md
          git commit -m "Refine repository duplicate reference detection"
          git push
