name: Normalize Unified Pioneer Diff

on:
  push:
    branches:
      - focus/unified-experience-phase1
    paths:
      - '.github/workflows/normalize-unified-pioneer.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore historical CRLF line endings without changing content
        shell: python
        run: |
          from pathlib import Path
          path = Path('pioneers.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('\r\n', '\n').replace('\r', '\n')
          path.write_bytes(text.replace('\n', '\r\n').encode('utf-8'))
      - name: Run structural and unified QA
        run: |
          python tools/site_qa.py
          python tools/unified_experience_qa.py
          node --check ask-experience.js
          node --check pioneer-experience.js
      - name: Commit normalized Pioneer bytes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pioneers.html
          git commit -m "Normalize Pioneer unified-experience diff" || exit 0
          git push
