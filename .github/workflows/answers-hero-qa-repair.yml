name: Answers Hero QA Repair

on:
  push:
    paths:
      - '.github/workflows/answers-hero-qa-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore shared Christ hero contract marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('answers.html')
          text = page.read_text(encoding='utf-8')
          old = '<div class="fc-visual-hero fc-visual-hero--answers" aria-label="Open scriptures and study materials overlooking a peaceful sunset landscape"></div>'
          new = '<div class="fc-visual-hero fc-visual-hero--christ fc-visual-hero--answers" aria-label="Open scriptures and study materials overlooking a peaceful sunset landscape"></div>'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one Answers hero marker, found {text.count(old)}')
          page.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')
          PY

      - name: Verify exact repair
        shell: bash
        run: |
          grep -F 'fc-visual-hero--christ fc-visual-hero--answers' answers.html
          grep -F 'answers-hero.css?v=20260830-1' answers.html
          git diff --check

      - name: Commit QA-compatible Answers hero
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add answers.html
          git commit -m 'Preserve Answers shared hero contract'
          git push origin HEAD:main
